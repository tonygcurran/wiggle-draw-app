  }

  /* notes on the month */
  const mnc = E('div', { cls: 'card' });
  mnc.append(E('h2', { text: 'Notes on the month' }));
  mnc.append(areaWithLinks(M, 'note', 'What this month was actually like.', 1, S.links));
  if ((M.note || '').trim() || (M.themes || []).length) mnc.append(tagRow(M, render, { cite: true }));
  v.append(mnc);

  /* review */
  M.review = M.review || {}; M.review.byGoal = M.review.byGoal || {}; M.snap = M.snap || {};
  const vc = E('div', { cls: 'card' });
  vc.append(E('h2', { text: MONTHS[m] + ' review' }));
  vc.append(E('p', { cls: 'lede', text: 'Fill this at the end of the month — it feeds the mid-year and yearly reviews.' }));

  /* top three, drawn from what actually got finished */
  M.review.top3 = M.review.top3 || [];
  const fin = finishedInMonth(Y, m);
  const t3 = E('div');
  for (let j = 0; j < 3; j++) t3.append(bindLine(M.review.top3, j, '', true));
  if (fin.length) {
    t3.append(E('button', { cls: 'btn ghost', style: 'padding-left:0;margin-top:6px',
      text: (monthPickOpen ? '\u2212' : '+') + ' From what you finished (' + fin.length + ')',
      onclick: () => { monthPickOpen = !monthPickOpen; render(); } }));
    if (monthPickOpen) {
      const list = E('div', { style: 'border-left:2px solid var(--rule);padding-left:11px;margin-top:6px;max-height:280px;overflow-y:auto' });
      fin.slice(0, 30).forEach(o => list.append(E('div', { cls: 'list-item' }, [
        E('div', { cls: 'txt' }, [E('div', { style: 'font-size:14px', text: o.text }),
          E('div', { cls: 'pct', text: o.from })]),
        E('button', { cls: 'tag acc', text: 'Use', onclick: () => {
          let slot = 2;
          for (let n = 0; n < 3; n++) if (!((M.review.top3[n] || '').trim())) { slot = n; break; }
          M.review.top3[slot] = o.text;
          monthPickOpen = false; save(true); render();
        }})
      ])));
      t3.append(list);
    }
  }
  vc.append(field('Top three things I accomplished this month', t3));

  /* goal by goal, with the movement made */
  const active = activeInMonth(Y, m);
  if (active.length) {
    vc.append(E('div', { cls: 'rule' }));
    vc.append(E('h3', { text: 'Goal by goal' }));
    active.forEach(a => {
      const was = M.snap[a.key];
      const moved = was === undefined ? null : a.pct - was;
      M.review.byGoal[a.key] = M.review.byGoal[a.key] || {};
      const blk = E('div', { style: 'padding:12px 0;border-top:1px solid var(--rule)' });
      blk.append(E('button', { style: 'display:flex;width:100%;justify-content:space-between;gap:10px;align-items:baseline;text-align:left',
        onclick: () => a.kind === 'project' ? go('goals', 'project', a.id) : go('goals', null, a.id) }, [
        E('span', { style: 'font-size:14.5px', text: a.obj.title || 'Untitled' }),
        E('span', { cls: 'pct', text: a.pct + '%' + (moved === null ? '' : moved > 0 ? '  \u2191' + moved : moved < 0 ? '  \u2193' + Math.abs(moved) : '  \u2014') })
      ]));
      blk.append(E('div', { cls: 'bar' }, E('i', { style: 'width:' + a.pct + '%' })));
      const carrying = habitsForGoal(a.id);
      if (carrying.length) {
        const line = carrying.map(h => (h.name || 'habit') + ' ' + habitMonthRate(h.id, Y, m).pct + '%').join(' \u00b7 ');
        blk.append(E('div', { cls: 'pct', style: 'margin-top:6px', text: 'Habits: ' + line }));
      }
      blk.append(field('How it went', bindArea(M.review.byGoal[a.key], 'felt')));
      blk.append(field('Next month', bindArea(M.review.byGoal[a.key], 'next')));
      vc.append(blk);
    });
    vc.append(E('div', { cls: 'btnrow' }, [
      E('button', { cls: 'btn', text: Object.keys(M.snap).length ? 'Update the mark' : 'Mark where they stand',
        onclick: () => { active.forEach(a => M.snap[a.key] = a.pct); save(true); render(); } })
    ]));
    vc.append(E('p', { cls: 'lede', style: 'margin-top:8px',
      text: 'Marking now lets next month show the movement rather than only the position.' }));
  }

  vc.append(E('div', { cls: 'rule' }));
  vc.append(renderFields(MONTH_REVIEW.filter(f => f.k !== 'top3'), M.review));
  v.append(vc);

  /* weeks of this month */
  const wc = E('div', { cls: 'card' });
  wc.append(E('h2', { text: 'Weeks' }));
  const total = weeksInYear(Y);
  for (let w = 1; w <= total; w++) {
    if (weekMonth(Y, w) !== m) continue;
    const W = S.weeks[weekKey(Y, w)], mon = mondayOf(Y, w);
    wc.append(E('button', { style: 'display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--rule);text-align:left',
      onclick: () => { R.wk = { y: Y, w }; go('week'); } }, [
      E('span', {}, [E('span', { cls: 'eyebrow', text: 'W' + pad(w) + '  ' }),
        E('span', { style: 'font-size:14px', text: (W && W.focus ? W.focus.split('\n')[0].slice(0, 40) : mon.getDate() + ' ' + MONTHS[mon.getMonth()].slice(0, 3)) })]),
      E('span', { cls: 'pct', text: W && W.rate ? W.rate + '/10' : '–' })
    ]));
  }
  v.append(wc);
  return v;
}


/* ===================== GOALS ===================== */
function childrenOf(id) { return S.goals.filter(g => (g.parents || []).includes(id)); }
function servedBy(g) { return (g.parents || []).map(id => S.goals.find(x => x.id === id)).filter(Boolean); }
/* a goal cannot serve itself or anything already beneath it */
function descendants(id, seen) {
  seen = seen || new Set();
  childrenOf(id).forEach(c => { if (!seen.has(c.id)) { seen.add(c.id); descendants(c.id, seen); } });
  return seen;
}
function rangeProgress(g) {
  const kids = childrenOf(g.id);
  if (!kids.length) return goalProgress(g);
  const own = g.milestones.length || g.actions.length ? goalProgress(g) : null;
  const kidAvg = Math.round(kids.reduce((a, k) => a + (k.completed ? 100 : goalProgress(k)), 0) / kids.length);
  return own === null ? kidAvg : Math.round((own + kidAvg) / 2);
}
function goalYear(g) {
  if (g.targetYear) return Number(g.targetYear);
  if (g.due) return Number(g.due.slice(0, 4));
  return null;
}
function viewGoals() {
  const v = E('div');
  v.append(E('div', { cls: 'topbar' }, E('div', {}, [
    E('div', { cls: 'eyebrow', text: 'Strategy' }),
    E('h1', { text: 'Goals' }),
    E('div', { cls: 'sub', text: S.goals.filter(g => !g.completed).length + ' open \u00b7 ' +
      openProjects().length + ' project' + (openProjects().length === 1 ? '' : 's') + ' \u00b7 ' +
      S.goals.filter(g => g.completed).length + ' achieved' })
  ])));

  const section = (title, kind, note) => {
    const c = E('div', { cls: 'card' });
    c.append(E('div', { cls: 'head' }, [E('h2', { text: title }),
      E('button', { cls: 'btn ghost', text: '+ New', onclick: () => { const g = newGoal(kind); S.goals.push(g); save(true); go('goals', null, g.id); } })]));
    const list = S.goals.filter(g => g.kind === kind);
    if (!list.length) c.append(E('div', { cls: 'empty', text: note }));
    list.forEach(g => {
      const p = goalProgress(g);
      const kids = kind === 'range' ? childrenOf(g.id) : [];
      const shown = kind === 'range' ? rangeProgress(g) : p;
      c.append(E('button', { style: 'display:block;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--rule)',
        onclick: () => go('goals', null, g.id) }, [
        E('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:baseline' }, [
          E('span', { style: g.completed ? 'color:var(--faint);text-decoration:line-through' : '', text: g.title || 'Untitled goal' }),
          E('span', { cls: 'pct', text: g.completed ? 'Done' : shown + '%' })
        ]),
        E('div', { cls: 'pct', style: 'margin-top:3px', text: [
          kind === 'range' ? ((RANGE_HORIZONS.find(h => h[0] === g.horizon) || [, ''])[1] +
            (goalYear(g) ? ' · by ' + goalYear(g) : '')) : (g.when ? 'By ' + g.when : ''),
          kids.length ? kids.length + ' goal' + (kids.length === 1 ? '' : 's') + ' feeding it' : '',
          (g.parents || []).length ? 'serves ' + servedBy(g).map(x => x.title || 'untitled').join(', ') : ''
        ].filter(Boolean).join(' · ') }),
        E('div', { cls: 'bar' }, E('i', { style: 'width:' + (g.completed ? 100 : shown) + '%' }))
      ]));
    });
    return c;
  };
  v.append(section('Long-range', 'range', 'Three years, ten years, a life\u2019s work. These outlast the planner year — this year\u2019s goals ladder up to them.'));
  v.append(section('Long-term goals', 'long', 'Six months and beyond. Three is plenty.'));
  v.append(section('Short-term goals', 'short', 'One to twelve weeks. These are the ones that build momentum.'));

  v.append(projectsCard());

  /* the long view */
  const dated = S.goals.filter(g => !g.completed && goalYear(g));
  const lifelong = S.goals.filter(g => !g.completed && g.kind === 'range' && !goalYear(g));
  if (dated.length || lifelong.length) {
    const hc = E('div', { cls: 'card' });
    hc.append(E('h2', { text: 'The long view' }));
    const years = Array.from(new Set(dated.map(goalYear))).sort((a, b) => a - b);
    years.forEach(y => {
      const list = dated.filter(g => goalYear(g) === y);
      hc.append(E('div', { style: 'display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--rule)' }, [
        E('div', { style: 'flex:none;width:46px' }, [
          E('div', { style: 'font-family:var(--disp);font-size:19px;font-weight:700;line-height:1;color:' +
            (y === CURRENT_YEAR ? 'var(--acc)' : 'var(--ink)'), text: y }),
          E('div', { cls: 'pct', text: y === CURRENT_YEAR ? 'now' : '+' + (y - CURRENT_YEAR) })
        ]),
        E('div', { style: 'flex:1;min-width:0' }, list.map(g => E('button', {
          style: 'display:block;width:100%;text-align:left;padding:2px 0;font-size:14.5px',
          onclick: () => go('goals', null, g.id) },
          [g.title || 'Untitled goal', g.kind === 'range' ? E('span', { cls: 'tag acc', style: 'margin-left:7px', text: 'range' }) : null])))
      ]));
    });
    lifelong.forEach(g => hc.append(E('div', { style: 'display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--rule)' }, [
      E('div', { cls: 'eyebrow', style: 'flex:none;width:46px', text: 'Life' }),
      E('button', { style: 'flex:1;text-align:left;font-size:14.5px', text: g.title || 'Untitled goal',
        onclick: () => go('goals', null, g.id) })
    ])));
    v.append(hc);
  }

  /* brain dump */
  const bc = E('div', { cls: 'card' });
  bc.append(E('h2', { text: 'Brain dump' }));
  bc.append(E('p', { cls: 'lede', text: 'Everything you could work on this year. Let it run wild, then promote the ones that matter — no more than eight.' }));
  S.dump.forEach((it, i) => {
    bc.append(E('div', { cls: 'list-item' }, [
      E('div', { cls: 'txt' }, (() => {
        const ta = E('textarea', { rows: 1, oninput: e => { grow(e.target); it.t = e.target.value; save(); } });
        ta.value = it.t; requestAnimationFrame(() => grow(ta)); return ta;
      })()),
      E('button', { cls: 'tag acc', text: 'Make goal', onclick: () => {
        const g = newGoal('short'); g.title = it.t; S.goals.push(g);
        S.dump.splice(i, 1); save(true); go('goals', null, g.id);
      }}),
      E('button', { cls: 'x', text: '×', onclick: () => { S.dump.splice(i, 1); save(); render(); } })
    ]));
  });
  if (!S.dump.length) bc.append(E('div', { cls: 'empty', text: 'Empty. Add ideas as they arrive — this is your inbox.' }));
  bc.append(E('button', { cls: 'btn', style: 'margin-top:12px', text: '+ Add idea',
    onclick: () => { S.dump.push({ id: uid(), t: '' }); save(); render(); } }));
  v.append(bc);
  return v;
}

function viewGoal(id) {
  const g = S.goals.find(x => x.id === id);
  if (!g) { R.id = null; return viewGoals(); }
  const long = g.kind === 'long';
  const v = E('div');
  const p = goalProgress(g);

  v.append(E('button', { cls: 'btn ghost', text: '‹ Goals', onclick: () => go('goals') }));
  v.append(E('div', { style: 'margin:6px 0 14px' }, [
    E('div', { cls: 'eyebrow', text: (g.kind === 'range' ? 'Long-range' : long ? 'Long-term' : 'Short-term') + ' goal' }),
    (() => {
      const ta = E('textarea', { rows: 1, placeholder: 'Name the goal',
        style: 'font-family:var(--disp);font-size:30px;line-height:1.02;text-transform:uppercase;font-weight:700;border:0;padding:4px 0',
        oninput: e => { grow(e.target); g.title = e.target.value; save(); } });
      ta.value = g.title; requestAnimationFrame(() => grow(ta)); return ta;
    })(),
    E('div', { cls: 'bar' }, E('i', { style: 'width:' + (g.completed ? 100 : p) + '%' })),
    E('div', { cls: 'pct', style: 'margin-top:6px', text: g.completed ? 'Achieved ' + g.completed : p + '% complete' })
  ]));

  /* type */
  const tc = E('div', { cls: 'card' });
  const isRange = g.kind === 'range';
  const opts = isRange ? RANGE_HORIZONS
             : long ? [['long', 'Long (6 months +)'], ['med', 'Medium (3\u20136 months)']]
                    : [['short', 'Short (1\u201312 weeks)'], ['med', 'Medium (3\u20136 months)']];
  const chips = E('div', { cls: 'chips' });
  opts.forEach(([k, label]) => chips.append(E('button', {
    cls: 'chip' + (g.horizon === k ? ' on' : ''), style: g.horizon === k ? 'background:var(--acc)' : '',
    text: label, onclick: () => { g.horizon = k; save(); render(); }
  })));
  tc.append(field('Type', chips));
  if (isRange) {
    tc.append(field('Target year', bindText(g, 'targetYear', 'e.g. ' + (CURRENT_YEAR + 5) + ', or leave blank for a life\u2019s work', 'number')));
  } else {
    tc.append(field('When do I want to achieve this by?', bindText(g, 'when', 'e.g. end of October')));
    tc.append(field('Deadline date (for Calendar and Reminders)', bindText(g, 'due', '', 'date')));
  }

  /* what this goal is in service of — any number of larger goals */
  g.parents = g.parents || [];
  const below = descendants(g.id);
  const eligible = S.goals.filter(x => x.id !== g.id && !below.has(x.id) && !x.completed);
  if (eligible.length) {
    const box = E('div');
    eligible.forEach(x => {
      const on = g.parents.includes(x.id);
      box.append(E('button', { style: 'display:flex;width:100%;gap:9px;align-items:center;padding:9px 0;border-top:1px solid var(--rule);text-align:left',
        onclick: () => {
          const i = g.parents.indexOf(x.id);
          i < 0 ? g.parents.push(x.id) : g.parents.splice(i, 1);
          save(true); render();
        }}, [
        E('span', { cls: 'box' + (on ? ' on' : ''), style: 'flex:none;margin-top:0',
          html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>' }),
        E('span', { style: 'flex:1;min-width:0;font-size:14.5px', text: x.title || 'Untitled goal' }),
        E('span', { cls: 'pct', text: x.kind === 'range' ? 'long-range' : x.kind + '-term' })
      ]));
    });
    tc.append(field('In service of', box));
    if (!g.parents.length) tc.append(E('p', { cls: 'lede', style: 'margin:6px 0 0',
      text: 'Stands on its own. Tick any number \u2014 a single body of work often serves more than one long ambition.' }));
  }
  v.append(tc);

  /* the shape of it */
  const wc = E('div', { cls: 'card on' });
  if (long) {
    g.links = g.links || [];
    wc.append(field('Brainstorm / mind map', areaWithLinks(g, 'brainstorm', 'Everything attached to this goal.', 1, g.links)));
    wc.append(field('What', areaWithLinks(g, 'what', '', 0, g.links)));
    wc.append(field('Why', areaWithLinks(g, 'why', '', 0, g.links)));
    wc.append(field('How', areaWithLinks(g, 'how', '', 0, g.links)));
  } else {

  v.append(rc);

  v.append(E('button', { cls: 'btn', style: 'color:#B23A3A;border-color:#E2C4C4', text: 'Delete goal',
    onclick: () => { if (confirm('Delete this goal? This cannot be undone.')) { S.goals = S.goals.filter(x => x.id !== id); save(true); go('goals'); } } }));
  return v;
}


/* ===================== projects ===================== */
/* A project serves one or more goals, has a completion date, and holds
   tasks. Day and week tasks can nest inside it. */

const newProject = () => ({ id: uid(), title: '', due: '', goals: [], notes: '',
  tasks: [], costs: [], budget: '', done: '', created: iso(new Date()) });

const projectById = id => S.projects.find(p => p.id === id);
const openProjects = () => S.projects.filter(p => !p.done);

/* scheduled work pointing at this project */
function tasksForProject(id) {
  const out = [];
  Object.keys(S.days).sort().forEach(dk => (S.days[dk].tasks || []).forEach(t => {
    if (t.p === id) out.push({ where: dk, t });
  }));
  Object.keys(S.weeks).sort().forEach(wk => (S.weeks[wk].todos || []).forEach(t => {
    if (t.p === id) out.push({ where: wk.replace('-W', ' week '), t });
  }));
  return out;
}
function projectProgress(p) {
  const own = (p.tasks || []).filter(t => (t.t || '').trim());
  const sched = tasksForProject(p.id);
  const total = own.length + sched.length;
  if (!total) return p.done ? 100 : 0;
  return Math.round((own.filter(t => t.d).length + sched.filter(x => x.t.d).length) / total * 100);
}
/* money spent against a project: its own lines, plus costs carried on tasks */
function taskCostsFor(pid) {
  const out = [];
  Object.keys(S.days).sort().forEach(dk => (S.days[dk].tasks || []).forEach(t => {
    if (t.p === pid && num(t.c)) out.push({ t: t.t, v: num(t.c), where: dk });
  }));
  Object.keys(S.weeks).sort().forEach(wk => (S.weeks[wk].todos || []).forEach(t => {
    if (t.p === pid && num(t.c)) out.push({ t: t.t, v: num(t.c), where: wk.replace('-W', ' week ') });
  }));
  (projectById(pid) || { tasks: [] }).tasks.forEach(t => {
    if (num(t.c)) out.push({ t: t.t, v: num(t.c), where: 'planned' });
  });
  return out;
}
function projectSpent(p) {
  return (p.costs || []).reduce((a, c) => a + num(c.v), 0) +
    taskCostsFor(p.id).reduce((a, c) => a + c.v, 0);
}
/* everything committed toward a goal, through its projects and its own tasks */
function goalSpent(gid) {
  let total = S.projects.filter(p => (p.goals || []).includes(gid)).reduce((a, p) => a + projectSpent(p), 0);
  const seen = new Set();
  Object.keys(S.days).forEach(dk => (S.days[dk].tasks || []).forEach(t => {
    if (t.g === gid && !t.p && num(t.c)) total += num(t.c);
  }));
  Object.keys(S.weeks).forEach(wk => (S.weeks[wk].todos || []).forEach(t => {
    if (t.g === gid && !t.p && num(t.c)) total += num(t.c);
  }));
  return total;
}

function daysUntil(d) { return d ? Math.round((parseIso(d) - new Date()) / 86400000) : null; }
function dueLabel(d) {
  const n = daysUntil(d);
  if (n === null) return '';
  if (n < 0) return Math.abs(n) + ' day' + (Math.abs(n) === 1 ? '' : 's') + ' overdue';
  if (n === 0) return 'due today';
  if (n === 1) return 'due tomorrow';
  if (n < 42) return n + ' days left';
  return 'due ' + d;
}

/* ---------- year ring ---------- */
function pageYear() {
  const v = E('div');
  v.append(backBar('Year at a glance'));
  v.append(E('div', { style: 'margin:-6px 0 12px' }, yearPicker()));
  v.append(E('p', { cls: 'lede', text: 'Each spoke is a week, coloured by its month and drawn to the score you gave it. Tap one to open that week.' }));

  const total = weeksInYear(R.year), C = 150, R0 = 52, NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 300 300'); svg.setAttribute('class', 'wheel');
  const cur = isoWeek(new Date());
  for (let w = 1; w <= total; w++) {
    const W = S.weeks[weekKey(R.year, w)], m = weekMonth(R.year, w);
    const a0 = (w - 1) / total * Math.PI * 2 - Math.PI / 2, a1 = w / total * Math.PI * 2 - Math.PI / 2;
    const a = (a0 + a1) / 2, len = W && W.rate ? 12 + W.rate * 8 : 6;
    const g = document.createElementNS(NS, 'line');
    g.setAttribute('x1', C + Math.cos(a) * R0); g.setAttribute('y1', C + Math.sin(a) * R0);
    g.setAttribute('x2', C + Math.cos(a) * (R0 + len)); g.setAttribute('y2', C + Math.sin(a) * (R0 + len));
    g.setAttribute('stroke', W && W.rate ? `hsl(${hueOf(m)},64%,48%)` : '#D9D8D3');
    g.setAttribute('stroke-width', 300 / total * 0.62); g.setAttribute('stroke-linecap', 'butt');
    if (w === cur.w) g.setAttribute('stroke', `hsl(${hueOf(m)},70%,38%)`);
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => { R.wk = { y: R.year, w }; go('week'); });
    svg.appendChild(g);
  }
  MONTHS.forEach((mo, i) => {
    const a = (i + .5) / 12 * Math.PI * 2 - Math.PI / 2;
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', C + Math.cos(a) * 138); t.setAttribute('y', C + Math.sin(a) * 138 + 3);
    t.setAttribute('text-anchor', 'middle'); t.setAttribute('font-size', '9');
    t.setAttribute('fill', `hsl(${hueOf(i)},55%,44%)`);
    t.setAttribute('font-family', 'var(--disp)'); t.setAttribute('letter-spacing', '.1em');
    t.textContent = mo.slice(0, 3).toUpperCase();
    svg.appendChild(t);
  });
  const mid = document.createElementNS(NS, 'text');
  mid.setAttribute('x', C); mid.setAttribute('y', C + 8); mid.setAttribute('text-anchor', 'middle');
  mid.setAttribute('font-size', '30'); mid.setAttribute('font-family', 'var(--disp)');
  mid.setAttribute('fill', '#15171B'); mid.textContent = R.year;
  svg.appendChild(mid);

  const c = E('div', { cls: 'card' }); c.append(svg); v.append(c);

  const gl = E('div', { cls: 'card' });
  gl.append(E('h2', { text: R.year + ' at a glance' }));
  gl.append(renderFields(FOUNDATIONS.find(s => s.id === 'glance').f, YF()));
  v.append(gl);
  return v;
}

/* ---------- merging the earlier apps ---------- */
function mergeLimbs(days) {
  let n = 0;
  Object.entries(days || {}).forEach(([k, e]) => {
    if (!e || (!e.marks && !e.notes)) return;
    const cur = S.limbs.days[k] || { marks: {}, notes: {} };
    S.limbs.days[k] = { marks: Object.assign({}, e.marks || {}, cur.marks),
                        notes: Object.assign({}, e.notes || {}, cur.notes) };
    n++;
  });
  return n;
}
function mergeStudio(data) {
  if (!data) return 0;
  if (data.project && !S.studio.project.title) S.studio.project = data.project;
  const have = new Set(S.studio.entries.map(e => e.id));
  let n = 0;
  (data.entries || []).forEach(e => {
    if (have.has(e.id)) return;
    S.studio.entries.push(Object.assign({ media: [], themes: [], goal: '' }, e));
    n++;
  });
  return n;
}
function importLegacy(key) {
  let raw = null;
  try { raw = localStorage.getItem(key); } catch (e) {}
  if (!raw) { toast('Nothing stored here'); return; }
  try {
    const data = JSON.parse(raw);
    const n = key === 'eightlimbs' ? mergeLimbs(data) : mergeStudio(data);
    save(true); render();
    toast(n + (key === 'eightlimbs' ? ' days merged' : ' sessions merged'));
  } catch (e) { toast('Could not read it'); }
}
function importLegacyText(text) {
  /* accepts a JSON export from either app, or the whole HTML file with data inside */
  let data = null;
  try { data = JSON.parse(text); } catch (e) {}
  if (!data) { toast('Could not read that file'); return; }
  let n = 0;
  if (data.entries) n = mergeStudio(data);
  else if (data.limbs || data.studio) { n = mergeLimbs((data.limbs || {}).days) + mergeStudio(data.studio); }
  else n = mergeLimbs(data);
  save(true); render();
  toast(n ? n + ' merged' : 'Nothing new found');
}

      if (o.pr.id !== lastPr) {
        lastPr = o.pr.id;
        const n = daysUntil(o.pr.due);
        c.append(E('button', { style: 'display:block;width:100%;text-align:left;margin:14px 0 2px',
          onclick: () => go('goals', 'project', o.pr.id) }, [
          E('h3', { style: 'margin:0', text: o.pr.title || 'Untitled project' }),
          o.pr.due ? E('div', { cls: 'pct', style: n !== null && n < 0 ? 'color:#B23A3A' : '', text: dueLabel(o.pr.due) }) : null
        ]));
      }
      c.append(E('div', { cls: 'list-item' }, [
        E('button', { cls: 'box', style: 'flex:none',
          html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>',
          onclick: () => { o.t.d = true; save(true); render(); } }),
        E('div', { cls: 'txt' }, E('div', { style: 'font-size:14.5px', text: o.t.t })),
        E('button', { cls: 'tag acc', text: 'Today', onclick: () => {
          if (!o.t.id) o.t.id = uid();
          const item = takeProjectTask(o.pr.id, o.t.id);
          if (item) { day(today).tasks.push(item); save(true); }
          render();
        }})
      ]));
    });
    v.append(c);
  }

  const stale = dayOpen.filter(o => (new Date() - parseIso(o.dk)) / 86400000 > 30);
  if (stale.length) {
    const c = E('div', { cls: 'card' });
    c.append(E('h2', { text: 'Older than a month' }));
    c.append(E('p', { cls: 'lede', text: stale.length + ' item' + (stale.length === 1 ? '' : 's') +
      ' have sat unticked for over thirty days. If they still mattered they would have moved by now.' }));
    c.append(E('button', { cls: 'btn', style: 'color:#B23A3A;border-color:#E2C4C4',
      text: 'Clear all ' + stale.length, onclick: () => {
        if (!confirm('Remove ' + stale.length + ' items older than thirty days?')) return;
        stale.slice().reverse().forEach(o => S.days[o.dk].tasks.splice(o.i, 1));
        save(true); render();
      }}));
    v.append(c);
  }
  return v;
}

/* ===================== balance sheet and cashflow ===================== */
/* Assets, liabilities and recurring flows carry across years, so they live
   outside the per-year budget prompts. */

const FREQ = [['m', 'monthly', 1], ['w', 'weekly', 52 / 12], ['f', 'fortnightly', 26 / 12],
              ['q', 'quarterly', 1 / 3], ['y', 'yearly', 1 / 12]];
const freqMul = k => (FREQ.find(f => f[0] === k) || FREQ[0])[2];
const freqName = k => (FREQ.find(f => f[0] === k) || FREQ[0])[1];

function finance() {
  S.finance = S.finance || { assets: [], liabs: [], flows: [], snaps: [] };
  ['assets', 'liabs', 'flows', 'snaps'].forEach(k => S.finance[k] = S.finance[k] || []);
  return S.finance;
}
const num = v => { const n = parseFloat(String(v || '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const money = n => (n < 0 ? '\u2212' : '') + Math.abs(Math.round(n)).toLocaleString();
const sumOf = arr => arr.reduce((a, x) => a + num(x.v), 0);
const monthlyOf = (arr, kind) => arr.filter(x => x.k === kind)
  .reduce((a, x) => a + num(x.v) * freqMul(x.f), 0);

/* one editable line: a name, an amount, optionally a frequency */
function moneyRow(arr, i, redraw, withFreq) {
  const x = arr[i];
  const name = E('input', { type: 'text', placeholder: 'Name',
    oninput: e => { x.n = e.target.value; save(); } });
  name.value = x.n || '';
  const amt = E('input', { type: 'text', inputmode: 'decimal', placeholder: '0',
    style: 'text-align:right',
    oninput: e => { x.v = e.target.value; save(); },
    onblur: () => redraw() });
  amt.value = x.v || '';
  const row = E('div', { style: 'padding:7px 0;border-top:1px solid var(--rule)' });
  row.append(E('div', { style: 'display:flex;gap:9px;align-items:center' }, [
    E('div', { style: 'flex:1;min-width:0' }, name),
    E('div', { style: 'width:88px' }, amt),
    E('button', { cls: 'x', text: '\u00d7', 'aria-label': 'Remove',
      onclick: () => { arr.splice(i, 1); save(); redraw(); } })
  ]));
  if (withFreq) {
    const chips = E('div', { cls: 'chips', style: 'margin-top:5px' });
    FREQ.forEach(([k, label]) => chips.append(E('button', {
      cls: 'chip' + (x.f === k ? ' on' : ''),
      style: (x.f === k ? 'background:var(--acc);' : '') + 'font-size:11px;padding:4px 9px',
      text: label, onclick: () => { x.f = k; save(); redraw(); } })));
    row.append(chips);
  }
  return row;
}

function budgetSections(v) {
  const F = finance();

  /* ---- what comes in and goes out ---- */
  const inM = monthlyOf(F.flows, 'in'), outM = monthlyOf(F.flows, 'out');
  const surplus = inM - outM;

  const fc = E('div', { cls: 'card on' });
  fc.append(E('h2', { text: 'Every month' }));
  fc.append(E('div', { style: 'display:grid;grid-template-columns:repeat(3,1fr);gap:10px' }, [
    E('div', { cls: 'stat' }, [E('b', { text: money(inM) }), E('span', { text: 'In' })]),
    E('div', { cls: 'stat' }, [E('b', { text: money(outM) }), E('span', { text: 'Out' })]),
    E('div', { cls: 'stat' }, [E('b', { style: 'color:' + (surplus < 0 ? '#B23A3A' : 'var(--acc)'),
      text: money(surplus) }), E('span', { text: surplus < 0 ? 'Short' : 'Left over' })])
  ]));
  if (inM > 0) {
    fc.append(E('div', { cls: 'bar', style: 'margin-top:12px' },
      E('i', { style: 'width:' + Math.min(100, Math.round(outM / inM * 100)) + '%;background:' +
        (surplus < 0 ? '#B23A3A' : 'var(--acc)') })));
    fc.append(E('div', { cls: 'pct', style: 'margin-top:6px',
      text: Math.round(outM / inM * 100) + '% of what comes in goes out \u00b7 saving ' +
        Math.max(0, Math.round(surplus / inM * 100)) + '%' }));
  }

  [['in', 'Coming in', 'Salary, commissions, royalties, grants'],
   ['out', 'Going out', 'Rent or mortgage, studio, insurance, subscriptions, materials']]
  .forEach(([kind, label, hint]) => {
    const box = E('div', { style: 'margin-top:16px' });
    box.append(E('h3', { text: label }));
    const rows = F.flows.map((x, i) => [x, i]).filter(([x]) => x.k === kind);
    if (!rows.length) box.append(E('div', { cls: 'empty', text: hint }));
    rows.forEach(([, i]) => box.append(moneyRow(F.flows, i, render, true)));
    const sub = monthlyOf(F.flows, kind);
    if (rows.length) box.append(E('div', { cls: 'pct', style: 'text-align:right;padding-top:7px',
      text: money(sub) + ' a month' }));
    box.append(E('button', { cls: 'btn ghost', style: 'margin-top:8px', text: '+ Add',
      onclick: () => { F.flows.push({ id: uid(), n: '', v: '', f: 'm', k: kind }); save(); render(); } }));
    fc.append(box);
  });
  v.append(fc);

}

/* the balance sheet in the export */
function financeMarkdown(out, put) {
  const F = finance();
  if (!F.flows.length && !F.assets.length && !F.liabs.length &&
      !S.projects.some(p => num(p.budget) || projectSpent(p))) return;
  out.push('\n## Money\n');
  const liveP = S.projects.filter(p => num(p.budget) || projectSpent(p));
  if (liveP.length) {
    out.push('**Project budgets**');
    liveP.forEach(p => out.push('- ' + (p.title || 'Untitled project') + ' — ' +
      money(projectSpent(p)) + (num(p.budget) ? ' of ' + money(num(p.budget)) : ' committed') +
      ((p.goals || []).length ? '. Serves ' + p.goals.map(id => (S.goals.find(g => g.id === id) || {}).title || 'a goal').join(', ') : '')));
    out.push('');
  }
  const inM = monthlyOf(F.flows, 'in'), outM = monthlyOf(F.flows, 'out');
  if (F.flows.length) {
    out.push('**Every month**  \nIn ' + money(inM) + ', out ' + money(outM) +
      ', leaving ' + money(inM - outM) + '.\n');
    ['in', 'out'].forEach(k => {
      const rows = F.flows.filter(x => x.k === k && (x.n || x.v));
      if (!rows.length) return;
      out.push('**' + (k === 'in' ? 'Coming in' : 'Going out') + '**');
      rows.forEach(x => out.push('- ' + (x.n || 'Unnamed') + ' — ' + money(num(x.v)) + ' ' + freqName(x.f)));
      out.push('');
    });
  }
  if (F.assets.length || F.liabs.length) {
    out.push('**Balance sheet**  \nAssets ' + money(sumOf(F.assets)) + ', liabilities ' +
      money(sumOf(F.liabs)) + ', net ' + money(sumOf(F.assets) - sumOf(F.liabs)) + '.\n');
    [['assets', 'Assets'], ['liabs', 'Liabilities']].forEach(([k, label]) => {
      if (!F[k].length) return;
      out.push('**' + label + '**');
      F[k].forEach(x => out.push('- ' + (x.n || 'Unnamed') + ' — ' + money(num(x.v))));
      out.push('');
    });
  }
  if (F.snaps.length > 1) {
    out.push('**Net position over time**');
    F.snaps.forEach(s => out.push('- ' + s.ym + ': ' + money(s.net)));
    out.push('');
  }
}
function wealthSections(v) {
  const F = finance();
  const A = sumOf(F.assets), L = sumOf(F.liabs), net = A - L;
  const bc = E('div', { cls: 'card' });
  bc.append(E('h2', { text: 'What you own and owe' }));
  bc.append(E('div', { style: 'display:grid;grid-template-columns:repeat(3,1fr);gap:10px' }, [
    E('div', { cls: 'stat' }, [E('b', { text: money(A) }), E('span', { text: 'Assets' })]),
    E('div', { cls: 'stat' }, [E('b', { text: money(L) }), E('span', { text: 'Liabilities' })]),
    E('div', { cls: 'stat' }, [E('b', { style: 'color:' + (net < 0 ? '#B23A3A' : 'var(--acc)'), text: money(net) }),
      E('span', { text: 'Net' })])
  ]));

  [['assets', 'Assets', 'Cash, super, property, equipment, unsold work'],
   ['liabs', 'Liabilities', 'Mortgage, loans, cards, study debt']]
  .forEach(([key, label, hint]) => {
    const box = E('div', { style: 'margin-top:16px' });
    box.append(E('h3', { text: label }));
    if (!F[key].length) box.append(E('div', { cls: 'empty', text: hint }));
    F[key].forEach((x, i) => box.append(moneyRow(F[key], i, render)));
    if (F[key].length) box.append(E('div', { cls: 'pct', style: 'text-align:right;padding-top:7px',
      text: money(sumOf(F[key])) }));
    box.append(E('button', { cls: 'btn ghost', style: 'margin-top:8px', text: '+ Add',
      onclick: () => { F[key].push({ id: uid(), n: '', v: '' }); save(); render(); } }));
    bc.append(box);
  });

  /* ---- the trend ---- */
  const ym = iso(new Date()).slice(0, 7);
  const already = F.snaps.find(s => s.ym === ym);
  bc.append(E('div', { cls: 'rule' }));
  if (F.snaps.length > 1) {
    const NS = 'http://www.w3.org/2000/svg';
    const vals = F.snaps.map(s => s.net), lo = Math.min(...vals, 0), hi = Math.max(...vals, 1);
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 300 70');
    svg.setAttribute('style', 'width:100%;height:70px;display:block');
    const pts = F.snaps.map((s, i) => {
      const x = F.snaps.length === 1 ? 0 : i / (F.snaps.length - 1) * 296 + 2;
      const y = 66 - (s.net - lo) / (hi - lo || 1) * 60;
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const line = document.createElementNS(NS, 'polyline');
    line.setAttribute('points', pts);
    line.setAttribute('fill', 'none');
    line.setAttribute('stroke', 'hsl(var(--hue),68%,44%)');
    line.setAttribute('stroke-width', '2');
    svg.appendChild(line);
    bc.append(svg);
    const first = F.snaps[0], last = F.snaps[F.snaps.length - 1];
    bc.append(E('div', { cls: 'pct', text: first.ym + ' to ' + last.ym + ' \u00b7 ' +
      (last.net >= first.net ? 'up ' : 'down ') + money(Math.abs(last.net - first.net)) }));
  }
  bc.append(E('div', { cls: 'btnrow' }, [
    E('button', { cls: 'btn' + (already ? '' : ' fill'),
      text: already ? 'Update this month\u2019s figure' : 'Record this month',
      onclick: () => {
        const rec = { ym, assets: A, liabs: L, net };
        const i = F.snaps.findIndex(s => s.ym === ym);
        i < 0 ? F.snaps.push(rec) : F.snaps[i] = rec;
        F.snaps.sort((a, b) => a.ym < b.ym ? -1 : 1);
        save(true); render();
      }})
  ]));
  bc.append(E('p', { cls: 'lede', style: 'margin-top:10px',
    text: 'Recording once a month builds the only line that matters here \u2014 the direction of travel, not the number on any given day.' }));
  v.append(bc);
}

}

/* ===================== markdown export ===================== */
function toMarkdown() {
  const out = [];
  const put = (label, val) => { if (val && String(val).trim()) out.push('**' + label + '**  \n' + String(val).trim() + '\n'); };
  const putList = (label, arr) => {
    const items = (arr || []).filter(x => x && String(x).trim());
    if (items.length) out.push('**' + label + '**\n' + items.map(x => '- ' + x).join('\n') + '\n');
  };
  out.push('# Goal Digger\n');
  out.push('_Exported ' + iso(new Date()) + '_\n');

  yearsPresent().forEach(Y => { exportYear(Y, out, put, putList); });
  out.push('\n## Goals\n');
  S.goals.forEach(g => {
    out.push('\n### ' + (g.title || 'Untitled') + ' (' + g.kind + '-term, ' + goalProgress(g) + '%)\n');
    put('What', g.what); put('Why', g.why); put('How', g.how);
    put('When', g.when); put('Feeling I am chasing', g.feeling); put('Reward', g.reward);
    if (g.milestones.length) {
      out.push('**Milestones**');
      g.milestones.forEach(m => {
        out.push('- [' + (m.d ? 'x' : ' ') + '] ' + (m.t || ''));
        (m.kt || []).forEach(k => out.push('    - [' + (k.d ? 'x' : ' ') + '] ' + (k.t || '')));
      });
      out.push('');
    }
    if (g.actions.length) {
      out.push('**Actions**\n' + g.actions.map(a => '- [' + (a.d ? 'x' : ' ') + '] ' + a.t).join('\n') + '\n');
    }
    if (g.completed) { put('Achieved', g.completed); put('Outcome', g.outcome); }
    Object.entries(g.review || {}).forEach(([k, val]) => put(k, val));
  });

  out.push('\n## Habits\n');
  S.habits.forEach(h => {
    const days = Object.keys(S.hlog).filter(d => S.hlog[d].includes(h.id)).sort();
    const owner = h.p ? projectById(h.p) : (h.g ? S.goals.find(x => x.id === h.g) : null);
    out.push('- **' + (h.name || 'Habit') + '** — ' + days.length + ' days logged, current streak ' + streak(h.id) +
      (owner ? '. Carries ' + (owner.title || 'a goal') + '.' : ''));
  });

  if ((S.projects || []).length) {
    out.push('\n## Projects\n');
    S.projects.forEach(p2 => {
      out.push('\n### ' + (p2.title || 'Untitled project') + '\n');
      put('Finish by', p2.due);
      if (p2.done) put('Finished', p2.done);
      put('Progress', projectProgress(p2) + '%');
      if ((p2.goals || []).length) put('In service of',
        p2.goals.map(id => (S.goals.find(g => g.id === id) || {}).title || 'a goal').join(', '));
      put('What it is', p2.notes);
      const own = (p2.tasks || []).filter(t => (t.t || '').trim());
      if (own.length) out.push('**Tasks**\n' + own.map(t => '- [' + (t.d ? 'x' : ' ') + '] ' + t.t +
        ((t.n || '').trim() ? '\n    ' + t.n.trim().replace(/\n+/g, ' ') : '')).join('\n') + '\n');
    });
  }

  const pdays = Object.keys(S.limbs.days).sort();
  if (pdays.length) {
    out.push('\n## Practice — the eight limbs\n');
    out.push('Logged on ' + pdays.length + ' days. Current unbroken run: ' + limbStreak() + '.\n');
    LIMBS.forEach(l => {
      let up = 0, slip = 0;
      pdays.forEach(k => { const st = limbState(l, S.limbs.days[k].marks || {}); if (st === 'up') up++; else if (st === 'slip') slip++; });
      out.push('- **' + l.sanskrit + '** (' + l.english + ') — upheld ' + up + ', slipped ' + slip);
    });
    out.push('');
    pdays.forEach(k => {
      const e = S.limbs.days[k];
      const notes = Object.entries(e.notes || {}).filter(([, v]) => (v.text || '').trim());
      if (!notes.length) return;
      out.push('\n### ' + k + '\n');
      notes.forEach(([pid, v]) => {
        const pr = PBYID[pid];
        out.push('**' + (pr ? pr.name : pid) + '** (' + (v.t === 'slip' ? 'slipped' : 'upheld') + ')  \n' + v.text.trim() + '\n');
      });
    });
  }

  if (S.studio.entries.length) {
    out.push('\n' + exegesisMarkdown().replace(/^# /, '## '));
  }

  if (S.lists.length) {
    out.push('\n## MiLists\n');
    S.lists.forEach(l => {
      out.push('\n### ' + (l.title || 'List') + '\n');
      l.items.forEach(it => out.push('- [' + (it.d ? 'x' : ' ') + '] ' + it.t));
    });
  }
  financeMarkdown(out, put);

  const srcs = allSources();
  if (srcs.length) {
    out.push('\n## Sources\n');
    srcs.forEach(s2 => out.push('- ' + (s2.l.url ? '[' + (s2.l.label || s2.l.url) + '](' + s2.l.url + ')' : s2.l.label) +
      (s2.ctx ? ' _(' + s2.where.toLowerCase() + ': ' + s2.ctx + ')_' : '') + (s2.l.note ? ' — ' + s2.l.note : '')));
  }

  if (S.notes.length) {
    out.push('\n## Notes\n');
    S.notes.forEach(n => {
      const ng = n.g && S.goals.find(x => x.id === n.g);
      const nms = ng && n.ms && (ng.milestones || []).find(x => x.id === n.ms);
      out.push('\n### ' + (n.title || 'Note') +
        (ng ? ' \u2014 ' + (nms ? (nms.t || 'milestone') + ', ' : '') + (ng.title || 'a goal') : '') + '\n');
      out.push((n.body || '').trim() + '\n');
      if ((n.themes || []).length) out.push('Threads: ' + n.themes.join(', ') + '\n');
      (n.links || []).forEach(l => out.push('- ' + (l.url ? '[' + (l.label || l.url) + '](' + l.url + ')' : l.label)));
    });
  }
  return out.join('\n');
}

/* everything that belongs to one particular year */
function exportYear(Y, out, put, putList) {
  Y = Number(Y);
  const F = YF(Y);
  const touched = Object.keys(F).length ||
    Object.keys(S.weeks).some(k => k.slice(0, 4) === String(Y)) ||
    Object.keys(S.days).some(k => k.slice(0, 4) === String(Y));
  if (!touched) return;
  out.push('\n# ' + Y + '\n');

  out.push('\n## My ' + Y + '\n');
  FOUNDATIONS.forEach(sec => {
    out.push('\n### ' + sec.t + '\n');
    if (sec.special === 'ratelife') {
      LIFE_AREAS.forEach((n, i) => {
        const r = (F.life || {})['a' + i] || {};
        if (r.start || r.end) out.push('- ' + n + ': start ' + (r.start || '\u2013') + ', end ' + (r.end || '\u2013'));
      });
      out.push('');
    } else if (sec.special === 'future') {
      HORIZONS.forEach(([k, l]) => ['be', 'have', 'feel'].forEach(pt => put(l + ' \u2014 I will ' + pt, F['fu_' + k + '_' + pt])));
    } else sec.f.forEach(f => f.ty === 'list' ? putList(f.l, F[f.k]) : put(f.l, F[f.k]));
  });

  out.push('\n## The year\n');
  out.push('\n### Week by week\n');
  for (let w = 1; w <= weeksInYear(Y); w++) {
    const W = S.weeks[weekKey(Y, w)];
    const mon = mondayOf(Y, w);
    const days = [];
    for (let i = 0; i < 7; i++) {
      const dk = iso(addDays(mon, i)), D = S.days[dk];
      if (D && ((D.note || '').trim() || (D.intent || '').trim() || D.anchor || D.tasks.length || (D.grat || []).some(g => (g || '').trim()))) {
        days.push('- **' + DOW[i] + ' ' + dk + '** ' +
          ((D.intent || '').trim() ? '_' + D.intent.trim() + '_' + (anchorText(D.anchor) ? ' [' + anchorText(D.anchor) + ']' : '') + ' — ' : '') +
          (D.note || '').trim().replace(/\n/g, ' ') +
          D.tasks.filter(t => t.t).map(t => '\n    - [' + (t.d ? 'x' : ' ') + '] ' + t.t +
            (t.g && goalTitle(t.g) ? ' _(' + goalTitle(t.g) + ')_' : '') +
            ((t.n || '').trim() ? '\n        ' + t.n.trim().replace(/\n+/g, ' ') : '')).join('') +
          (D.grat || []).filter(g => (g || '').trim()).map(g => '\n    - grateful for: ' + g.trim()).join(''));
      }
    }
    const hasW = W && (W.focus || W.notes || (W.wins || []).some(x => x) || W.rate);
    if (!hasW && !days.length) continue;
    out.push('\n#### Week ' + pad(w) + ' — ' + mon.getDate() + ' ' + MONTHS[mon.getMonth()] + '\n');
    if (W) {
      put('Focus', W.focus); put('How I wanted to feel', W.feel);
      if ((W.goals || []).length) out.push('**Weekly goals**\n' + W.goals.map(g2 =>
        '- [' + (g2.d ? 'x' : ' ') + '] ' + (g2.t || '') +
        (g2.p && projectById(g2.p) ? ' _(' + (projectById(g2.p).title || 'project') + ')_'
          : g2.g && goalTitle(g2.g) ? ' _(' + goalTitle(g2.g) + ')_' : '')).join('\n') + '\n');
      const wg = [];
      for (let i = 0; i < 7; i++) {
        const dk2 = iso(addDays(mon, i)), DD = S.days[dk2];
        (DD && DD.grat || []).filter(g => (g || '').trim()).forEach(g => wg.push(DOW[i] + ': ' + g.trim()));
      }
      putList('Gratitude gathered', wg);
      putList('Grateful for, the week as a whole', W.grat);
      if (W.todos && W.todos.length) out.push('**To do**\n' + W.todos.map(t => '- [' + (t.d ? 'x' : ' ') + '] ' + t.t +
        (t.g && goalTitle(t.g) ? ' _(' + goalTitle(t.g) + ')_' : '') +
        ((t.n || '').trim() ? '\n    ' + t.n.trim().replace(/\n+/g, ' ') : '')).join('\n') + '\n');
      put('Notes', W.notes); putList('Top three wins', W.wins);
      if (W.rate) put('Week rated', W.rate + '/10');
    }
    if (days.length) out.push('**Days**\n' + days.join('\n') + '\n');
  }

  out.push('\n### Monthly reviews\n');
  MONTHS.forEach((mo, i) => {
    const M = S.months[monthKey(Y, i)];
    if (!M) return;
    const any = (M.review && Object.values(M.review).some(x => x && String(x).trim())) ||
      M.goals.some(g => g.t) || (M.am || []).some(x => x) || (M.pm || []).some(x => x);
    if (!any) return;
    out.push('\n#### ' + mo + '\n');
    M.goals.forEach((g, n) => { if (g.t) {
      put('Goal ' + (n + 1), g.t + (g.p && projectById(g.p) ? ' (' + (projectById(g.p).title || 'project') + ')'
        : g.g && goalTitle(g.g) ? ' (' + goalTitle(g.g) + ')' : ''));
      const fx = (g.focus || []).filter(f => (f.t || '').trim());
      if (fx.length) out.push('**Focus**\n' + fx.map(f => '- [' + (f.d ? 'x' : ' ') + '] ' + f.t +
        (f.p && projectById(f.p) ? ' _(' + (projectById(f.p).title || 'project') + ')_'
          : f.g && goalTitle(f.g) ? ' _(' + goalTitle(f.g) + ')_' : '')).join('\n') + '\n');
      put('Notes', g.notes); } });
    [['am', 'Morning rituals'], ['pm', 'Evening rituals']].forEach(([kk, label]) => {
      const rows = (M[kk] || []).filter(r => (r.t || '').trim());
      if (!rows.length) return;
      out.push('**' + label + '**\n' + rows.map(r => {
        const rate = ritualRate(r.id, Y, i);
        return '- ' + r.t + (rate.days ? ' \u2014 kept ' + rate.hit + ' of ' + rate.days + ' days (' + rate.pct + '%)' : '');
      }).join('\n') + '\n');
    });
    MONTH_REVIEW.forEach(f => f.ty === 'list' ? putList(f.l, (M.review || {})[f.k]) : put(f.l, (M.review || {})[f.k]));
    const bg = (M.review || {}).byGoal || {};
    Object.keys(bg).forEach(k => {
      const isP = k.slice(0, 1) === 'p', id = k.slice(2);
      const obj = isP ? projectById(id) : S.goals.find(x => x.id === id);
      if (!obj) return;
      const pct = isP ? projectProgress(obj) : goalProgress(obj);
      const was = (M.snap || {})[k];
      if (!(bg[k].felt || '').trim() && !(bg[k].next || '').trim()) return;
      out.push('**' + (obj.title || 'Untitled') + '** — ' + pct + '%' +
        (was === undefined ? '' : ' (was ' + was + '%)'));
      put('How it went', bg[k].felt);
      put('Next month', bg[k].next);
    });
  });

  out.push('\n### Mid-year review\n');
  MID_YEAR.forEach(f => put(f.l, (F.mid || {})[f.k]));
  out.push('\n### Yearly review\n');
  YEAR_REVIEW.forEach(f => f.ty === 'list' ? putList(f.l, (F.yr || {})[f.k]) : put(f.l, (F.yr || {})[f.k]));

}

const PRACTICES = LIMBS.flatMap(l => l.practices.map(p => Object.assign({}, p, { limb: l })));
const PBYID = Object.fromEntries(PRACTICES.map(p => [p.id, p]));

let openLimb = null, reflecting = null;

function limbDay(k) { return (S.limbs.days[k] = S.limbs.days[k] || { marks: {}, notes: {} }); }
function limbState(limb, marks) {
  let up = false, slip = false;
  limb.practices.forEach(p => { if (marks[p.id] === 'up') up = true; if (marks[p.id] === 'slip') slip = true; });
  return up ? 'up' : (slip ? 'slip' : 'none');
}
function setMark(k, pid, type) {
  const e = limbDay(k);
  if (e.marks[pid] === type) { delete e.marks[pid]; reflecting = null; }
  else { e.marks[pid] = type; reflecting = pid; }
  save(); render();
}
function limbStreak() {
  let n = 0, d = new Date();
  const has = dd => Object.keys((S.limbs.days[iso(dd)] || {}).marks || {}).length > 0;
  if (!has(d)) d = addDays(d, -1);
  while (has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function limbsEngaged(k) {
  const marks = (S.limbs.days[k] || {}).marks || {};
  return LIMBS.filter(l => limbState(l, marks) !== 'none').length;
}

/* the eight-band spectrum for one day */
function limbSpectrum(k, h) {
  const marks = (S.limbs.days[k] || {}).marks || {};

}

function themeCounts() {

  const groups = {};
  const add = (t, kind) => {
    const k = String(t || '').trim().toLowerCase();
    if (!k) return;
    const g = groups[k] = groups[k] || { n: 0, sessions: 0, notes: 0, forms: {} };
    g.n++; g[kind]++; const f = String(t).trim(); g.forms[f] = (g.forms[f] || 0) + 1;
  };
  S.studio.entries.filter(e => !e.draft).forEach(e => (e.themes || []).forEach(t => add(t, 'sessions')));
  (S.notes || []).forEach(n => (n.themes || []).forEach(t => add(t, 'notes')));
  journalEntries().forEach(j => (j.obj.themes || []).forEach(t => add(t, 'notes')));
  return Object.values(groups).map(g => ({
    label: Object.keys(g.forms).sort((a, b) => g.forms[b] - g.forms[a])[0],
    n: g.n, sessions: g.sessions, notes: g.notes
  })).sort((a, b) => b.n - a.n);
}
function notesWithTheme(t) {
  return (S.notes || []).filter(n => (n.themes || []).some(x => sameTheme(x, t)))
    .map(n => ({ title: n.title || 'Untitled note', body: n.body || '' }))
    .concat(journalEntries().filter(j => (j.obj.themes || []).some(x => sameTheme(x, t)))
      .map(j => ({ title: j.label, body: j.body || '' })));
}
function entriesWithTheme(t) {
  return S.studio.entries.filter(e => !e.draft && (e.themes || []).some(x => sameTheme(x, t)));
}
function entriesFor(dayIso) { return S.studio.entries.filter(e => e.date === dayIso && !e.draft); }

function compressImage(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900, sc = Math.min(1, MAX / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => res(null);
      img.src = r.result;
    };
    r.onerror = () => res(null);
    r.readAsDataURL(file);
  });
}

/* ===================== works, findings, exegesis ===================== */
/* At doctoral scale the session record is the archive, not the document.
   The exegesis is built from works, claims and selected evidence. */

const WORD_TARGET = 30000;
const words = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;

const newWork = () => ({ id: uid(), title: '', kind: 'body', period: '', statement: '', media: '' });
const newClaim = () => ({ id: uid(), text: '', work: '', theme: '', parent: '',
  evidence: [], notes: '', date: iso(new Date()) });

function studioStore() {
  S.studio.works = S.studio.works || [];
  S.studio.claims = S.studio.claims || [];
  S.studio.themeNotes = S.studio.themeNotes || {};
  return S.studio;
}
const workOf = id => (S.studio.works || []).find(w => w.id === id);
const sessionsOfWork = id => S.studio.entries.filter(e => !e.draft && e.work === id);
const evidenceSessions = () => S.studio.entries.filter(e => !e.draft && e.key);
const evidenceNotes = () => (S.notes || []).filter(n => n.key);
const evidenceJournal = () => journalEntries().filter(j => j.obj.key);
/* one pool, whatever it came from */
function evidencePool() {
  return evidenceSessions().map(e => ({
    id: e.id, kind: 'session', date: e.date, title: e.title || '',
    label: e.claim || e.title || 'Untitled session',
    quote: (e.pull || '').trim() || (e.inAction || '').trim() || (e.onAction || '').trim(),
    forAction: (e.forAction || '').trim(), themes: e.themes || []
  })).concat(evidenceNotes().map(n => ({
    id: n.id, kind: 'note', date: n.date || n.up || '', title: n.title || '',
    label: n.title || 'Untitled note',
    quote: (n.pull || '').trim() || (n.body || '').trim(), forAction: '', themes: n.themes || []
  }))).concat(evidenceJournal().map(j => ({
    id: j.id, kind: 'note', date: j.date, title: j.label, label: j.label,
    quote: (j.obj.pull || '').trim() || (j.body || '').trim(), forAction: '', themes: j.obj.themes || []
  }))).sort((a, b) => a.date < b.date ? -1 : 1);
}
const evidenceById = id => evidencePool().find(x => x.id === id);

/* claims nest: a finding can be supported by other findings as well as sessions */
const childClaims = id => S.studio.claims.filter(c => c.parent === id);
const topClaims = () => S.studio.claims.filter(c => !c.parent || !S.studio.claims.some(x => x.id === c.parent));
function claimDescendants(id, seen) {
  seen = seen || new Set();
  childClaims(id).forEach(c => { if (!seen.has(c.id)) { seen.add(c.id); claimDescendants(c.id, seen); } });
  return seen;
}
/* a claim's work is its own, or the nearest one above it */
function claimWork(c, guard) {
  guard = guard || 0;
  if (c.work) return c.work;
  const p = S.studio.claims.find(x => x.id === c.parent);
  return p && guard < 12 ? claimWork(p, guard + 1) : '';
}
/* sessions carrying a one-line claim that has not been promoted yet */
function looseSessionClaims() {
  const used = new Set(S.studio.claims.flatMap(c => c.evidence || []));
  return S.studio.entries.filter(e => !e.draft && (e.claim || '').trim() && !used.has(e.id));
}

/* ---------- works ---------- */
let bulkWork = null, bulkFrom = '', bulkTo = '', bulkTheme = '', bulkOnly = false;

/* sessions matching the current filters, minus ones already on this work */
function bulkPool(wid) {
  return S.studio.entries.filter(e => {
    if (e.draft) return false;
    if (e.work === wid) return false;
    if (bulkOnly && e.work) return false;
    if (bulkFrom && e.date < bulkFrom) return false;
    if (bulkTo && e.date > bulkTo) return false;
    if (bulkTheme && !(e.themes || []).some(x => sameTheme(x, bulkTheme))) return false;
    return true;
  }).sort((a, b) => a.date < b.date ? -1 : 1);
}

function bulkPanel(w) {
  const box = E('div', { style: 'margin-top:12px;border-top:1px solid var(--rule);padding-top:12px' });
  box.append(E('h3', { text: 'Attach existing sessions' }));
  const filters = E('div', { style: 'display:flex;gap:10px;flex-wrap:wrap' });
  const mk = (label, get, set) => {
    const i = E('input', { type: 'date', oninput: e => { set(e.target.value); redrawBulk(w, box); } });
    i.value = get();
    return E('div', { style: 'flex:1;min-width:120px' }, [E('label', { cls: 'fl', text: label }), i]);
  };
  filters.append(mk('From', () => bulkFrom, v2 => bulkFrom = v2));
  filters.append(mk('To', () => bulkTo, v2 => bulkTo = v2));
  box.append(filters);

  const themes = themeCounts().map(t => t[0]);
  if (themes.length) {
    const chips = E('div', { cls: 'chips', style: 'margin-top:10px' });
    themes.forEach(t => chips.append(E('button', {
      cls: 'chip' + (bulkTheme === t ? ' on' : ''), style: bulkTheme === t ? 'background:var(--acc)' : '',
      text: t, onclick: () => { bulkTheme = bulkTheme === t ? '' : t; redrawBulk(w, box); } })));
    box.append(chips);
  }
  box.append(E('div', { style: 'display:flex;gap:10px;align-items:center;margin-top:10px' }, [
    E('button', { cls: 'box' + (bulkOnly ? ' on' : ''), style: 'flex:none;margin-top:0',
      html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>',
      onclick: () => { bulkOnly = !bulkOnly; redrawBulk(w, box); } }),
    E('span', { style: 'font-size:14px', text: 'Only sessions not yet on a work' })
  ]));

  const listWrap = E('div');
  box.append(listWrap);
  box._list = listWrap;
  drawBulkList(w, listWrap);
  return box;
}
function redrawBulk(w, box) { drawBulkList(w, box._list); }
function drawBulkList(w, wrap) {
  clear(wrap);
  const pool = bulkPool(w.id);
  wrap.append(E('div', { cls: 'pct', style: 'margin-top:12px',
    text: pool.length + ' session' + (pool.length === 1 ? '' : 's') + ' match' }));

      E('div', { cls: 'pct', text: e.date + (e.work ? ' \u00b7 currently on ' + ((workOf(e.work) || {}).title || 'another work') : '') })
    ]),
    E('button', { cls: 'tag acc', text: 'Attach', onclick: () => { e.work = w.id; save(true); render(); } })
  ])));
  if (pool.length > 40) wrap.append(E('div', { cls: 'pct', text: 'showing the first 40' }));
  wrap.append(E('button', { cls: 'btn fill', style: 'margin-top:12px',

  studioStore();
  const v = E('div');
  v.append(E('button', { cls: 'btn ghost', text: '\u2039 Studio', onclick: () => { studioView = 'list'; render(); } }));
  v.append(E('h1', { text: 'Findings' }));
  v.append(E('p', { cls: 'lede', text: 'What you now think, stated as a claim, with sessions cited underneath it. This is the layer no amount of reflection produces on its own \u2014 and it is what the exegesis is actually made of.' }));

  /* sessions whose one-line claim has not become a finding yet */
  const loose = looseSessionClaims();
  if (loose.length) {
    const lc = E('div', { cls: 'card' });
    lc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Claims waiting in sessions' }),

      E('div', { cls: 'txt' }, [
        E('div', { style: 'font-size:14.5px', text: e.claim }),
        E('div', { cls: 'pct', text: e.date + (e.work ? ' \u00b7 ' + ((workOf(e.work) || {}).title || '') : '') })
      ]),
      E('button', { cls: 'tag acc', text: 'Promote', onclick: () => {

        S.studio.claims.push(c); save(true); render();

    ])));

          html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>' }),
        E('span', { style: 'flex:1;min-width:0;font-size:14px' }, [
          E('span', { cls: 'eyebrow', text: (e.kind === 'note' ? 'note ' : '') + e.date + '  ' }), e.label,
          e.quote ? E('div', { cls: 'pct', style: 'margin-top:2px', text: '\u201c' + e.quote.slice(0, 70) + '\u201d' }) : null
        ])
      ]));
    });
    c.append(field('Evidence', ev));
    c.append(field('How the evidence supports it', bindArea(cl, 'notes', 'The analytical link \u2014 this is what gets written up.', 1)));
    c.append(E('div', { cls: 'btnrow' }, [
      E('button', { cls: 'btn', text: '+ Supporting finding', onclick: () => {
        S.studio.claims.push(Object.assign(newClaim(), { parent: cl.id }));
        save(true); render();
      }}),
      cl.parent ? E('button', { cls: 'btn ghost', text: 'Detach', onclick: () => { cl.parent = ''; save(true); render(); } }) : null,
      kids.length ? E('span', { cls: 'pct', style: 'align-self:center',
        text: kids.length + ' supporting' }) : null
    ]));
    v.append(c);
    kids.forEach(k => drawClaim(k, depth + 1));
  };
  topClaims().forEach(cl => drawClaim(cl, 0));

  v.append(E('button', { cls: 'btn fill', style: 'margin-bottom:12px', text: '+ New finding',
    onclick: () => { S.studio.claims.push(newClaim()); save(true); render(); } }));

  /* thread reviews */
  if (themes.length) {
    const tc = E('div', { cls: 'card' });
    tc.append(E('h2', { text: 'Thread reviews' }));
    tc.append(E('p', { cls: 'lede', text: 'Periodically: what has changed in this thread, and what do you now think? These become the connective prose between findings.' }));
    themes.forEach(t => {
      const n = entriesWithTheme(t).length;
      tc.append(E('div', { style: 'padding:12px 0;border-top:1px solid var(--rule)' }, [
        E('div', { cls: 'eyebrow', text: t + ' \u00b7 ' + n + ' session' + (n === 1 ? '' : 's') }),
        bindArea(S.studio.themeNotes, t, 'Where this thread has got to\u2026', 1)
      ]));
    });
    v.append(tc);
  }
  return v;
}

/* ---------- collation ---------- */
function exegesisWords() {
  studioStore();
  const p = S.studio.project;
  let total = words(p.questions);
  S.studio.works.forEach(w => total += words(w.statement));
  S.studio.entries.forEach(e => { if (!e.draft) total += words(e.claim); });
  S.studio.claims.forEach(c => {
    total += words(c.text) + words(c.notes);
    (c.evidence || []).forEach(id => {
      const e = evidenceById(id);
      if (e) total += words(e.quote);
    });
  });
  Object.values(S.studio.themeNotes).forEach(t => total += words(t));
  return { total };
}

function exegesisMarkdown() {
  studioStore();
  const L = [], p = S.studio.project;
  const cite = e => (e.kind === 'note' ? 'notebook, ' : '') + e.date + (e.title ? ', ' + e.title : '');

  L.push('# ' + (p.title || 'Untitled project') + ' — exegesis draft\n');
  const b = exegesisWords();
  const nSess = S.studio.entries.filter(e => !e.draft).length;
  L.push('_Generated ' + iso(new Date()) + '. ' + nSess + ' documented session' + (nSess === 1 ? '' : 's') +
    ', ' + evidenceSessions().length + ' cited. ' +
    (b.total ? b.total.toLocaleString() + ' words drafted towards ' + WORD_TARGET.toLocaleString() + '.'
             : 'Nothing drafted yet \u2014 see what this draft still needs, below.') + '_\n');

  if (p.questions) L.push('## Research questions\n\n' + p.questions + '\n');

  const citedSess = evidenceSessions();
  const claimed = S.studio.claims.filter(c => (c.text || '').trim());
  const gaps = [];
  if (!p.questions) gaps.push('**Research questions** are not set. Studio \u2192 the project card \u2192 Edit.');
  if (!S.studio.works.length) gaps.push('**No works defined**, so there are no sections for the argument to sit in. Studio \u2192 Works, or make one from a goal.');
  else if (S.studio.works.some(w => !(w.statement || '').trim()))
    gaps.push('**Some works have no statement** of what they are doing \u2014 that paragraph opens each section.');
  if (!claimed.length) gaps.push('**No findings recorded.** A finding is a claim in a sentence with sessions cited under it. Without them this is a record, not an argument. Studio \u2192 Findings.');
  if (!citedSess.length && !evidenceNotes().length) gaps.push('**Nothing cited.** Open a session and tick \u201cCite this\u201d, then mark the passage worth quoting.');
  const orphan = S.studio.entries.filter(e => !e.draft && !e.work).length;
  if (S.studio.works.length && orphan) gaps.push('**' + orphan + ' session' + (orphan === 1 ? ' is' : 's are') +
    ' not attached to a work**, so they cannot appear in any section. Studio \u2192 Works \u2192 Attach sessions.');
  if (gaps.length) {
    L.push('## What this draft still needs\n');
    gaps.forEach(g => L.push('- ' + g));
    L.push('\n_This section is scaffolding. It disappears once the gaps are filled._\n');
  }

  L.push('## Methodology\n');
  L.push('This research was conducted through a reflective practice methodology. Studio sessions were documented at the time of making and reflected on in three temporal modes — reflection in action, reflection on action, and reflection for action — following the account of the creative reflective practitioner developed by Linda Candy, building on Donald Schön. Because in-the-moment noticing cannot be reconstructed retrospectively, documentation was made during or immediately after each session rather than recalled later.\n');
  L.push('The corpus comprises ' + S.studio.entries.filter(e => !e.draft).length +
    ' documented sessions. Rather than present that record in full, this exegesis proceeds by claim: findings are stated, then evidenced by selected sessions, with the complete record retained as an appendix. Selection criteria and the relationship between artefact and text are set out below.\n');
  L.push('[Expand: your documentation methods, your selection criteria for evidence, the status of the artefacts in the examination, and full citations for Candy and Schön in your required style.]\n');

  /* the argument: findings nested, gathered under the work they belong to */
  const byId = id2 => S.studio.entries.find(x => x.id === id2);
  const H = n => '#'.repeat(Math.min(n, 6)) + ' ';

  const renderClaim = (c, depth) => {
    if (!(c.text || '').trim()) return;
    L.push('\n' + H(depth) + c.text.trim().replace(/\n+/g, ' ') + '\n');
    if (c.theme) L.push('_Thread: ' + c.theme + '._\n');
    if (c.notes) L.push(c.notes.trim() + '\n');
    (c.evidence || []).forEach(id2 => {
      const e = evidenceById(id2);
      if (!e || !e.quote) return;
      L.push('> ' + e.quote.replace(/\n+/g, '\n> ') + '\n>\n> \u2014 ' + cite(e) + '\n');
    });
    const fwd = (c.evidence || []).map(evidenceById).filter(e => e && e.forAction);
    if (fwd.length) {
      L.push('**What this asked for next**\n');
      fwd.forEach(e => L.push('- ' + e.date + ': ' + e.forAction.replace(/\n+/g, ' ')));
      L.push('');
    }
    childClaims(c.id).forEach(k => renderClaim(k, depth + 1));
  };

  const topFor = wid => topClaims().filter(c => claimWork(c) === wid && (c.text || '').trim());
  S.studio.works.forEach(w => {
    const ss = sessionsOfWork(w.id);
    L.push('\n## ' + (w.title || 'Untitled work') + '\n');
    const meta = [w.kind === 'body' ? 'Body of work' : 'Individual work', w.period, w.media].filter(Boolean);
    if (meta.length) L.push('_' + meta.join('. ') + '._\n');
    if (w.statement) L.push(w.statement + '\n');
    if (ss.length) {
      const dates = ss.map(e => e.date).sort();
      L.push('_Developed across ' + ss.length + ' documented sessions, ' + dates[0] + ' to ' + dates[dates.length - 1] + '._\n');
    }
    const cls = topFor(w.id);
    if (!cls.length) L.push('[No findings recorded against this work yet. ' +
      (ss.filter(e => e.key).length ? ss.filter(e => e.key).length + ' of its sessions are cited and ready to attach to one.'
                                    : 'None of its sessions are cited yet.') + ']\n');
    cls.forEach(c => renderClaim(c, 3));
  });

  const cross = topClaims().filter(c => !claimWork(c) && (c.text || '').trim());
  if (cross.length) {
    L.push('\n## Across the works\n');
    cross.forEach(c => renderClaim(c, 3));
  }

  /* threads — studio and notebook together */
  const th = allThemeCounts();
  if (th.length) {
    L.push('\n## Thematic threads\n');
    th.forEach(t => {
      const ss = entriesWithTheme(t.label), nn = notesWithTheme(t.label);
      const dates = ss.map(e => e.date).sort();
      L.push('\n### ' + t.label + '\n');
      L.push('_' + (ss.length ? ss.length + ' session' + (ss.length === 1 ? '' : 's') : 'no sessions') +
        (nn.length ? ', ' + nn.length + ' note' + (nn.length === 1 ? '' : 's') : '') +
        (dates.length ? ', ' + dates[0] + ' to ' + dates[dates.length - 1] : '') + '._\n');
      const review = S.studio.themeNotes[t.label] ||
        Object.keys(S.studio.themeNotes).find(k => sameTheme(k, t.label)) && S.studio.themeNotes[Object.keys(S.studio.themeNotes).find(k => sameTheme(k, t.label))];
      if ((review || '').trim()) L.push(review.trim() + '\n');
      if (nn.length) {
        L.push('**From the notebook**\n');
        nn.forEach(n => {
          const body = (n.body || '').trim().replace(/\n+/g, ' ');
          L.push('- **' + (n.title || 'Untitled note') + '**' + (body ? ' \u2014 ' + (body.length > 400 ? body.slice(0, 400) + '\u2026' : body) : ''));
        });
        L.push('');
      }
      if (ss.length) {
        const claimed = ss.filter(e => (e.claim || '').trim());
        if (claimed.length) {
          L.push('**What the sessions showed**\n');
          claimed.forEach(e => L.push('- ' + e.date + ': ' + e.claim.trim().replace(/\n+/g, ' ')));
          L.push('');
        }
      }
    });
  }

  /* sources */
  const cited = allSources();
  if (cited.length) {
    L.push('\n## Sources referenced\n');
    cited.forEach(s2 => L.push('- ' + (s2.l.url ? '[' + (s2.l.label || s2.l.url) + '](' + s2.l.url + ')' : s2.l.label) +
      (s2.ctx ? ' — ' + s2.where.toLowerCase() + ': ' + s2.ctx : '') + (s2.l.note ? '. ' + s2.l.note : '')));
    L.push('\n[Reformat into your required referencing style.]\n');
  }

  if (S.studio.works.length) L.push('\n## Appendix A — the works\n');
  S.studio.works.forEach(w => L.push('- **' + (w.title || 'Untitled') + '** — ' +
    [w.kind === 'body' ? 'body of work' : 'individual work', w.period, w.media].filter(Boolean).join(', ') +
    '. ' + sessionsOfWork(w.id).length + ' documented sessions.'));

  L.push('\n## Appendix B — the session record\n');
  L.push('The complete record runs to ' + S.studio.entries.filter(e => !e.draft).length +
    ' sessions and is held separately. Export it from the Studio tab.\n');
  return L.join('\n');
}

/* the archive, exported on its own */
function sessionArchiveMarkdown() {
  const L = [];
  L.push('# Session record — ' + (S.studio.project.title || 'Untitled project') + '\n');
  L.push('_The complete documentation, in order. Cited sessions are marked._\n');
  S.studio.entries.filter(e => !e.draft).slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => {
    const w = workOf(e.work);
    L.push('\n## ' + e.date + ' — ' + (e.title || 'Untitled session') + (e.key ? ' [cited]' : '') + '\n');
    if (w) L.push('_' + (w.title || 'Untitled work') + '_\n');
    if ((e.claim || '').trim()) L.push('**What this showed**  \n' + e.claim.trim() + '\n');
    if (e.did) L.push('**What I did**  \n' + e.did.trim() + '\n');
    MODES.forEach(m => { if ((e[m.id] || '').trim()) L.push('**' + m.label + '**  \n' + e[m.id].trim() + '\n'); });
    if ((e.pull || '').trim()) L.push('**Marked passage**  \n> ' + e.pull.trim() + '\n');
    if ((e.links || []).length) e.links.forEach(l => L.push('- ' + (l.url ? '[' + (l.label || l.url) + '](' + l.url + ')' : l.label)));
    if ((e.media || []).length) L.push('_' + e.media.length + ' image' + (e.media.length === 1 ? '' : 's') + ' documented._\n');
    if ((e.themes || []).length) L.push('Threads: ' + e.themes.join(', ') + '\n');
  });
  return L.join('\n');
}


/* ===================== syncing across devices ===================== */
/* A private gist is the shared copy. No server, no account beyond the one
   already hosting this file. The token lives only in this browser. */

const GIST_FILE = 'goal-digger-2026.json';
let syncing = false, lastSync = '';

function gistHeaders() {
  return {
    'Authorization': 'Bearer ' + (S.cfg.token || '').trim(),
    'Accept': 'application/vnd.github+json',
    'Content-Type': 'application/json'
  };
}

/* what actually gets uploaded — photos optionally stay home */
function payloadForCloud() {
  const c = JSON.parse(JSON.stringify(S));
  delete c.cfg.token;
  (c.studio.entries || []).forEach(e => {
    if (!S.cfg.cloudPhotos) { e.media = []; e.mediaHeld = true; }
  });
  return JSON.stringify(c);
}

async function cloudPush() {
  if (!S.cfg.token) { toast('Add a token first'); return false; }
  syncing = true;
  try {
    const body = JSON.stringify({
      description: 'Goal Digger — planner data',
      public: false,
      files: { [GIST_FILE]: { content: payloadForCloud() } }
    });
    let res;
    if (S.cfg.gist) {
      res = await fetch('https://api.github.com/gists/' + S.cfg.gist, { method: 'PATCH', headers: gistHeaders(), body });
    } else {
      res = await fetch('https://api.github.com/gists', { method: 'POST', headers: gistHeaders(), body });
    }
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const data = await res.json();
    S.cfg.gist = data.id;
    lastSync = new Date().toISOString();
    S.meta.lastPush = lastSync;
    dirty = false;
    save(true);
    toast('Sent to the cloud copy');
    return true;
  } catch (e) {
    toast('Push failed: ' + e.message);
    return false;
  } finally { syncing = false; }
}

async function cloudFetch() {
  if (!S.cfg.token || !S.cfg.gist) return null;
  const res = await fetch('https://api.github.com/gists/' + S.cfg.gist, { headers: gistHeaders() });
  if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
  const data = await res.json();
  const f = (data.files || {})[GIST_FILE];
  if (!f) throw new Error('no data file in that gist');
  let text = f.content;
  if (f.truncated && f.raw_url) text = await (await fetch(f.raw_url)).text();
  return JSON.parse(text);
}

async function cloudPull(mode) {
  if (!S.cfg.gist) { toast('No cloud copy yet'); return false; }
  syncing = true;
  try {
    const remote = await cloudFetch();
    if (!remote) throw new Error('nothing there');
    S = mode === 'replace' ? migrate(Object.assign(DEFAULT(), remote, { cfg: S.cfg }))
                           : mergeState(migrate(remote), S);
    lastSync = new Date().toISOString();
    save(true);
    toast(mode === 'replace' ? 'Replaced with the cloud copy' : 'Merged');
    return true;
  } catch (e) {
    toast('Pull failed: ' + e.message);
    return false;
  } finally { syncing = false; }
}

/* ---- merging two copies, record by record ---- */
function mergeById(local, remote, remoteNewer, keepMedia) {
  const map = new Map((local || []).map(x => [x.id, x]));
  (remote || []).forEach(r => {
    const mine = map.get(r.id);
    if (!mine) { map.set(r.id, r); return; }
    if (!remoteNewer) return;
    if (keepMedia && (!r.media || !r.media.length) && (mine.media || []).length) r.media = mine.media;
    map.set(r.id, r);
  });
  return Array.from(map.values());
}
function mergeKeyed(local, remote, remoteNewer) {
  const out = Object.assign({}, local || {});
  Object.entries(remote || {}).forEach(([k, v]) => {
    if (out[k] === undefined || remoteNewer) out[k] = v;
  });
  return out;
}

function mergeState(remote, local) {
  const rt = (remote.meta || {}).updated || '', lt = (local.meta || {}).updated || '';
  const rn = rt > lt;                       // whose prose wins on a genuine clash
  const out = JSON.parse(JSON.stringify(local));

  out.days = mergeKeyed(local.days, remote.days, rn);
  out.weeks = mergeKeyed(local.weeks, remote.weeks, rn);
  out.months = mergeKeyed(local.months, remote.months, rn);
  out.hlog = mergeKeyed(local.hlog, remote.hlog, rn);
  out.rlog = mergeKeyed(local.rlog, remote.rlog, rn);
  out.limbs = { days: mergeKeyed((local.limbs || {}).days, (remote.limbs || {}).days, rn) };

  out.goals = mergeById(local.goals, remote.goals, rn);
  out.projects = mergeById(local.projects, remote.projects, rn);
  out.lists = mergeById(local.lists, remote.lists, rn);
  out.notes = mergeById(local.notes, remote.notes, rn);
  out.dump = mergeById(local.dump, remote.dump, rn);
  out.habits = mergeById(local.habits, remote.habits, rn);
  out.links = mergeById(local.links, remote.links, rn);
  const lf = local.finance || {}, rf = remote.finance || {};
  out.finance = {
    assets: mergeById(lf.assets, rf.assets, rn),
    liabs: mergeById(lf.liabs, rf.liabs, rn),
    flows: mergeById(lf.flows, rf.flows, rn),
    snaps: (() => {
      const m = new Map((lf.snaps || []).map(x => [x.ym, x]));
      (rf.snaps || []).forEach(x => { if (!m.has(x.ym) || rn) m.set(x.ym, x); });
      return Array.from(m.values()).sort((a, b) => a.ym < b.ym ? -1 : 1);
    })()
  };
  out.studio = {
    project: rn && (remote.studio || {}).project && remote.studio.project.title
      ? remote.studio.project : (local.studio || {}).project,
    entries: mergeById((local.studio || {}).entries, (remote.studio || {}).entries, rn, true),
    works: mergeById((local.studio || {}).works, (remote.studio || {}).works, rn),
    claims: mergeById((local.studio || {}).claims, (remote.studio || {}).claims, rn),
    themeNotes: rn ? Object.assign({}, (local.studio || {}).themeNotes, (remote.studio || {}).themeNotes)
                   : Object.assign({}, (remote.studio || {}).themeNotes, (local.studio || {}).themeNotes)
  };

  /* long-form prose, year by year: fill gaps either way, newer side wins a real collision */
  out.years = {};
  const yrs = new Set([].concat(Object.keys(local.years || {}), Object.keys(remote.years || {})));
  yrs.forEach(y => {
    const lf = ((local.years || {})[y] || {}).f || {}, rf = ((remote.years || {})[y] || {}).f || {};
    const f = rn ? Object.assign({}, lf, rf) : Object.assign({}, rf, lf);
    ['mid', 'yr', 'life', 'sav'].forEach(k => {
      if (!lf[k] && !rf[k]) return;
      f[k] = rn ? Object.assign({}, lf[k], rf[k]) : Object.assign({}, rf[k], lf[k]);
    });
    out.years[y] = { f };
  });

  out.agenda = rn ? (remote.agenda || local.agenda) : local.agenda;
  out.cfg = local.cfg;                      // device settings stay put
  out.meta = { updated: new Date().toISOString(), device: S.cfg.device || '' };
  return out;
}
