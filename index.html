<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2026">
<meta name="theme-color" content="#EDEDEA">
<title>Goal Digger 2026</title>
<style>
:root{
  --ink:#15171B; --paper:#EDEDEA; --card:#FFFFFF; --rule:#D9D8D3;
  --mut:#74746F; --faint:#A3A29C;
  --hue:210; --acc:hsl(var(--hue),68%,44%); --wash:hsl(var(--hue),62%,95%); --edge:hsl(var(--hue),40%,84%);
  --disp:"Avenir Next Condensed","HelveticaNeue-CondensedBold","Helvetica Neue Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Avenir Next",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;
  --sp:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.45;overscroll-behavior-y:none;
}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:2px}
button{background:none;border:0;padding:0;cursor:pointer}

/* ---------- layout ---------- */
#app{
  padding:calc(env(safe-area-inset-top) + 10px) calc(var(--sp) + 20px) 96px calc(var(--sp));
  max-width:760px;margin:0 auto;min-height:100vh;
}
.view{animation:rise .22s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
.eyebrow{font-family:var(--disp);font-size:11px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--disp);font-weight:700;font-size:34px;line-height:.98;letter-spacing:.01em;
  text-transform:uppercase;margin:2px 0 2px}
h2{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.16em;text-transform:uppercase;
  margin:0 0 10px;color:var(--ink)}
h3{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 6px;color:var(--mut)}
.lede{color:var(--mut);font-size:13.5px;line-height:1.5;margin:0 0 14px}
.mono{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.topbar .sub{font-family:var(--disp);letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--acc);font-weight:600}
.accdot{width:11px;height:11px;border-radius:50%;background:var(--acc);display:inline-block;vertical-align:-1px;margin-right:6px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:16px;margin:0 0 12px}
.card.on{border-color:var(--edge);box-shadow:inset 3px 0 0 var(--acc)}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rule{height:1px;background:var(--rule);margin:14px 0}

/* ---------- fields ---------- */
.field{margin:0 0 14px}
.field:last-child{margin-bottom:0}
label.fl{display:block;font-family:var(--disp);font-size:11px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--mut);margin-bottom:5px;font-weight:600}
textarea,input[type=text],input[type=date],input[type=number]{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--rule);
  padding:5px 0 6px;resize:none;line-height:1.5;
}
textarea:focus,input:focus{outline:none;border-bottom-color:var(--acc)}
textarea::placeholder,input::placeholder{color:var(--faint)}
.linebox{border-bottom:1px solid var(--rule);display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.linebox input{border:0;padding:2px 0}
.num{font-family:var(--disp);font-size:12px;color:var(--faint);width:19px;flex:none;padding-top:5px;letter-spacing:.06em}

/* checkbox */
.box{width:19px;height:19px;flex:none;border:1.5px solid var(--rule);border-radius:2px;margin-top:4px;
  display:grid;place-items:center;background:#fff;transition:.15s}
.box.on{background:var(--acc);border-color:var(--acc)}
.box svg{width:11px;height:11px;stroke:#fff;stroke-width:2.6;fill:none;opacity:0;transition:.15s}
.box.on svg{opacity:1}
.done{color:var(--faint);text-decoration:line-through}

/* scale */
.scale{display:flex;gap:4px;margin-top:4px}
.scale button{flex:1;height:30px;border:1px solid var(--rule);border-radius:2px;background:#fff;
  font-family:var(--disp);font-size:12px;color:var(--mut);letter-spacing:.04em}
.scale button.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--disp);font-size:12px;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;border:1px solid var(--rule);border-radius:2px;
  padding:9px 13px;background:#fff;color:var(--ink)}
.btn.fill{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border-color:transparent;color:var(--acc);padding-left:0}
.btn:active{transform:scale(.985)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* ---------- chips / habits ---------- */
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:#fff;
  border-radius:100px;padding:8px 13px 8px 10px;font-size:14px;line-height:1}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.chip.on{border-color:transparent;color:#fff}
.hgrid{width:100%;border-collapse:collapse;font-size:13px}
.hgrid th{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--faint);font-weight:600;
  padding:0 0 6px;text-align:center;width:30px}
.hgrid th.nm{text-align:left;width:auto}
.hgrid td{padding:3px 0;text-align:center;border-top:1px solid var(--rule)}
.hgrid td.nm{text-align:left;padding-right:8px;font-size:14px}
.cell{width:24px;height:24px;border-radius:2px;border:1px solid var(--rule);background:#fff;display:inline-block}

/* ---------- day rows ---------- */
.day{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--rule);align-items:flex-start}
.day .dn{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--mut);width:44px;flex:none;padding-top:3px}
.day .dn b{display:block;font-size:19px;color:var(--ink);letter-spacing:0;line-height:1}
.day.today .dn b{color:var(--acc)}
.day textarea{min-height:26px}

/* ---------- progress ---------- */
.bar{height:4px;background:var(--paper);border-radius:2px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:2px;transition:width .3s}
.pct{font-family:var(--disp);font-size:11px;letter-spacing:.1em;color:var(--mut)}

/* ---------- spine ---------- */
#spine{position:fixed;top:0;right:0;bottom:0;width:20px;display:flex;flex-direction:column;z-index:40;
  padding:calc(env(safe-area-inset-top) + 6px) 0 84px}
#spine button{flex:1;position:relative;font-family:var(--disp);font-size:9px;letter-spacing:.06em;
  color:#fff;font-weight:700;writing-mode:vertical-rl;display:grid;place-items:center;opacity:.42;
  border-radius:2px 0 0 2px;margin:1px 0 1px 6px;transition:.18s}
#spine button.on{opacity:1;margin-left:0}

/* ---------- tabbar ---------- */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
#tabs button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--acc)}

/* ---------- misc ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.nav button{width:38px;height:38px;border:1px solid var(--rule);border-radius:2px;background:#fff;
  display:grid;place-items:center;font-size:17px;color:var(--mut)}
.nav .mid{text-align:center;flex:1;min-width:0}
.nav .mid h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--rule)}
.list-item:first-child{border-top:0}
.list-item .txt{flex:1;min-width:0}
.x{color:var(--faint);font-size:19px;line-height:1;padding:2px 4px;flex:none}
.tag{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  border:1px solid var(--rule);border-radius:2px;padding:3px 6px;color:var(--mut)}
.tag.acc{border-color:var(--acc);color:var(--acc)}
.menu-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
  padding:15px 0;border-bottom:1px solid var(--rule);font-family:var(--disp);font-size:15px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.menu-item small{font-family:var(--body);letter-spacing:0;text-transform:none;color:var(--mut);font-size:12.5px;
  font-weight:400;display:block;margin-top:2px}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);opacity:0;
  background:var(--ink);color:#fff;font-family:var(--disp);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;padding:9px 15px;border-radius:2px;z-index:99;transition:.2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{color:var(--faint);font-size:13.5px;padding:8px 0}
.quote{font-family:var(--disp);text-transform:uppercase;letter-spacing:.06em;font-size:19px;line-height:1.12;
  color:var(--ink);margin:0}
.quote span{color:var(--faint);font-size:11px;letter-spacing:.16em;display:block;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.stat{text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:29px;line-height:1;letter-spacing:.01em}
.stat span{font-family:var(--disp);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.wheel{display:block;margin:0 auto;max-width:300px;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<nav id="spine"></nav>
<nav id="tabs"></nav>
<div class="toast" id="toast">Saved</div>
<script>
/* ===================== core ===================== */
const KEY = 'goaldigger2026';
/* BUILD_STAMP */ const BUILD = '2026-08-26.2054';
const YEAR = 2026;                       /* the year this planner began */
const CURRENT_YEAR = new Date().getFullYear();
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

const DEFAULT = () => ({
  v: 2, year: YEAR, meta: { updated: '', device: '' },
  years: {},        // per-year records: { '2026': { f: {...} } } — foundations, reviews, budget
  habits: [],       // {id,name,hue}
  hlog: {},         // "2026-08-15": ["h1","h2"]
  rlog: {},         // "2026-08-15": ["r1","r4"] — morning and evening rituals
  days: {},         // "2026-08-15": {note, tasks:[{t,d}]}
  weeks: {},        // "2026-W33": {focus,feel,grat[],goals[],todos[],notes,wins[],rate}
  months: {},       // "2026-08": {goals:[{t,focus[],notes}], am[], pm[], review:{}}
  goals: [],        // see newGoal()
  projects: [],     // see newProject() — serve goals, hold tasks, have a date
  dump: [],         // {id,t,used}
  lists: [],        // {id,title,items:[{t,d}]}
  notes: [],        // {id,title,body,up,links}
  links: [],        // loose library: {id,label,url,note}
  cfg: { shortcut: 'Add Planner Reminder', calShortcut: 'Add Planner Event', list: '', time: '09:00', pasteTo: 'agenda',
    token: '', gist: '', auto: true, cloudPhotos: false, device: '' },
  agenda: { at: '', items: [] },  // read back from Reminders/Calendar via clipboard
  limbs: { days: {} },            // eight limbs: iso -> {marks,notes}
  studio: { project: { title: '', questions: '' }, entries: [] }
});

let S = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return DEFAULT();
    const data = Object.assign(DEFAULT(), JSON.parse(raw));
    try { return migrate(data); }
    catch (e) { console.error('migration failed, keeping data as-is', e); return data; }
  } catch (e) { return DEFAULT(); }
}
/* v1 kept one year's prompts in S.f — move it into the per-year store */
function migrate(st) {
  st.years = st.years || {};
  st.projects = st.projects || [];
  st.rlog = st.rlog || {};
  /* weekly goals were three plain lines; they are items now, like tasks */
  Object.values(st.weeks || {}).forEach(w => {
    w.goals = (w.goals || []).map(g => typeof g === 'string' ? { t: g, d: false } : g)
      .filter(g => g && ((g.t || '').trim() || g.g || g.p));
  });
  Object.values(st.months || {}).forEach(m => {
    (m.goals || []).forEach(g => {
      if (!('g' in g)) g.g = '';
      g.focus = (g.focus || []).map(f => typeof f === 'string' ? { t: f, d: false } : f)
        .filter(f => f && ((f.t || '').trim() || f.g || f.p));
    });
    ['am', 'pm'].forEach(k => {
      m[k] = (m[k] || []).map(x => typeof x === 'string' ? { id: uid(), t: x } : x)
        .filter(x => x && ((x.t || '').trim()));
    });
    m.review = m.review || {};
    m.review.byGoal = m.review.byGoal || {};
    m.snap = m.snap || {};
  });
  /* v2 allowed one parent; a goal can now serve several */
  (st.goals || []).forEach(g => {
    if (!g.parents) g.parents = g.parent ? [g.parent] : [];
    delete g.parent;
  });
  if (st.f && Object.keys(st.f).length) {
    const y = String(st.year || YEAR);
    st.years[y] = st.years[y] || { f: {} };
    st.years[y].f = Object.assign({}, st.f, st.years[y].f);
    delete st.f;
  }
  return st;
}

/* the year currently being looked at, and its prompt record */
function yearRec(y) {
  const k = String(y || (typeof R !== 'undefined' ? R.year : YEAR));
  S.years[k] = S.years[k] || { f: {} };
  S.years[k].f = S.years[k].f || {};
  return S.years[k];
}
function YF(y) { return yearRec(y).f; }
function yearsPresent() {
  const set = {};
  Object.keys(S.years || {}).forEach(y => set[y] = 1);
  Object.keys(S.weeks || {}).forEach(k => set[k.slice(0, 4)] = 1);
  Object.keys(S.days || {}).forEach(k => set[k.slice(0, 4)] = 1);
  set[String(YEAR)] = 1;
  return Object.keys(set).sort();
}

let saveTimer, dirty = false;
function save(now) {
  clearTimeout(saveTimer);
  const write = () => {
    S.meta = S.meta || {};
    S.meta.updated = new Date().toISOString();
    S.meta.device = S.cfg.device || '';
    try { localStorage.setItem(KEY, JSON.stringify(S)); toast('Saved'); dirty = true; }
    catch (e) { toast('Storage full'); }
  };
  now ? write() : saveTimer = setTimeout(write, 700);
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1300);
}
function uid() { return Math.random().toString(36).slice(2, 9); }

/* ===================== dates ===================== */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseIso = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => iso(a) === iso(b);

function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay() + 6) % 7;
  t.setUTCDate(t.getUTCDate() - day + 3);
  const first = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const fd = (first.getUTCDay() + 6) % 7;
  first.setUTCDate(first.getUTCDate() - fd + 3);
  return { y: t.getUTCFullYear(), w: 1 + Math.round((t - first) / 604800000) };
}
function mondayOf(y, w) {
  const first = new Date(y, 0, 4);
  const fd = (first.getDay() + 6) % 7;
  return addDays(first, -fd + (w - 1) * 7);
}
function weeksInYear(y) { return isoWeek(new Date(y, 11, 28)).w; }
const weekKey = (y, w) => y + '-W' + pad(w);
const monthKey = (y, m) => y + '-' + pad(m + 1);
const hueOf = m => m * 30;

/* month of a week = month containing its Thursday */
function weekMonth(y, w) { return addDays(mondayOf(y, w), 3).getMonth(); }

function setHue(m) {
  document.documentElement.style.setProperty('--hue', hueOf(m));
  document.querySelector('meta[name=theme-color]').setAttribute('content', '#EDEDEA');
}

/* ===================== dom ===================== */
function E(tag, attrs, kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'cls') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(c => {
    if (c == null || c === false) return;
    n.append(c.nodeType ? c : document.createTextNode(c));
  });
  return n;
}
const $ = s => document.querySelector(s);
function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }

function grow(ta) { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }
function autoGrowAll(root) { root.querySelectorAll('textarea').forEach(grow); }

const check = on => E('div', { cls: 'box' + (on ? ' on' : '') },
  E('span', { html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>' }));

/* ===================== bound inputs ===================== */
function bindArea(obj, k, ph, big) {
  const ta = E('textarea', {
    rows: big ? 4 : 2, placeholder: ph || '',
    oninput: e => { grow(e.target); obj[k] = e.target.value; save(); }
  });
  ta.value = obj[k] || '';
  requestAnimationFrame(() => grow(ta));
  return ta;
}
function bindText(obj, k, ph, type) {
  const i = E('input', {
    type: type || 'text', placeholder: ph || '',
    oninput: e => { obj[k] = e.target.value; save(); }
  });
  i.value = obj[k] || '';
  return i;
}
function bindLine(arr, i, ph, numbered) {
  const inp = E('input', { type: 'text', placeholder: ph || '', oninput: e => { arr[i] = e.target.value; save(); } });
  inp.value = arr[i] || '';
  return E('div', { cls: 'linebox' }, [numbered ? E('span', { cls: 'num', text: (i + 1) + '.' }) : null, inp]);
}
function scaleRow(obj, k, redraw) {
  const row = E('div', { cls: 'scale' });
  for (let n = 1; n <= 10; n++) {
    row.append(E('button', {
      cls: obj[k] === n ? 'on' : '', text: n,
      onclick: () => { obj[k] = obj[k] === n ? null : n; save(); redraw ? redraw() : render(); }
    }));
  }
  return row;
}
function field(label, node) {
  return E('div', { cls: 'field' }, [label ? E('label', { cls: 'fl', text: label }) : null, node]);
}


/* ===================== prompt schemas (from the journal) ===================== */
const A = (k, l, big) => ({ k, l, ty: 'area', big });
const T = (k, l) => ({ k, l, ty: 'text' });
const L = (k, l, n) => ({ k, l, ty: 'list', n: n || 5 });

const FOUNDATIONS = [
  { id: 'values', t: 'Core values', d: 'Your values sit at the centre of who you are. Goals set against them tend to stick; goals set across them tend to stall.', f: [
    L('values', 'My five core values', 5),
    { k: 'values_note', l: 'Who do I look up to, and what do they value?', ty: 'area' }
  ]},
  { id: 'strengths', t: 'Strengths', d: 'What you do easily, enjoy, and get told you are good at.', f: [
    L('strengths', 'My top five strengths', 5),
    A('str_flow', 'What do I lose track of time doing?'),
    A('str_others', 'What do others see in me that I might not?')
  ]},
  { id: 'purpose', t: 'Purpose', d: 'Where your skills, passion and values meet.', f: [
    A('p_excited', 'What situations get me really excited? What am I doing, who am I with?'),
    A('p_learn', 'What do I enjoy learning about?'),
    A('p_money', "If money wasn't an issue, what would I do with my life?"),
    A('p_help', 'What do I love doing that also helps others?'),
    A('p_change', 'What change do I want to make in the world?'),
    A('p_causes', 'What causes do I feel strongly about?'),
    A('p_value', 'How does what I love doing add value to others?'),
    A('p_living', 'Can I make a living from it?'),
    A('purpose', 'My purpose is…', 1)
  ]},
  { id: 'success', t: 'Definition of success', d: 'Not the inherited definition — yours. Five minutes, no editing.', f: [

  S.rlog = S.rlog || {};

function ritualRate(rid, y, m) {
  const dim = new Date(y, m + 1, 0).getDate();
  const today = new Date();
  let days = 0, hit = 0;
  for (let d = 1; d <= dim; d++) {
    const dt = new Date(y, m, d);
    if (dt > today) break;
    days++;
    if (ritualDone(iso(dt), rid)) hit++;
  }
  return { days, hit, pct: days ? Math.round(hit / days * 100) : 0 };
}

function streak(hid) {
  let n = 0, d = new Date();
  if (!logged(iso(d), hid)) d = addDays(d, -1);

  for (let i = 0; i < days; i++) if (logged(iso(addDays(new Date(), -i)), hid)) hit++;

}

/* ===================== goal progress ===================== */
function goalProgress(g) {
  if (!g) return 0;
  g.milestones = g.milestones || [];
  g.actions = g.actions || [];
  let total = 0, done = 0;
  g.milestones.forEach(m => {
    total++; if (m.d) done++;
    (m.kt || []).forEach(k => { total++; if (k.d) done++; });
  });
  g.actions.forEach(a => { total++; if (a.d) done++; });
  if (!total) return g.completed ? 100 : 0;
  return Math.round(done / total * 100);
}

/* Calendar: a standards .ics file with an alarm on each dated item. */
function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/([,;])/g, '\\$1').replace(/\n/g, '\\n'); }
function icsStamp() { return new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z'; }
function buildIcs(events) {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Goal Digger//EN', 'CALSCALE:GREGORIAN'];
  const alarm = 'TRIGGER:PT' + parseInt((S.cfg.time || '09:00').split(':')[0], 10) + 'H';
  events.forEach((e, n) => {
    const d = e.date.replace(/-/g, ''), end = iso(addDays(parseIso(e.date), 1)).replace(/-/g, '');
    L.push('BEGIN:VEVENT', 'UID:gd-' + n + '-' + d + '@goaldigger', 'DTSTAMP:' + icsStamp(),
      'DTSTART;VALUE=DATE:' + d, 'DTEND;VALUE=DATE:' + end, 'SUMMARY:' + icsEsc(e.title));
    if (e.notes) L.push('DESCRIPTION:' + icsEsc(e.notes));
    L.push('BEGIN:VALARM', alarm, 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(e.title), 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  /* fold long lines at 74 octets, as iCalendar requires */
  return L.map(line => {
    if (line.length <= 74) return line;
    const parts = [line.slice(0, 74)];
    for (let i = 74; i < line.length; i += 73) parts.push(' ' + line.slice(i, i + 73));
    return parts.join('\r\n');
  }).join('\r\n');
}
function datedItems() {
  const out = [];
  (S.projects || []).forEach(p => {
    if (p.done || !p.due) return;
    out.push({ date: p.due, title: (p.title || 'Project') + ' \u2014 due', notes: p.notes });
  });
  S.goals.forEach(g => {
    if (g.completed) return;
    if (g.due) out.push({ date: g.due, title: (g.title || 'Goal') + ' — due', notes: g.what });
    g.milestones.forEach(m => { if (m.due && !m.d) out.push({ date: m.due, title: (m.t || 'Milestone') + ' — ' + (g.title || 'goal'), notes: '' }); });
  });
  return out.sort((a, b) => a.date < b.date ? -1 : 1);
}

/* ---- reading Reminders/Calendar back in, via the clipboard ---- */
function parseAgenda(text) {
  if (!text || !text.trim()) return [];
  const t = text.trim();
  if (t[0] === '[' || t[0] === '{') {
    try {
      const j = JSON.parse(t);
      const arr = Array.isArray(j) ? j : (j.items || []);
      return arr.map(o => ({ t: (o.title || o.t || '').trim(), d: (o.due || o.date || o.d || '').slice(0, 10) }))
        .filter(o => o.t);
    } catch (e) { /* fall through to line parsing */ }
  }
  const out = [];
  t.split(/\r?\n/).forEach(line => {
    let s = line.replace(/^[\s\u2022\-*]+/, '').trim();
    if (!s) return;
    let d = '';
    const m = s.match(/^(\d{4}-\d{2}-\d{2})(?:[ T]\d{1,2}:\d{2}(?::\d{2})?)?\s*[|\u2013\u2014:,-]?\s*(.*)$/);
    if (m && m[2]) { d = m[1]; s = m[2].trim(); }
    if (s) out.push({ t: s, d });
  });
  return out;
}
function setAgenda(text) {
  const items = parseAgenda(text);
  if (!items.length) { toast('Nothing readable'); return false; }
  S.agenda = { at: iso(new Date()), items };
  save(true);
  toast(items.length + ' brought in');
  return true;
}
function agendaFor(dayIso) {
  return (S.agenda.items || []).filter(i => i.d === dayIso || !i.d);
}


/* ---- routing pasted text to wherever it belongs ---- */
function ingest(text, dest) {
  const items = parseAgenda(text);
  if (!items.length) { toast('Nothing readable'); return false; }
  const to = dest || S.cfg.pasteTo || 'agenda';
  if (to === 'today') {
    const D = day(iso(new Date()));
    items.forEach(i => D.tasks.push({ t: i.t, d: false }));
    toast(items.length + " added to today's list");
  } else if (to === 'dump') {
    items.forEach(i => S.dump.push({ id: uid(), t: i.t }));
    toast(items.length + ' added to the brain dump');
  } else if (to === 'week') {
    const wk = isoWeek(new Date()), W = week(wk.y, wk.w);
    items.forEach(i => W.todos.push({ t: i.t, d: false }));
    toast(items.length + " added to this week's to-dos");
  } else {
    S.agenda = { at: iso(new Date()), items };
    toast(items.length + ' brought in');
  }
  save(true);
  return true;
}

/* a spoken-length summary of the day, for a Siri shortcut to read back */
function todayBrief() {
  const k = iso(new Date()), D = S.days[k] || { tasks: [], intent: '', anchor: null }, wk = isoWeek(new Date());
  const W = S.weeks[weekKey(wk.y, wk.w)] || {};
  const L = [];
  if ((D.intent || '').trim() || D.anchor) {
    const at = anchorText(D.anchor);
    L.push('Intention: ' + ((D.intent || '').trim() || 'unwritten') + (at ? ', held against ' + at : '') + '.');
  }
  if (W.focus) L.push('This week: ' + W.focus.split('\n')[0] + '.');
  const open = (D.tasks || []).filter(t => !t.d && t.t.trim());
  L.push(open.length ? 'Today: ' + open.map(t => t.t).join('; ') + '.' : 'Nothing on today\'s list yet.');
  const hs = habitsFor().filter(h => !logged(k, h.id));
  if (hs.length) L.push('Still to do: ' + hs.map(h => h.name || 'a habit').join(', ') + '.');
  const eng = limbsEngaged(k);
  L.push(eng ? eng + ' of eight limbs met so far.' : 'No practice marked yet.');
  const live = S.goals.filter(g => !g.completed);
  if (live.length) L.push('Goals in flight: ' + live.map(g => (g.title || 'untitled') + ' at ' + goalProgress(g) + ' per cent').join(', ') + '.');
  return L.join(' ');
}


/* ===================== loose ends ===================== */
/* Unticked day tasks, oldest first. Each carries where it came from so it
   can be moved rather than retyped. */
function openTasks(fromIso, toIso) {
  const out = [];
  Object.keys(S.days).sort().forEach(dk => {
    if (fromIso && dk < fromIso) return;
    if (toIso && dk > toIso) return;
    (S.days[dk].tasks || []).forEach((t, i) => {
      if (!t.d && (t.t || '').trim()) out.push({ dk, i, t });
    });
  });
  return out;
}
function openWeekTodos() {
  const out = [];
  Object.keys(S.weeks).sort().forEach(wk => {
    (S.weeks[wk].todos || []).forEach((t, i) => {
      if (!t.d && (t.t || '').trim()) out.push({ wk, i, t });
    });
  });
  return out;
}
function moveTaskToDay(src, destIso) {
  const from = S.days[src.dk];
  if (!from) return;
  const [item] = from.tasks.splice(src.i, 1);
  if (!item) return;
  day(destIso).tasks.push(item);
  save(true);
}
function pullIntoWeek(src, wkKey) {
  const from = S.days[src.dk];
  if (!from) return;
  const [item] = from.tasks.splice(src.i, 1);
  if (!item) return;
  const [y, w] = wkKey.split('-W').map(Number);
  week(y, w).todos.push(item);
  save(true);
}

/* the other direction: this week's list feeding a particular day */
function weekTodosFor(y, w) {
  const W = S.weeks[weekKey(y, w)];
  if (!W) return [];
  return (W.todos || []).map((t, i) => ({ t, i })).filter(o => !o.t.d && (o.t.t || '').trim());
}
function pullWeekTodoToDay(y, w, idx, destIso) {
  const W = S.weeks[weekKey(y, w)];
  if (!W) return;
  const [item] = W.todos.splice(idx, 1);
  if (!item) return;
  day(destIso).tasks.push(item);
  save(true);
}

/* take a planned task out of a project so it exists in one place only */
function takeProjectTask(pid, taskId) {
  const pr = projectById(pid);
  if (!pr) return null;
  const i = (pr.tasks || []).findIndex(t => t.id === taskId);
  if (i < 0) return null;
  const [it] = pr.tasks.splice(i, 1);
  return { t: it.t, d: false, p: pr.id, g: (pr.goals || [])[0] || undefined };
}

/* everything that could be pulled into a day, grouped by where it lives */
function pullGroups(y, w) {
  const groups = [];
  const wkTodos = weekTodosFor(y, w);
  if (wkTodos.length) groups.push({ label: "This week's list", items: wkTodos.map(o => ({
    text: o.t.t, sub: o.t.g ? goalTitle(o.t.g) : '',
    take: () => { const W = S.weeks[weekKey(y, w)]; const [it] = W.todos.splice(o.i, 1); return it; }
  }))});

  openProjects().forEach(pr => {
    const open = (pr.tasks || []).filter(t => !t.d && (t.t || '').trim());
    if (!open.length) return;
    open.forEach(t => { if (!t.id) t.id = uid(); });
    groups.push({ label: pr.title || 'Untitled project', note: dueLabel(pr.due), items: open.map(t => ({
      text: t.t, sub: (pr.goals || []).length ? goalTitle(pr.goals[0]) : '',
      take: () => takeProjectTask(pr.id, t.id)
    }))});
  });

  const gItems = [];
  S.goals.filter(g => !g.completed).forEach(g => {
    (g.actions || []).forEach(a => {
      if (a.d || !(a.t || '').trim()) return;
      if (!a.id) a.id = uid();
      gItems.push({ text: a.t, sub: g.title || 'untitled goal',
        take: () => ({ t: a.t, d: false, g: g.id, ga: a.id }) });
    });
  });
  if (gItems.length) groups.push({ label: 'Goal actions', items: gItems });
  return groups;
}

/* things that could fill an empty week: work already waiting somewhere */
function candidates(y, w) {
  const mon = mondayOf(y, w), sun = addDays(mon, 6);
  const out = [];
  openTasks(iso(mon), iso(sun)).forEach(o =>
    out.push({ text: o.t.t, from: 'day · ' + DOW[(parseIso(o.dk).getDay() + 6) % 7], src: o, kind: 'day' }));
  openTasks(null, iso(addDays(mon, -1))).slice(-12).forEach(o =>
    out.push({ text: o.t.t, from: 'left over · ' + o.dk, src: o, kind: 'day' }));
  S.goals.filter(g => !g.completed).forEach(g => {
    (g.actions || []).forEach(a => { if (!a.d && (a.t || '').trim()) {
      if (!a.id) a.id = uid();
      out.push({ text: a.t, from: 'goal · ' + (g.title || 'untitled'), kind: 'goal', g: g.id, ga: a.id });
    }});
    (g.milestones || []).forEach(m => { if (!m.d && (m.t || '').trim()) {
      if (!m.id) m.id = uid();
      out.push({ text: m.t, from: 'milestone · ' + (g.title || 'untitled'), kind: 'goal', g: g.id, ga: m.id });
    }});
  });
  openProjects().forEach(pr => (pr.tasks || []).forEach(t => {
    if (t.d || !(t.t || '').trim()) return;
    if (!t.id) t.id = uid();
    out.push({ text: t.t, from: 'project \u00b7 ' + (pr.title || 'untitled') +
      (pr.due ? ' \u00b7 ' + dueLabel(pr.due) : ''), kind: 'project',
      p: pr.id, g: (pr.goals || [])[0] || undefined, taskId: t.id });
  }));
  (S.dump || []).forEach(d => { if ((d.t || '').trim())
    out.push({ text: d.t, from: 'brain dump', kind: 'dump' }); });
  const seen = new Set();
  return out.filter(c => {
    const k = (c.text || '').trim().toLowerCase();
    if (!k || seen.has(k)) return false;
    seen.add(k); return true;
  });
}


/* ===================== linking work to goals ===================== */
let linkingItem = null;

function goalTitle(id) { const g = S.goals.find(x => x.id === id); return g ? (g.title || 'Untitled goal') : ''; }

/* the chip under a task, and the picker it opens */
function goalLink(item, redraw) {
  const wrap = E('div', { style: 'padding:0 0 6px 29px;display:flex;gap:6px;flex-wrap:wrap;align-items:center' });
  const g = item.g ? S.goals.find(x => x.id === item.g) : null;
  const p = item.p ? projectById(item.p) : null;
  const ms = g && item.ms ? (g.milestones || []).find(x => x.id === item.ms) : null;

  if (p) wrap.append(E('button', { cls: 'tag acc', text: p.title || 'Untitled project',
    onclick: () => { linkingItem = linkingItem === item ? null : item; redraw(); } }));
  if (g) wrap.append(E('button', { cls: 'tag acc',
    text: ms ? (ms.t || 'Milestone') + ' \u00b7 ' + (g.title || 'goal') : (g.title || 'Untitled goal'),
    onclick: () => { linkingItem = linkingItem === item ? null : item; redraw(); } }));
  if (!p && !g) wrap.append(E('button', { cls: 'tag', style: 'border-style:dashed;color:var(--faint)',
    text: '+ project, goal or milestone',
    onclick: () => { linkingItem = linkingItem === item ? null : item; redraw(); } }));
  if (g && item.ga) wrap.append(E('span', { cls: 'pct', text: 'ticks the goal too' }));

  if (linkingItem === item) {
    const panel = E('div', { style: 'width:100%;margin-top:8px;border-left:2px solid var(--rule);padding-left:10px' });
    const projs = openProjects(), goals = S.goals.filter(x => !x.completed);

    if (projs.length) {
      panel.append(E('h3', { style: 'margin:4px 0 0', text: 'Projects' }));
      projs.forEach(pr => panel.append(E('button', {
        cls: 'menu-item', style: 'font-size:13px;padding:9px 0',
        onclick: () => {
          if (item.p === pr.id) delete item.p;
          else {
            item.p = pr.id;
            if (!item.g && (pr.goals || []).length) item.g = pr.goals[0];   /* inherit the goal it serves */
          }
          linkingItem = null; save(true); redraw();
        }}, [pr.title || 'Untitled project',
            E('span', { cls: 'pct', text: item.p === pr.id ? 'linked' : (dueLabel(pr.due) || '') })])));
    }

    panel.append(E('h3', { style: 'margin:12px 0 0', text: 'Goals' }));
    goals.forEach(gg => panel.append(E('button', {
      cls: 'menu-item', style: 'font-size:13px;padding:9px 0',
      onclick: () => {
        if (item.g === gg.id && !item.ms) { delete item.g; delete item.ga; }
        else { item.g = gg.id; delete item.ms; }
        linkingItem = null; save(true); redraw();
      }}, [gg.title || 'Untitled goal',
          E('span', { cls: 'pct', text: item.g === gg.id && !item.ms ? 'linked' : goalProgress(gg) + '%' })])));

    const stones = [];
    goals.forEach(gg => (gg.milestones || []).forEach(ms => {
      if (!(ms.t || '').trim()) return;
      if (!ms.id) ms.id = uid();
      stones.push({ g: gg, ms });
    }));
    if (stones.length) {
      panel.append(E('h3', { style: 'margin:12px 0 0', text: 'Milestones' }));
      stones.forEach(({ g: gg, ms }) => panel.append(E('button', {
        cls: 'menu-item', style: 'font-size:13px;padding:9px 0',
        onclick: () => {
          if (item.ms === ms.id) { delete item.ms; delete item.g; }
          else { item.ms = ms.id; item.g = gg.id; }
          linkingItem = null; save(true); redraw();
        }}, [
        E('span', {}, [ms.t, E('small', { text: gg.title || 'Untitled goal' })]),
        E('span', { cls: 'pct', text: item.ms === ms.id ? 'linked' : (ms.d ? 'reached' : '') })
      ])));
    }

    panel.append(E('button', { cls: 'menu-item', style: 'font-size:12px;color:var(--mut);padding:9px 0',
      onclick: () => { delete item.g; delete item.ga; delete item.p; linkingItem = null; save(true); redraw(); } },
      'Neither'));
    wrap.append(panel);
  }
  return wrap;
}

/* every task anywhere that points at a goal */
function tasksForGoal(id) {
  const out = [];
  Object.keys(S.days).sort().forEach(dk => (S.days[dk].tasks || []).forEach(t => {
    if (t.g === id) out.push({ where: dk, t });
  }));
  Object.keys(S.weeks).sort().forEach(wk => {
    (S.weeks[wk].todos || []).forEach(t => { if (t.g === id) out.push({ where: wk.replace('-W', ' week '), t }); });
    (S.weeks[wk].goals || []).forEach(t => { if (t.g === id) out.push({ where: wk.replace('-W', ' week ') + ' \u00b7 weekly goal', t }); });
  });
  return out;
}

/* how this week's effort is actually distributed */
function weekEffort(y, w) {
  const mon = mondayOf(y, w), tally = {}, none = { n: 0, done: 0 };
  const add = t => {
    if (!(t.t || '').trim()) return;
    let gid = t.g;
    if (!gid && t.p) { const pr = projectById(t.p); gid = pr && (pr.goals || [])[0]; }
    if (!gid) { none.n++; if (t.d) none.done++; return; }
    const r = tally[gid] = tally[gid] || { n: 0, done: 0 };
    r.n++; if (t.d) r.done++;
  };
  for (let i = 0; i < 7; i++) ((S.days[iso(addDays(mon, i))] || {}).tasks || []).forEach(add);
  ((S.weeks[weekKey(y, w)] || {}).todos || []).forEach(add);
  ((S.weeks[weekKey(y, w)] || {}).goals || []).forEach(add);
  return { tally, none };
}

/* ticking a task that came from a goal action ticks the action too */
function syncTaskToGoal(item) {
  if (!item.g || !item.ga) return;
  const g = S.goals.find(x => x.id === item.g);
  if (!g) return;
  const a = (g.actions || []).find(x => x.id === item.ga);
  if (a) a.d = item.d;
  const m = (g.milestones || []).find(x => x.id === item.ga);
  if (m) m.d = item.d;
}

/* ===================== what a month actually touched ===================== */
function activeInMonth(y, m) {
  const ids = new Set();
  const note = t => { if (t.g) ids.add('g:' + t.g); if (t.p) ids.add('p:' + t.p); };
  const first = iso(new Date(y, m, 1)), last = iso(new Date(y, m + 1, 0));
  Object.keys(S.days).forEach(dk => {
    if (dk < first || dk > last) return;
    (S.days[dk].tasks || []).forEach(note);
  });
  Object.keys(S.weeks).forEach(wk => {
    const [wy, ww] = wk.split('-W').map(Number);
    if (weekMonth(wy, ww) !== m || wy !== y) return;
    (S.weeks[wk].todos || []).forEach(note);
    (S.weeks[wk].goals || []).forEach(note);
  });
  const M = (S.months || {})[monthKey(y, m)];
  if (M) (M.goals || []).forEach(g => { note(g); (g.focus || []).forEach(note); });
  return Array.from(ids).map(k => {
    const [kind, id] = [k.slice(0, 1), k.slice(2)];
    if (kind === 'p') { const p = projectById(id); return p && { key: k, kind: 'project', id, obj: p, pct: projectProgress(p) }; }
    const g = S.goals.find(x => x.id === id);
    return g && { key: k, kind: 'goal', id, obj: g, pct: goalProgress(g) };
  }).filter(Boolean);
}

/* things finished inside a month, for the review to draw on */
function finishedInMonth(y, m) {
  const out = [];
  const first = iso(new Date(y, m, 1)), last = iso(new Date(y, m + 1, 0));
  Object.keys(S.days).sort().forEach(dk => {
    if (dk < first || dk > last) return;
    (S.days[dk].tasks || []).forEach(t => { if (t.d && (t.t || '').trim()) out.push({ text: t.t, from: dk }); });
  });
  Object.keys(S.weeks).forEach(wk => {
    const [wy, ww] = wk.split('-W').map(Number);
    if (weekMonth(wy, ww) !== m || wy !== y) return;
    (S.weeks[wk].goals || []).forEach(t => { if (t.d && (t.t || '').trim()) out.push({ text: t.t, from: 'weekly goal' }); });
    (S.weeks[wk].wins || []).forEach(x => { if ((x || '').trim()) out.push({ text: x, from: 'week ' + ww + ' win' }); });
  });
  S.goals.forEach(g => (g.milestones || []).forEach(ms => {
    if (ms.d && (ms.t || '').trim()) out.push({ text: ms.t, from: 'milestone \u00b7 ' + (g.title || 'goal') });
  }));
  S.projects.forEach(p => { if (p.done && p.done >= first && p.done <= last)
    out.push({ text: p.title || 'Untitled project', from: 'project finished' }); });
  const seen = new Set();
  return out.filter(o => { const k = o.text.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
}

/* ===================== everything you have written ===================== */
/* Day, week and month notes are journal entries. They keep living where they
   were written, but the Notes tab can see them, tag them, and cite them. */

function journalEntries() {
  const out = [];
  Object.keys(S.days).forEach(dk => {
    const d = S.days[dk];
    if (!(d.note || '').trim() && !(d.themes || []).length) return;
    out.push({ id: 'day:' + dk, kind: 'day', date: dk, obj: d, body: d.note || '',
      label: DOW[(parseIso(dk).getDay() + 6) % 7] + ' ' + dk,
      open: () => { R.day = dk; go('today'); } });
  });
  Object.keys(S.weeks).forEach(wk => {
    const w = S.weeks[wk];
    if (!(w.notes || '').trim() && !(w.themes || []).length) return;
    const [y, ww] = wk.split('-W').map(Number);
    out.push({ id: 'week:' + wk, kind: 'week', date: iso(mondayOf(y, ww)), obj: w, body: w.notes || '',
      label: 'Week ' + pad(ww) + ', ' + y,
      open: () => { R.wk = { y, w: ww }; go('week'); } });
  });
  Object.keys(S.months || {}).forEach(mk => {
    const m = S.months[mk];
    if (!(m.note || '').trim() && !(m.themes || []).length) return;
    const [y, mm] = mk.split('-').map(Number);
    out.push({ id: 'month:' + mk, kind: 'month', date: iso(new Date(y, mm - 1, 1)), obj: m, body: m.note || '',
      label: MONTHS[mm - 1] + ' ' + y,
      open: () => { R.year = y; R.mo = mm - 1; go('month'); } });
  });
  return out.sort((a, b) => a.date < b.date ? 1 : -1);
}
const journalById = id => journalEntries().find(j => j.id === id);

/* the tag row shared by notes, days, weeks and months */
function tagRow(obj, redraw, opts) {
  opts = opts || {};
  obj.themes = obj.themes || [];
  const wrap = E('div', { style: 'margin-top:8px' });
  const chips = E('div', { cls: 'chips' });
  obj.themes.forEach((t, i) => chips.append(E('button', { cls: 'chip', style: 'font-size:12px;padding:5px 10px',
    onclick: () => { obj.themes.splice(i, 1); save(true); redraw(); } }, [t, E('span', { style: 'opacity:.5', text: '\u00d7' })])));
  const vocab = allThemeCounts().filter(t => !obj.themes.some(x => sameTheme(x, t.label))).slice(0, 6);
  vocab.forEach(t => chips.append(E('button', { cls: 'chip', style: 'font-size:11.5px;padding:4px 9px;border-style:dashed;color:var(--mut)',
    text: '+ ' + t.label, onclick: () => { obj.themes.push(t.label); save(true); redraw(); } })));
  const inp = E('input', { type: 'text', placeholder: 'New thread', style: 'font-size:13px;max-width:150px' });
  inp.addEventListener('blur', () => {
    const v2 = inp.value.trim();
    if (!v2) return;
    if (!obj.themes.some(x => sameTheme(x, v2))) obj.themes.push(v2);
    inp.value = ''; save(true); redraw();
  });
  chips.append(inp);
  wrap.append(chips);
  if (opts.link !== false) wrap.append(goalLink(obj, redraw));
  if (opts.cite) {
    wrap.append(E('div', { style: 'display:flex;gap:10px;align-items:center;margin-top:8px' }, [
      E('button', { cls: 'box' + (obj.key ? ' on' : ''), style: 'flex:none;margin-top:0',

        onclick: () => { obj.key = !obj.key; save(true); redraw(); } }),

    ]));
    if (obj.key) wrap.append(bindArea(obj, 'pull', 'Passage to quote \u2014 blank uses the note itself'));

}


/* notes, journal entries and sessions pointing at a goal or one of its milestones */
function writingAbout(goalId, msId) {
  const hit = o => o && o.g === goalId && (!msId || o.ms === msId) && (msId || !o.ms || true);
  const out = [];
  (S.notes || []).forEach(n => { if (hit(n) && (!msId || n.ms === msId))
    out.push({ label: n.title || 'Untitled note', body: n.body || '', where: 'note', open: () => go('more', 'notes') }); });
  journalEntries().forEach(j => { if (hit(j.obj) && (!msId || j.obj.ms === msId))
    out.push({ label: j.label, body: j.body || '', where: j.kind, open: j.open }); });
  S.studio.entries.forEach(e => { if (!e.draft && e.goal === goalId)
    out.push({ label: e.title || 'Untitled session', body: e.claim || e.inAction || '', where: 'studio',
      open: () => { studioView = 'list'; openEntry = e.id; go('studio'); } }); });
  return out;
}

/* move or copy a pooled candidate into a week's list, depending on where it lives */
function takeCandidate(c, W, wkKey) {
  if (c.kind === 'day' && c.src) { pullIntoWeek(c.src, wkKey); return; }
  if (c.kind === 'project' && c.p && c.taskId) {
    const item = takeProjectTask(c.p, c.taskId);
    if (item) { W.todos.push(item); save(true); }
    return;
  }
  W.todos.push({ t: c.text, d: false, g: c.g || undefined, ga: c.ga || undefined, p: c.p || undefined });
  save(true);
}

    E('button', { cls: 'btn ghost', text: 'Open week', onclick: () => { R.wk = wk; go('week'); } })]));
  wc.append(field('Weekly focus', bindArea(W, 'focus', 'The one thing this week is for.')));
  W.goals = W.goals || [];
  const wg = E('div');
  if (!W.goals.length) wg.append(E('div', { cls: 'empty', text: 'None set. Open the week to name up to three.' }));
  W.goals.forEach(gi => {
    const owner = gi.p ? projectById(gi.p) : (gi.g ? S.goals.find(x => x.id === gi.g) : null);
    wg.append(E('div', { cls: 'list-item' }, [
      E('button', { cls: 'box' + (gi.d ? ' on' : ''), style: 'flex:none',
        html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>',
        onclick: () => { gi.d = !gi.d; syncTaskToGoal(gi); save(true); render(); } }),
      E('div', { cls: 'txt' }, [
        E('div', { style: 'font-size:14.5px' + (gi.d ? ';color:var(--faint);text-decoration:line-through' : ''), text: gi.t || '\u2014' }),
        owner ? E('div', { cls: 'pct', text: owner.title || '' }) : null
      ])
    ]));
  });
  wc.append(field('Weekly goals', wg));
  if (W.todos.length) {
    const open = W.todos.filter(t => !t.d).length;
    wc.append(E('div', { cls: 'pct', style: 'margin-top:10px', text: open + ' of ' + W.todos.length + ' to-dos still open' }));
  }
  v.append(wc);

  /* practice + studio */
  const pc = E('div', { cls: 'card' });
  pc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Practice' }),
    E('button', { cls: 'btn ghost', text: 'Open', onclick: () => go('practice') })]));
  pc.append(limbSpectrum(k, 22));
  const eng = limbsEngaged(k), lst = limbStreak();
  pc.append(E('div', { cls: 'pct', style: 'margin-top:8px',
    text: eng ? eng + ' of 8 limbs met' + (lst > 1 ? ' · ' + lst + ' days unbroken' : '') : 'Nothing marked today' }));
  v.append(pc);

  const sessions = entriesFor(k);
  const stc = E('div', { cls: 'card' });
  stc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Studio' }),
    E('button', { cls: 'btn ghost', text: sessions.length ? 'Open' : '+ Session',
      onclick: () => { studioView = sessions.length ? 'list' : 'form'; editingId = null; formDate = k; go('studio'); } })]));
  const draft = S.studio.entries.find(e => e.draft);
  if (draft) stc.append(E('div', { cls: 'list-item' }, [
    E('span', { cls: 'txt', style: 'font-size:14.5px', text: (draft.title || 'Untitled') + ' — unfinished' }),
    E('button', { cls: 'tag acc', text: 'Resume', onclick: () => { editingId = draft.id; studioView = 'form'; go('studio'); } })
  ]));
  if (!sessions.length && !draft) stc.append(E('div', { cls: 'empty', text: 'No session documented on this day.' }));
  sessions.forEach(e => stc.append(E('div', { cls: 'list-item' }, [
    E('span', { cls: 'txt', style: 'font-size:14.5px', text: e.title || 'Untitled session' }),
    E('span', { style: 'display:flex;gap:4px' }, MODES.map(m =>
      E('span', { style: `width:16px;height:4px;border-radius:2px;background:${m.hex};opacity:${(e[m.id] || '').trim() ? 1 : .16}` })))
  ])));
  v.append(stc);

  /* goals in flight */
  const live = S.goals.filter(g => !g.completed).slice(0, 4);
  const gc = E('div', { cls: 'card' });
  gc.append(E('div', { cls: 'head' }, [E('h2', { text: 'Goals in flight' }),
    E('button', { cls: 'btn ghost', text: 'All goals', onclick: () => go('goals') })]));
  if (!live.length) gc.append(E('div', { cls: 'empty', text: 'No open goals. Start with a brain dump, then pick no more than eight.' }));
  live.forEach(g => {
    const p = goalProgress(g);
    gc.append(E('button', { style: 'display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--rule)',
      onclick: () => go('goals', null, g.id) }, [
      E('div', { style: 'display:flex;justify-content:space-between;gap:10px;align-items:baseline' }, [
        E('span', { text: g.title || 'Untitled goal' }),
        E('span', { cls: 'pct', text: p + '%' })
      ]),
      E('div', { cls: 'bar' }, E('i', { style: 'width:' + p + '%' }))
    ]));
  });
  v.append(gc);
  return v;
}

/* ===================== WEEK ===================== */
function viewWeek() {
  const { y, w } = R.wk, W = week(y, w), mon = mondayOf(y, w), sun = addDays(mon, 6);
  const v = E('div');
  const span = mon.getDate() + ' ' + MONTHS[mon.getMonth()].slice(0, 3) +
    ' – ' + sun.getDate() + ' ' + MONTHS[sun.getMonth()].slice(0, 3);

  v.append(E('div', { cls: 'nav' }, [
    E('button', { text: '‹', 'aria-label': 'Previous week', onclick: () => { R.wk = isoWeek(addDays(mon, -7)); render(); } }),
    E('div', { cls: 'mid' }, [
      E('div', { cls: 'eyebrow', text: 'Week ' + pad(w) + (y !== CURRENT_YEAR ? ' · ' + y : '') }),
      E('div', { style: 'font-family:var(--disp);font-size:21px;text-transform:uppercase;letter-spacing:.04em;font-weight:700', text: span })
    ]),
    E('button', { text: '›', 'aria-label': 'Next week', onclick: () => { R.wk = isoWeek(addDays(mon, 7)); render(); } })
  ]));

  const c1 = E('div', { cls: 'card on' });
  c1.append(field('Weekly focus', bindArea(W, 'focus')));
  c1.append(field('How I want to feel this week', bindArea(W, 'feel')));
  v.append(c1);

  const c2 = E('div', { cls: 'card' });
  W.grat = W.grat || []; W.goals = W.goals || [];
  c2.append(E('h2', { text: 'Weekly goals' }));
  c2.append(E('p', { cls: 'lede', text: 'Three at most. Link each one to the goal or project it moves, and it counts as work toward it.' }));
  c2.append(checkList(W.goals, 'Nothing set for this week.', render, { link: true, note: false }));
  if (W.goals.length < 3) {
    const cands = [].concat(
      openProjects().map(p2 => ({ label: p2.title || 'Untitled project', sub: dueLabel(p2.due), p: p2.id, g: (p2.goals || [])[0] })),
      S.goals.filter(g3 => !g3.completed).map(g3 => ({ label: g3.title || 'Untitled goal', sub: goalProgress(g3) + '%', g: g3.id })));
    if (cands.length) {
      c2.append(E('div', { cls: 'rule' }));
      c2.append(E('button', { cls: 'btn ghost', style: 'padding-left:0',
        text: (weekGoalOpen ? '\u2212' : '+') + ' Set one from a goal or project',
        onclick: () => { weekGoalOpen = !weekGoalOpen; render(); } }));
      if (weekGoalOpen) {
        const list = E('div', { style: 'border-left:2px solid var(--rule);padding-left:11px;margin-top:6px' });
        cands.forEach(c => list.append(E('button', { cls: 'menu-item', style: 'font-size:13px;padding:9px 0',
          onclick: () => {
            W.goals.push({ t: 'Move ' + c.label + ' forward', d: false, g: c.g || undefined, p: c.p || undefined });
            weekGoalOpen = false; save(true); render();
          }}, [c.label, E('span', { cls: 'pct', text: c.sub || '' })])));
        c2.append(list);
      }
    }
  }
  v.append(c2);

  /* gratitude gathered from the days */
  const gath = E('div', { cls: 'card' });
  let gcount = 0;
  const gbody = E('div');
  for (let i = 0; i < 7; i++) {
    const dt = addDays(mon, i), dk = iso(dt);
    const items = ((S.days[dk] || {}).grat || []).filter(x => (x || '').trim());
    if (!items.length) continue;
    gcount += items.length;
    const row = E('div', { style: 'display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--rule)' });
    row.append(E('button', { cls: 'dn', style: 'text-align:left;flex:none',
      onclick: () => { R.day = dk; go('today'); } }, [DOW[i], E('b', { text: pad(dt.getDate()) })]));
    row.append(E('div', { style: 'flex:1;min-width:0' },
      items.map(t => E('div', { style: 'font-size:14.5px;padding:1px 0', text: t }))));
    gbody.append(row);
  }
  gath.append(E('div', { cls: 'head' }, [E('h2', { text: 'Gratitude' }),
    gcount ? E('span', { cls: 'pct', text: gcount + ' this week' }) : null]));
  if (gcount) gath.append(gbody);
  else gath.append(E('div', { cls: 'empty', text: 'Nothing captured yet. Add a line on any day and it gathers here.' }));
  gath.append(E('div', { cls: 'rule' }));
  const g1 = E('div'); for (let i = 0; i < 3; i++) g1.append(bindLine(W.grat, i, '', true));
  gath.append(field('For the week as a whole', g1));
  v.append(gath);

  /* habit grid */
  if (habitsFor().length) {
    const hc = E('div', { cls: 'card' });
    hc.append(E('h2', { text: 'Habits' }));
    const tbl = E('table', { cls: 'hgrid' });
    const hr = E('tr', {}, E('th', { cls: 'nm' }));
    DOW.forEach(d => hr.append(E('th', { text: d[0] })));
    hr.append(E('th', { text: 'No.' }));
    tbl.append(E('thead', {}, hr));
    const tb = E('tbody');
    habitsFor().forEach(h => {
      const tr = E('tr', {}, E('td', { cls: 'nm' }, [
        E('span', { style: `display:inline-block;width:8px;height:8px;border-radius:50%;background:hsl(${h.hue},62%,50%);margin-right:7px` }),
        h.name || 'Habit'
      ]));
      let n = 0;
      for (let i = 0; i < 7; i++) {
        const dk = iso(addDays(mon, i)), on = logged(dk, h.id);
        if (on) n++;
        tr.append(E('td', {}, E('button', {
          cls: 'cell', style: on ? `background:hsl(${h.hue},62%,48%);border-color:transparent` : '',
          'aria-label': h.name + ' ' + dk,
          onclick: () => { toggleHabit(dk, h.id); render(); }
        })));
      }
      tr.append(E('td', { cls: 'mono', style: 'font-size:12px;color:var(--mut)', text: n }));
      tb.append(tr);
    });
    tbl.append(tb);
    hc.append(tbl);
    v.append(hc);
  }

  /* days */
  const dc = E('div', { cls: 'card' });
  dc.append(E('h2', { text: 'The week' }));
  for (let i = 0; i < 7; i++) {
    const dt = addDays(mon, i), dk = iso(dt), D = day(dk), isToday = sameDay(dt, new Date());
    const row = E('div', { cls: 'day' + (isToday ? ' today' : '') });
    row.append(E('button', { cls: 'dn', style: 'text-align:left', 'aria-label': 'Open ' + dk,
      onclick: () => { R.day = dk; go('today'); } }, [DOW[i], E('b', { text: pad(dt.getDate()) })]));
    const body = E('div', { style: 'flex:1;min-width:0' });
    if (limbsEngaged(dk) || entriesFor(dk).length) {
      body.append(E('div', { style: 'display:flex;gap:6px;align-items:center;margin-bottom:4px' }, [
        limbsEngaged(dk) ? E('div', { style: 'flex:1;max-width:120px' }, limbSpectrum(dk, 5)) : null,
        entriesFor(dk).length ? E('span', { cls: 'pct', style: 'color:#C6337E', text: 'studio' }) : null
      ]));
    }
    if ((D.intent || '').trim() || D.anchor) {
      const ai2 = anchorInfo(D.anchor);
      body.append(E('div', { style: 'margin-bottom:2px' }, [
        (D.intent || '').trim() ? E('span', {
          style: 'font-family:var(--disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)',
          text: D.intent }) : null,
        ai2 ? E('span', { style: `font-family:var(--disp);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:${ai2.hex};margin-left:7px`, text: ai2.label }) : null
      ]));
    }
    body.append(bindArea(D, 'note', isToday ? 'Today…' : ''));
    D.tasks.forEach((t, ti) => {
      body.append(E('div', { style: 'display:flex;gap:8px;align-items:flex-start;padding:3px 0' }, [
        E('button', { cls: 'box' + (t.d ? ' on' : ''),
          html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>',
          onclick: () => { t.d = !t.d; save(); render(); } }),
        E('div', { cls: 'txt' }, [
          E('div', { cls: (t.d ? 'done' : ''), style: 'font-size:14px;padding-top:2px', text: t.t || '\u2014' }),
          (t.n || '').trim() ? E('div', { cls: 'pct', text: t.n.trim().replace(/\n+/g, ' ').slice(0, 60) }) : null
        ])
      ]));
    });
    row.append(body);
    dc.append(row);
  }
  v.append(dc);

  const c3 = E('div', { cls: 'card' });
  c3.append(E('h2', { text: 'Things to do' }));
  c3.append(checkList(W.todos, 'Nothing listed for this week yet.', render, { link: true }));

  /* what is still open in the days of this week */
  const wkKey = weekKey(y, w);
  const openDays = openTasks(iso(mon), iso(sun));
  if (openDays.length) {
    c3.append(E('div', { cls: 'rule' }));
    c3.append(E('div', { cls: 'head' }, [E('h3', { text: 'Still open in the days' }),
      E('span', { cls: 'pct', text: openDays.length })]));
    openDays.forEach(o => c3.append(E('div', { cls: 'list-item' }, [
      E('button', { cls: 'box', style: 'flex:none',
        html: '<svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg>',
        onclick: () => { o.t.d = true; save(true); render(); } }),
      E('div', { cls: 'txt' }, [
        E('div', { style: 'font-size:14.5px', text: o.t.t }),
        E('div', { cls: 'pct', text: DOW[(parseIso(o.dk).getDay() + 6) % 7] + ' ' + o.dk.slice(8) })
      ]),
      E('button', { cls: 'tag acc', text: 'To the week',
        onclick: () => { pullIntoWeek(o, wkKey); render(); } })
    ])));
  }

  /* pull work up into the week at any time */
  const pool = candidates(y, w);
  const done = W.todos.length && W.todos.every(t => t.d || !(t.t || '').trim());
  if (pool.length && !(done && !openDays.length)) {
    c3.append(E('div', { cls: 'rule' }));
    c3.append(E('button', { cls: 'btn ghost', style: 'padding-left:0',
      text: (weekPullOpen ? '\u2212' : '+') + ' Pull in work (' + pool.length + ')',
      onclick: () => { weekPullOpen = !weekPullOpen; render(); } }));
    if (weekPullOpen) {
      const list = E('div', { style: 'border-left:2px solid var(--rule);padding-left:11px;margin-top:6px' });
      pool.slice(0, 20).forEach(c => list.append(E('div', { cls: 'list-item' }, [
        E('div', { cls: 'txt' }, [
          E('div', { style: 'font-size:14.5px', text: c.text }),
          E('div', { cls: 'pct', text: c.from })
        ]),
        E('button', { cls: 'tag acc', text: 'Add', onclick: () => { takeCandidate(c, W, wkKey); render(); } })
      ])));
      if (pool.length > 20) list.append(E('div', { cls: 'pct', text: pool.length - 20 + ' more' }));
      c3.append(list);
    }
  }

  /* everything ticked — offer what could come next */
  if (done && !openDays.length) {
    c3.append(E('div', { cls: 'rule' }));
    c3.append(E('h3', { text: 'All clear' }));
    if (!pool.length) {
      c3.append(E('p', { cls: 'lede', style: 'margin:0', text: 'Everything on the list is ticked and nothing is waiting. Rest, or write the next thing straight in.' }));
    } else {
      c3.append(E('p', { cls: 'lede', text: 'Everything is ticked. These are waiting elsewhere \u2014 pull in what belongs to this week.' }));
      pool.slice(0, 10).forEach(c => c3.append(E('div', { cls: 'list-item' }, [
        E('div', { cls: 'txt' }, [
          E('div', { style: 'font-size:14.5px', text: c.text }),
          E('div', { cls: 'pct', text: c.from })
        ]),
        E('button', { cls: 'tag acc', text: 'Add', onclick: () => { takeCandidate(c, W, wkKey); render(); } })
      ])));
      if (pool.length > 10) c3.append(E('div', { cls: 'pct', style: 'margin-top:8px',
        text: pool.length - 10 + ' more waiting \u2014 see Loose ends under More' }));
    }
  }
  c3.append(E('div', { cls: 'btnrow' }, remBtn('Send to Reminders',
    () => W.todos.filter(t => !t.d).map(t => ({ title: t.t, due: iso(sun) })))));
  c3.append(E('div', { cls: 'rule' }));
  c3.append(field('Notes', areaWithLinks(W, 'notes', '', 1, S.links)));
  if ((W.notes || '').trim() || (W.themes || []).length) c3.append(tagRow(W, render, { cite: true }));
  v.append(c3);

  /* where the week's effort actually went */
  const eff = weekEffort(y, w);
  const totalTasks = Object.values(eff.tally).reduce((a, r) => a + r.n, 0) + eff.none.n;
  if (totalTasks) {
    const ec = E('div', { cls: 'card' });
    ec.append(E('div', { cls: 'head' }, [E('h2', { text: 'Where the week went' }),
      E('span', { cls: 'pct', text: totalTasks + ' item' + (totalTasks === 1 ? '' : 's') })]));
    const bar = E('div', { style: 'display:flex;height:10px;border-radius:2px;overflow:hidden;background:var(--paper)' });
    const ids = Object.keys(eff.tally);
    ids.forEach((gid, i) => bar.append(E('div', {
      style: `width:${eff.tally[gid].n / totalTasks * 100}%;background:hsl(${(i * 67 + 20) % 360},58%,52%)` })));
    if (eff.none.n) bar.append(E('div', { style: `width:${eff.none.n / totalTasks * 100}%;background:var(--rule)` }));
    ec.append(bar);
    ids.forEach((gid, i) => {
      const r = eff.tally[gid];
      ec.append(E('button', { style: 'display:flex;width:100%;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--rule);text-align:left',
        onclick: () => go('goals', null, gid) }, [
        E('span', { style: `width:9px;height:9px;border-radius:50%;flex:none;background:hsl(${(i * 67 + 20) % 360},58%,52%)` }),
        E('span', { style: 'flex:1;min-width:0;font-size:14.5px', text: goalTitle(gid) }),
        E('span', { cls: 'pct', text: r.done + '/' + r.n })
      ]));
    });
    if (eff.none.n) ec.append(E('div', { style: 'display:flex;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--rule)' }, [
      E('span', { style: 'width:9px;height:9px;border-radius:50%;flex:none;background:var(--rule)' }),
      E('span', { style: 'flex:1;font-size:14.5px;color:var(--mut)', text: 'Unattached' }),
      E('span', { cls: 'pct', text: eff.none.done + '/' + eff.none.n })
    ]));
    if (eff.none.n > totalTasks * 0.6) ec.append(E('p', { cls: 'lede', style: 'margin-top:10px',
      text: 'Most of this week is unattached to any goal. Sometimes that is exactly right \u2014 worth noticing either way.' }));
    v.append(ec);
  }

  const c4 = E('div', { cls: 'card' });
  W.wins = W.wins || [];
  const wl = E('div'); for (let i = 0; i < 3; i++) wl.append(bindLine(W.wins, i, '', true));
  c4.append(field('Top three wins', wl));
  c4.append(field('Rate this week', scaleRow(W, 'rate')));
  v.append(c4);
  return v;
}

/* ===================== MONTH ===================== */
function viewMonth() {
  const m = R.mo, Y = R.year, M = month(Y, m), v = E('div');
  v.append(E('div', { cls: 'nav' }, [
    E('button', { text: '‹', 'aria-label': 'Previous month',
      onclick: () => { if (m === 0) { R.year--; R.mo = 11; } else R.mo = m - 1; render(); } }),
    E('div', { cls: 'mid' }, [
      yearPicker(),
      E('div', { style: 'font-family:var(--disp);font-size:27px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;line-height:1', text: MONTHS[m] })
    ]),
    E('button', { text: '›', 'aria-label': 'Next month',
      onclick: () => { if (m === 11) { R.year++; R.mo = 0; } else R.mo = m + 1; render(); } })
  ]));

  /* calendar */
  const cal = E('div', { cls: 'card' });
  const first = new Date(Y, m, 1), startPad = (first.getDay() + 6) % 7;
  const dim = new Date(Y, m + 1, 0).getDate();
  const grid = E('div', { style: 'display:grid;grid-template-columns:repeat(7,1fr);gap:3px' });
  DOW.forEach(d => grid.append(E('div', { cls: 'eyebrow', style: 'text-align:center;font-size:9px', text: d[0] })));
  for (let i = 0; i < startPad; i++) grid.append(E('div'));
  for (let dn = 1; dn <= dim; dn++) {
    const dt = new Date(Y, m, dn), dk = iso(dt);
    const hits = (S.hlog[dk] || []).length;
    const hasNote = (S.days[dk] && (S.days[dk].note || S.days[dk].tasks.length));
    const isToday = sameDay(dt, new Date());
    grid.append(E('button', {
      style: `aspect-ratio:1;border:1px solid ${isToday ? 'var(--acc)' : 'var(--rule)'};border-radius:2px;background:${hits ? `hsl(var(--hue),62%,${96 - Math.min(hits, 5) * 8}%)` : '#fff'};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px`,
      onclick: () => { R.day = dk; go('today'); }
    }, [
      E('span', { cls: 'mono', style: 'font-size:12.5px;' + (isToday ? 'color:var(--acc);font-weight:700' : ''), text: dn }),
      E('span', { style: 'display:flex;gap:2px;height:4px' }, [
        E('span', { style: `width:4px;height:4px;border-radius:50%;background:${hasNote ? 'var(--ink)' : 'transparent'}` }),

      ])
    ]));
  }
  cal.append(grid);

  /* month goals */
  const gc = E('div', { cls: 'card' });
  gc.append(E('h2', { text: MONTHS[m] + ' goals' }));

    const blk = E('div', { style: i ? 'margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)' : '' });
    blk.append(field('Goal ' + (i + 1), bindText(g, 't', 'What are you moving this month?')));

        else { g.g = val.slice(2); g.p = ''; }
        save(); render(); } });
    msel.append(E('option', { value: 'g:' }, 'Not linked'));
    openProjects().forEach(p2 => {
      const o = E('option', { value: 'p:' + p2.id }, 'Project \u00b7 ' + (p2.title || 'Untitled'));
      if (g.p === p2.id) o.setAttribute('selected', 'selected');
      msel.append(o);
    });
    S.goals.filter(x => !x.completed).forEach(x => {
      const o = E('option', { value: 'g:' + x.id }, 'Goal \u00b7 ' + (x.title || 'Untitled'));
      if (!g.p && g.g === x.id) o.setAttribute('selected', 'selected');
      msel.append(o);
    });
    blk.append(field('Moves', msel));
    const owner = g.p ? projectById(g.p) : (g.g ? S.goals.find(x => x.id === g.g) : null);
    if (owner) blk.append(E('div', { cls: 'bar' }, E('i', { style: 'width:' +
      (g.p ? projectProgress(owner) : goalProgress(owner)) + '%' })));

    blk.append(field('Focus', checkList(g.focus, 'What are the three moves?', render, { link: true, note: false })));

  v.append(gc);

  /* rituals */
  const rc = E('div', { cls: 'card' });
  rc.append(E('h2', { text: 'Rituals' }));
  rc.append(E('p', { cls: 'lede', text: 'These appear on Today to be ticked off. The percentage is how often you have kept each one this month.' }));
  M.am = M.am || []; M.pm = M.pm || [];
  [['am', 'Morning'], ['pm', 'Evening']].forEach(([which, label]) => {
    const box = E('div');
    M[which].forEach((r, i) => {
      const rate = ritualRate(r.id, Y, m);
      const line = E('div', { style: 'padding:7px 0;border-top:' + (i ? '1px solid var(--rule)' : '0') });
      const inp = E('input', { type: 'text', placeholder: label + ' ritual',

      inp.value = r.t || '';
      line.append(E('div', { style: 'display:flex;gap:9px;align-items:center' }, [
        E('span', { cls: 'num', text: (i + 1) + '.' }),
        E('div', { style: 'flex:1;min-width:0' }, inp),

    box.append(E('button', { cls: 'btn ghost', style: 'margin-top:8px', text: '+ Add',
      onclick: () => { M[which].push({ id: uid(), t: '' }); save(true); render(); } }));
    rc.append(field('My ' + label.toLowerCase() + ' rituals', box));
  });
  v.append(rc);

  /* habits, and what they are carrying */
  if (habitsFor().length) {
    const hc2 = E('div', { cls: 'card' });
    hc2.append(E('div', { cls: 'head' }, [E('h2', { text: 'Habits this month' }),
      E('button', { cls: 'btn ghost', text: 'Edit', onclick: () => go('more', 'habits') })]));
    habitsFor().forEach(h => {
      const rate = habitMonthRate(h.id, Y, m);
      const owner = h.p ? projectById(h.p) : (h.g ? S.goals.find(x => x.id === h.g) : null);
      hc2.append(E('div', { style: 'padding:10px 0;border-top:1px solid var(--rule)' }, [
        E('div', { style: 'display:flex;gap:9px;align-items:baseline' }, [
          E('span', { style: `width:9px;height:9px;border-radius:50%;flex:none;background:hsl(${h.hue},62%,50%)` }),
          E('span', { style: 'flex:1;min-width:0;font-size:14.5px', text: h.name || 'Habit' }),

        ]),

        E('div', { cls: 'bar', style: 'margin-left:18px' },
          E('i', { style: `width:${rate.pct}%;background:hsl(${h.hue},62%,48%)` }))
