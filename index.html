<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wiggle layers</title>
<style>
  :root{ --ink:#242118; --hair:rgba(36,33,24,.28); --panel:#E7E3D3; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#DCD8C6;color:var(--ink);
    font:400 12px/1.45 ui-monospace,Menlo,Consolas,monospace;
    -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
  #wrap{display:flex;flex-direction:row;align-items:stretch;height:100vh;overflow:hidden}
  #stage{flex:1;min-width:0;padding:20px;display:flex;align-items:center;justify-content:center}
  canvas{display:block;margin:0 auto;max-width:100%;background:#EFEDE4;
    box-shadow:0 12px 34px rgba(0,0,0,.16);touch-action:manipulation}
  canvas.editing{touch-action:none}
  aside{width:290px;flex:0 0 290px;background:var(--panel);
    border-left:1px solid var(--hair);padding:20px 16px;
    overflow-y:auto;-webkit-overflow-scrolling:touch}
  h1{font-size:12px;font-weight:400;letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px}
  .row{margin:0 0 12px}
  label{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
  label .v{opacity:.55}
  input[type=range]{width:100%;accent-color:var(--ink);display:block;margin:0}
  input[type=number],input[type=text],select{width:100%;font:inherit;padding:5px;
    background:transparent;border:1px solid var(--hair);color:var(--ink);border-radius:0}
  .chk{display:flex;align-items:center;gap:8px;margin:8px 0;cursor:pointer}
  input[type=checkbox]{accent-color:var(--ink);margin:0}
  details{border-top:1px solid var(--hair)}
  summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;align-items:center;gap:8px}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";margin-left:auto;opacity:.5}
  details[open]>summary::after{content:"\2013"}
  details details{border-left:1px solid var(--hair);margin-left:3px;padding-left:10px}
  details details>summary{font-size:11px}
  .sw{width:12px;height:12px;flex:none;border:1px solid rgba(36,33,24,.45)}
  .sw.line{border-radius:50%}
  .tag{font-size:10px;display:none}
  .on>summary .tag{display:inline}
  .off>summary{opacity:.4}
  .bd{padding:2px 0 10px}
  .tog{margin-left:auto;display:flex;gap:4px;flex:none}
  .tog span{width:22px;height:20px;line-height:19px;text-align:center;font-size:10px;
    border:1px solid var(--hair);cursor:pointer;user-select:none;-webkit-user-select:none}
  .tog span.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  summary::after{margin-left:6px}
  .pal{display:flex;gap:6px;margin:0 0 12px}
  .pal button{flex:1;height:26px;padding:0;margin:0;border:1px solid var(--hair)}
  .pal button.sel{outline:2px solid var(--ink);outline-offset:1px}
  .mini{display:flex;gap:6px;margin-top:8px}
  .mini button{margin:0;padding:7px 5px;font-size:11px}
  button{font:inherit;width:100%;padding:9px;margin-bottom:7px;cursor:pointer;
    background:transparent;color:var(--ink);border:1px solid var(--hair);border-radius:0}
  button:disabled{opacity:.3}
  .hint{font-size:11px;opacity:.55;margin:6px 0 0}
  #dump{display:none;width:100%;height:170px;font:inherit;font-size:11px;margin-top:8px;
    background:transparent;border:1px solid var(--hair);color:var(--ink);padding:6px}
  #fault{display:none;position:fixed;left:0;right:0;top:0;z-index:99;padding:12px 14px;
    background:#F5E2DE;border-bottom:1px solid var(--hair);font-size:12px}
  /* fullscreen preview: the controls step aside, the work sits on black */
  body.full{background:#000}
  body.full aside{display:none}
  body.full #wrap{display:block;height:100vh;overflow:hidden}
  body.full #stage{position:fixed;left:0;right:0;top:0;bottom:0;padding:0;
    background:#000;box-shadow:none;z-index:50;
    display:flex;align-items:center;justify-content:center}
  body.full canvas{box-shadow:none}
  #fsTip{display:none;position:fixed;left:0;right:0;bottom:16px;z-index:60;
    text-align:center;color:rgba(255,255,255,.45);font-size:11px;pointer-events:none}
  body.full #fsTip{display:block}
  @media (max-width:820px){
    /* the canvas sits still at the top; only the panel moves */
    #wrap{display:block;height:auto;overflow:visible}
    #stage{padding:0;position:sticky;top:0;z-index:5;background:#DCD8C6;
      box-shadow:0 6px 14px rgba(0,0,0,.10)}
    canvas{box-shadow:none}
    aside{width:auto;border-left:0;border-top:1px solid var(--hair);
      overflow:visible;
      padding-bottom:calc(24px + env(safe-area-inset-bottom))}
    input[type=checkbox]{width:20px;height:20px}
    input[type=range]{height:26px}
    summary{padding:13px 0}
    button{padding:12px}
  }
</style>
</head>
<body>
<div id="fault"></div>
<div id="fsTip">click to exit</div>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="520" height="520"></canvas></div>
  <aside>
    <h1>Wiggle layers</h1>
    <label class="chk"><input type="checkbox" id="pts"> anchors (active wiggle)</label>
    <label class="chk"><input type="checkbox" id="fs"> click canvas for fullscreen</label>
    <div id="panels"></div>
    <button id="addLayer">+ Add layer</button>
    <button id="clearSolo" style="display:none">Clear all solos</button>
    <div style="height:10px"></div>
    <button id="saveProject">Save project</button>
    <label for="loadProject" id="loadProject-l"
      style="display:block;margin-bottom:7px;padding:9px;text-align:center;cursor:pointer;
             border:1px solid var(--hair)">Load project</label>
    <input type="file" id="loadProject" accept=".json,application/json" style="display:none">
    <div style="height:10px"></div>
    <button id="export">Export standalone HTML</button>
    <button id="save">Save PNG</button>
    <label style="display:block;margin-bottom:7px">
      <span style="opacity:.55">PSD long side, px</span>
      <input type="number" id="psdPx" min="200" max="8000" step="100" value="2000">
    </label>
    <button id="psd">Save layered PSD</button>
    <button id="reset">Reset</button>
    <p class="hint" id="note"></p>
    <textarea id="dump" readonly></textarea>
  </aside>
</div>
<script>
/* ------------------------------------------------------------------
   Wiggle layers — a painted gesture as a Catmull-Rom spline.

   No libraries. A Catmull-Rom spline passes THROUGH every anchor and
   takes its direction at each point from that point's neighbours. The
   first and last anchors only steer, so both ends are duplicated to
   push the stroke out to its round caps — the same convention as p5's
   curveVertex(). Each segment converts exactly to a cubic Bezier,
   which is what the canvas actually draws.

   Compositing works like paint on acetate: each layer is drawn into
   its own sheet (ground first, wiggles on top, normal blending), and
   only the finished sheet is composited onto the stack below using
   that layer's blend mode.

   Colour: one hue per layer, brightness pinned at 100, saturation the
   only variable — so marks read by saturation contrast rather than by
   transparency. Ground opacity is the single alpha in the system.
   ------------------------------------------------------------------ */

var BRI = 100;
var MODES = [
  ['source-over','normal (BLEND)'],['multiply','multiply'],['screen','screen'],
  ['overlay','overlay'],['darken','darken'],['lighten','lighten'],
  ['color-burn','color burn'],['color-dodge','color dodge'],
  ['hard-light','hard light'],['soft-light','soft light'],
  ['difference','difference'],['exclusion','exclusion'],
  ['hue','hue'],['saturation','saturation'],['color','color'],['luminosity','luminosity']
];
var DEFAULT_PTS = [[0.26,0.62],[0.50,0.40],[0.74,0.60]];
/* At saturation and brightness 100 each of these hues lands exactly on an
   RGB corner: red 255,0,0 · yellow 255,255,0 · green 0,255,0 ·
   cyan 0,255,255 · blue 0,0,255 · magenta 255,0,255 */
var PALETTE = [['red',0],['yellow',60],['green',120],
               ['cyan',180],['blue',240],['magenta',300]];

/* the traced anchors from the original painting, kept for reference */
var TRACE = {
  switchback:[[0.115,0.090],[0.330,0.125],[0.500,0.200],[0.585,0.285],[0.575,0.362],
    [0.470,0.378],[0.270,0.336],[0.095,0.310],[0.068,0.376],[0.152,0.432],[0.332,0.522],
    [0.480,0.600],[0.562,0.646],[0.600,0.706],[0.545,0.772],[0.400,0.762],[0.232,0.722],
    [0.112,0.742],[0.076,0.822],[0.132,0.902],[0.182,0.975]],
  scurve:[[0.855,0.135],[0.812,0.238],[0.762,0.322],[0.845,0.400],[0.856,0.472],
    [0.735,0.548],[0.680,0.640],[0.665,0.762],[0.740,0.866],[0.880,0.906],[0.932,0.882]]
};

var cmW = 60, cmH = 60, W = 520, H = 520, R = 520, DPR = 1;
var cv, ctx, sheetC, sheet, bufC, buf;
var layers = [], activeId = null, uid = 0, drag = null, t = 0, raf = null, tmr = null;
var spread = 0.35, hueStep = 24, newBlend = 'multiply';
/* Strokes never overlap their neighbours. Always on, and always confined
   to one layer — marks on different layers are meant to cross. */
var sepGap = 6, sepThin = true, sepThinnest = 0.3;
/* The reference is layer 1: the surface everything else is painted onto,
   at full strength beneath the stack. It can be floated above the work
   when you want to trace against your own marks instead. */
var refImg = null, refOpacity = 1, refOnTop = false, refShow = true;
var refBlend = 'source-over';
var lastDoc = null, lastName = 'wiggle.html';
var COARSE = false, HIT = 14, DOT = 8;
var isFull = false, downAt = null, moved = false;
var el = {};

/* ---------- maths ---------- */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,u){ return a+(b-a)*u; }
function hash2(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function noise2(x,y){
  y = y || 0;
  var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  var sx=xf*xf*(3-2*xf), sy=yf*yf*(3-2*yf);
  return lerp(lerp(hash2(xi,yi),hash2(xi+1,yi),sx),
              lerp(hash2(xi,yi+1),hash2(xi+1,yi+1),sx), sy);
}
function hsv(h,s,v){
  h=((h%360)+360)%360; s=s/100; v=v/100;
  var c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c, r=0,g=0,b=0;
  if(h<60){r=c;g=x;} else if(h<120){r=x;g=c;} else if(h<180){g=c;b=x;}
  else if(h<240){g=x;b=c;} else if(h<300){r=x;b=c;} else {r=c;b=x;}
  return 'rgb('+Math.round((r+m)*255)+','+Math.round((g+m)*255)+','+Math.round((b+m)*255)+')';
}
function hex(h,s,v){
  var m=hsv(h,s,v).match(/\d+/g);
  return '#'+[m[0],m[1],m[2]].map(function(n){return (+n).toString(16).padStart(2,'0');}).join('');
}

/* ---------- layout ---------- */
function fit(){
  var box = el.stage.getBoundingClientRect();
  var aw, ah;
  if (isFull) {
    aw = window.innerWidth || 600;
    ah = window.innerHeight || 600;
  } else if (window.innerWidth <= 820) {
    aw = box.width || window.innerWidth;
    ah = Math.max(200, (window.innerHeight || 700) * 0.46);   // pinned: leave room below
  } else {
    aw = (box.width || window.innerWidth) - 40;
    ah = (window.innerHeight || 700) - 40;
  }
  if (!(aw > 0)) aw = 400;
  if (!(ah > 0)) ah = 400;
  var k = Math.min(aw / cmW, ah / cmH);
  W = Math.max(160, Math.round(cmW * k));
  H = Math.max(160, Math.round(cmH * k));
  R = Math.min(W, H);
  DPR = Math.min(2, window.devicePixelRatio || 1);
  [[cv,ctx],[sheetC,sheet],[bufC,buf]].forEach(function(p){
    p[0].width = W*DPR; p[0].height = H*DPR;
    p[0].style.width = W+'px'; p[0].style.height = H+'px';
    p[1].setTransform(DPR,0,0,DPR,0,0);
  });
}
function relayout(){ fit(); render(); }
function onResize(){
  clearTimeout(tmr);
  tmr = setTimeout(function(){
    var a=W,b=H; fit();
    if (Math.abs(W-a)>3 || Math.abs(H-b)>3) render();
  }, 140);
}

/* ---------- state ---------- */
function jitter(pts, amt, seed){
  return pts.map(function(p,i){
    if (!amt) return {x:p.x, y:p.y};
    return { x: p.x + (noise2(seed+i,7)-0.5)*0.09*amt,
             y: p.y + (noise2(seed+i+99,7)-0.5)*0.09*amt };
  });
}
function newWiggle(seed){
  var base = jitter(DEFAULT_PTS.map(function(p){return {x:p[0],y:p[1]};}), spread, seed);
  return { id:++uid, base:base, pts:base.map(function(p){return {x:p.x,y:p.y};}),
    n:base.length, maxN:60, grow:'both', reach:0.08, seedLen:base.length,
    sat:50, w:1, wBase:0.09, tight:0,
    tx:0, ty:0, rot:0, scale:1,
    satDrift:0, satSpeed:1, wDrift:0, wSpeed:1,
    drift:0, speed:1, brush:false, load:0.35, swell:0.25, bite:0.30,
    show:true, open:true };
}
function newLayer(hue, blend){
  var id = ++uid;
  return { id:id, hue:hue, blend:blend||'source-over', mute:false, solo:false, open:true,
    ground:{opacity:0.5, opDrift:0, opSpeed:1, seed:id*13, show:true, open:false},
    wiggles:[] };
}
/* The bottom layer multiplies like every other. On white that reads the
   same as normal, since white is multiply's identity — but over a
   reference photo the difference is the whole point. */
function resetAll(){ uid=0; layers=[newLayer(60,'multiply')]; activeId=null; }
function cloneWiggle(w, amt, seed){
  var base = jitter(w.base, amt, seed);
  var c = {}; for (var k in w) c[k]=w[k];
  c.id=++uid; c.base=base; c.pts=base.map(function(p){return {x:p.x,y:p.y};}); c.open=false;
  return c;
}
/* Solo wins over everything: the moment any layer is soloed, only the
   soloed ones draw. Mute silences a layer whether or not it is soloed,
   the same way a mixer behaves. */
function anySolo(){
  for (var i=0;i<layers.length;i++) if (layers[i].solo) return true;
  return false;
}
function vis(l){
  if (l.mute) return false;
  return anySolo() ? !!l.solo : true;
}

function allW(){ return layers.reduce(function(a,l){return a.concat(l.wiggles);},[]); }
function fixActive(){
  var all=allW();
  if (!all.some(function(w){return w.id===activeId;})) activeId = all.length?all[0].id:null;
}
function activeW(){
  for (var i=0;i<layers.length;i++){
    for (var j=0;j<layers[i].wiggles.length;j++)
      if (layers[i].wiggles[j].id===activeId) return {l:layers[i], w:layers[i].wiggles[j]};
  }
  return null;
}

/* Which slice of the stored path is currently in play. Anchors beyond the
   slider are kept, not discarded, so winding it back and forth is
   non-destructive. */
function span(w){
  var len = w.base.length, n = Math.min(w.n, len);
  if (w.grow === 'start') return len - n;
  if (w.grow === 'both')  return Math.floor((len - n) / 2);
  return 0;
}

/* Extend the path by continuing its own direction, turned by a little
   noise so it wanders instead of shooting off in a straight line. The
   new point steers back inside if it strays past the edge. */
function growOne(pts, atEnd, reach){
  var b = atEnd ? pts[pts.length-1] : pts[0];
  var a = atEnd ? pts[pts.length-2] : pts[1];
  if (!a) a = { x: b.x - 0.08, y: b.y - 0.04 };
  var dx = b.x - a.x, dy = b.y - a.y;
  /* a set reach rather than the last segment's length, so a new anchor
     lands just beyond the tip instead of a third of the way across */
  var step = reach || 0.08;
  var ang = Math.atan2(dy, dx) +
            (noise2(pts.length * 3.7 + (atEnd ? 0 : 91), 5) - 0.5) * 1.5;
  var nx = b.x + Math.cos(ang) * step;
  var ny = b.y + Math.sin(ang) * step;
  /* if it has wandered outside, aim the next step back toward the middle */
  if (nx < 0.02 || nx > 0.98 || ny < 0.02 || ny > 0.98){
    var back = Math.atan2(0.5 - b.y, 0.5 - b.x);
    nx = b.x + Math.cos(back) * step;
    ny = b.y + Math.sin(back) * step;
  }
  return { x: clamp(nx, 0.02, 0.98), y: clamp(ny, 0.02, 0.98) };
}
function growTo(w, n){
  var reach = w.reach || 0.08;
  var seed = w.seedLen || w.base.length;
  while (w.base.length < n){
    /* Parity comes from how far the path has grown past its original
       length, not from a counter local to this call — the slider adds one
       anchor per call, so a local counter always said "first". */
    var idx = w.base.length - seed;
    if (w.grow === 'start') w.base.unshift(growOne(w.base, false, reach));
    else if (w.grow === 'both'){
      if (idx % 2) w.base.unshift(growOne(w.base, false, reach));
      else w.base.push(growOne(w.base, true, reach));
    }
    else w.base.push(growOne(w.base, true, reach));
  }
}

/* Set the anchor count: grow the path from its ends, or redistribute the
   points along the shape you already have. */
function setAnchors(w, n){
  w.n = n;
  if (w.grow === 'resample'){
    w.pts = resample(w.base, n);
    return;
  }
  growTo(w, n);
  var from = span(w);
  w.pts = w.base.slice(from, from + n).map(function(p){ return {x:p.x, y:p.y}; });
}

/* Resample along the spline's own arc length, measured in pixels so it
   stays correct on a non-square canvas. */
function resample(base, n){
  var pad=[base[0]].concat(base,[base[base.length-1]]);
  var dense=[], acc=[], len=0, i, k, q, p;
  for (i=0;i<pad.length-3;i++){
    for (k=(i===0?0:1);k<=30;k++){
      q = catmull(pad[i],pad[i+1],pad[i+2],pad[i+3],k/30,0);
      if (dense.length){ p=dense[dense.length-1];
        len += Math.sqrt(Math.pow((q.x-p.x)*W,2)+Math.pow((q.y-p.y)*H,2)); }
      dense.push(q); acc.push(len);
    }
  }
  var out=[], j=0;
  for (i=0;i<n;i++){
    var target = len*i/(n-1);
    while (j<acc.length-2 && acc[j+1]<target) j++;
    var span = acc[j+1]-acc[j];
    var u = span>0 ? (target-acc[j])/span : 0;
    out.push({x:lerp(dense[j].x,dense[j+1].x,u), y:lerp(dense[j].y,dense[j+1].y,u)});
  }
  return out;
}

/* ---------- the curve ---------- */
function catmull(p0,p1,p2,p3,u,s){
  var f=(1-s)/2;
  var m1x=f*(p2.x-p0.x), m1y=f*(p2.y-p0.y), m2x=f*(p3.x-p1.x), m2y=f*(p3.y-p1.y);
  var u2=u*u, u3=u2*u;
  var h00=2*u3-3*u2+1, h10=u3-2*u2+u, h01=-2*u3+3*u2, h11=u3-u2;
  return { x:h00*p1.x+h10*m1x+h01*p2.x+h11*m2x, y:h00*p1.y+h10*m1y+h01*p2.y+h11*m2y };
}
/* Catmull-Rom to cubic Bezier, one segment per pair of anchors. */
function tracePath(x, pts, s){
  var pad=[pts[0]].concat(pts,[pts[pts.length-1]]), f=(1-s)/2;
  x.beginPath();
  x.moveTo(pad[1].x*W, pad[1].y*H);
  for (var i=0;i<pad.length-3;i++){
    var p0=pad[i],p1=pad[i+1],p2=pad[i+2],p3=pad[i+3];
    x.bezierCurveTo(
      (p1.x+f*(p2.x-p0.x)/3)*W, (p1.y+f*(p2.y-p0.y)/3)*H,
      (p2.x-f*(p3.x-p1.x)/3)*W, (p2.y-f*(p3.y-p1.y)/3)*H,
      p2.x*W, p2.y*H);
  }
}
/* Place, turn and size a wiggle without touching its anchors. The maths
   runs in pixels so a rotation stays square on a non-square canvas, and
   it pivots on the wiggle's own centre rather than the canvas corner. */
function centre(w){
  var sx=0, sy=0;
  for (var i=0;i<w.pts.length;i++){ sx+=w.pts[i].x; sy+=w.pts[i].y; }
  return { x:sx/w.pts.length, y:sy/w.pts.length };
}
function place(p,w,c){
  if (!w.rot && w.scale===1 && !w.tx && !w.ty) return p;
  var px=(p.x-c.x)*W, py=(p.y-c.y)*H;
  var a=w.rot*Math.PI/180, cs=Math.cos(a), sn=Math.sin(a), k=w.scale;
  return { x: c.x + (px*cs-py*sn)*k/W + w.tx,
           y: c.y + (px*sn+py*cs)*k/H + w.ty };
}
function unplace(p,w,c){
  var dx=(p.x-c.x-w.tx)*W, dy=(p.y-c.y-w.ty)*H;
  var k=w.scale||1, u=dx/k, v=dy/k;
  var a=w.rot*Math.PI/180, cs=Math.cos(a), sn=Math.sin(a);
  return { x: c.x + (u*cs+v*sn)/W, y: c.y + (-u*sn+v*cs)/H };
}
/* Hold an anchor inside the picture. The stroke's own half-width is
   allowed for, so a fat mark stops further in than a thin one and no
   part of it runs off the edge. */
function reinIn(p, w){
  var r = strokeRadius(w);
  var mx = Math.min(r / W, 0.45), my = Math.min(r / H, 0.45);
  return { x: clamp(p.x, mx, 1 - mx), y: clamp(p.y, my, 1 - my) };
}

/* what the wiggle looks like on screen: drift, transform, then reined in */
function viewPts(w){
  var c=centre(w);
  return w.pts.map(function(p,i){ return reinIn(place(shift(p,i,w),w,c), w); });
}

/* Colour that breathes. Saturation and ground opacity wander on the same
   clock as the anchors, so a layer can pulse between washed-out and full
   without the drawing itself moving. */
function effSat(w){
  if (!w.satDrift) return w.sat;
  var n = noise2(w.id*53+7, t*(w.satSpeed||1));
  return clamp(w.sat + (n-0.5)*200*w.satDrift, 0, 100);
}
/* weight drifts as a multiplier, so a thin mark stays thin in proportion */
function effW(w){
  if (!w.wDrift) return w.w;
  var n = noise2(w.id*97+19, t*(w.wSpeed||1));
  return Math.max(0.01, w.w * (1 + (n-0.5)*2*w.wDrift));
}
function effOp(g){
  if (!g.opDrift) return g.opacity;
  var n = noise2((g.seed||11)+31, t*(g.opSpeed||1));
  return clamp(g.opacity + (n-0.5)*2*g.opDrift, 0, 1);
}

function shift(pt,i,w){
  if (!w.drift) return pt;
  var s=w.id*37, u=t*(w.speed||1);
  return { x: pt.x+(noise2(s+i,u)-0.5)*0.22*w.drift,
           y: pt.y+(noise2(s+i+99,u)-0.5)*0.22*w.drift };
}

/* ---------- keeping wiggles off each other ----------
   A relaxation pass, run at draw time so it holds while things drift.
   Each anchor is compared against the other wiggles' actual curves — not
   just their anchors — and pushed out along the shortest line between
   them until the two strokes clear each other by the layer's gap. A few
   passes settle it; the stored path is never touched, so this constrains
   what you see without editing what you drew. */
function strokeRadius(w){
  return w.wBase * R * effW(w) * w.scale / 2;
}
function polyline(pts, tight){
  var pad=[pts[0]].concat(pts,[pts[pts.length-1]]), out=[], i, k;
  for (i=0;i<pad.length-3;i++)
    for (k=(i===0?0:1); k<=8; k++){
      var q=catmull(pad[i],pad[i+1],pad[i+2],pad[i+3],k/8,tight);
      out.push({ x:q.x*W, y:q.y*H });
    }
  return out;
}
/* shortest distance from a point to a segment, and the direction away */
function pushOff(px, py, a, b){
  var vx=b.x-a.x, vy=b.y-a.y;
  var L=vx*vx+vy*vy;
  var t = L>0 ? ((px-a.x)*vx + (py-a.y)*vy)/L : 0;
  t = t<0?0:(t>1?1:t);
  var cx=a.x+vx*t, cy=a.y+vy*t;
  var dx=px-cx, dy=py-cy;
  var d=Math.sqrt(dx*dx+dy*dy);
  if (d > 1e-6) return { d:d, nx:dx/d, ny:dy/d };
  /* Sitting exactly on the other curve there is no direction to push, so
     step off sideways along the segment's normal. Callers flip the sign
     per pair, or two coincident strokes would shove the same way and
     never part. */
  var len = Math.sqrt(L) || 1;
  return { d:0, nx:-vy/len, ny:vx/len };
}
function keepApart(items, gap, thin, thinnest){
  var passes=4, p, i, j, k, m;
  /* wid[i][k] is how wide anchor k of wiggle i is allowed to be, as a
     fraction of its set weight — 1 means untouched */
  for (i=0;i<items.length;i++) items[i].squeeze = 1;
  var floor = thin ? clamp(thinnest, 0.05, 1) : 1;

  for (p=0;p<passes;p++){
    var lines=[];
    for (i=0;i<items.length;i++) lines.push(polyline(items[i].pts, items[i].w.tight));
    var moved=false;
    for (i=0;i<items.length;i++){
      for (k=0;k<items[i].pts.length;k++){
        var ax=items[i].pts[k].x*W, ay=items[i].pts[k].y*H;
        var ri = strokeRadius(items[i].w) * items[i].squeeze;
        for (j=0;j<items.length;j++){
          if (j===i) continue;
          var need = ri + strokeRadius(items[j].w) * items[j].squeeze + gap;
          var line = lines[j];
          var best=null;
          for (m=1;m<line.length;m++){
            var hit = pushOff(ax, ay, line[m-1], line[m]);
            if (!best || hit.d < best.d) best = hit;
          }
          if (best && best.d < need){
            var short = need - best.d;
            /* Width yields first, up to the floor. It costs nothing to
               move and resolves crowding the position pass alone cannot,
               then the rest is taken up by shifting the anchor. */
            var give = 0;
            if (floor < 1){
              var lowest = strokeRadius(items[i].w) * floor;
              var room = ri - lowest;
              give = Math.min(room, short * 0.6);
              if (give > 0){
                ri -= give;
                /* one width for the whole stroke: the tightest spot sets it,
                   so a wiggle stays an even thickness end to end */
                var scale = ri / strokeRadius(items[i].w);
                if (scale < items[i].squeeze) items[i].squeeze = scale;
                short -= give;
                moved = true;
              }
            }
            if (short > 0){
              var shove = short * 0.5;
              var sign = best.d > 1e-6 ? 1 : (i < j ? 1 : -1);
              ax += best.nx * shove * sign;
              ay += best.ny * shove * sign;
              moved = true;
            }
          }
        }
        items[i].pts[k] = reinIn({ x: ax/W, y: ay/H }, items[i].w);
      }
    }
    if (!moved) break;
  }
  return items;
}

/* ---------- drawing ---------- */
function render(){
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,W,H);
  if (refImg && refShow && !refOnTop) drawRef();

  for (var i=0;i<layers.length;i++){
    var l=layers[i];
    if (!vis(l)) continue;
    sheet.globalCompositeOperation='source-over';
    sheet.globalAlpha=1;
    sheet.clearRect(0,0,W,H);
    if (l.ground.show){
      sheet.globalAlpha=effOp(l.ground);
      sheet.fillStyle=hsv(l.hue,100,BRI);
      sheet.fillRect(0,0,W,H);
      sheet.globalAlpha=1;
    }
    var items=[];
    for (var j=0;j<l.wiggles.length;j++){
      if (!l.wiggles[j].show) continue;
      items.push({ w:l.wiggles[j], pts:viewPts(l.wiggles[j]) });
    }
    if (items.length > 1) keepApart(items, sepGap, sepThin, sepThinnest);
    for (j=0;j<items.length;j++){
      if (items[j].w.brush) brushStroke(items[j].pts, items[j].w, l.hue, items[j].squeeze);
      else lineStroke(items[j].pts, items[j].w, l.hue, items[j].squeeze);
    }
    ctx.globalCompositeOperation=l.blend;
    ctx.drawImage(sheetC,0,0,W,H);
  }
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
  if (refImg && refShow && refOnTop) drawRef();
  if (el.pts.checked) drawAnchors();
}
function drawRef(){
  var k=Math.min(W/refImg.width, H/refImg.height);
  var dw=refImg.width*k, dh=refImg.height*k;
  ctx.globalAlpha=refOpacity;
  ctx.globalCompositeOperation=refBlend;
  ctx.drawImage(refImg,(W-dw)/2,(H-dh)/2,dw,dh);
  ctx.globalCompositeOperation='source-over';
  ctx.globalAlpha=1;
}
function lineStroke(pts,w,hue,squeeze){
  sheet.strokeStyle=hsv(hue,effSat(w),BRI);
  sheet.lineWidth=w.wBase*R*effW(w)*w.scale*(squeeze==null?1:squeeze);
  sheet.lineCap='round'; sheet.lineJoin='round';
  tracePath(sheet,pts,w.tight);
  sheet.stroke();
}
/* Stamped at varying width: load runs the brush dry along its length,
   swell thickens and thins it irregularly, bite narrows the mark where
   the curve turns hardest — the way a brush does through a corner. */
function brushStroke(pts,w,hue,squeeze){
  var pad=[pts[0]].concat(pts,[pts[pts.length-1]]);
  var base=w.wBase*R*effW(w)*w.scale*(squeeze==null?1:squeeze);
  var segs=pad.length-3, steps=40, i, k;
  var s=[];
  for (i=0;i<segs;i++)
    for (k=(i===0?0:1);k<=steps;k++)
      s.push(catmull(pad[i],pad[i+1],pad[i+2],pad[i+3],k/steps,w.tight));
  var n=s.length, curv=[];
  for (i=0;i<n;i++){
    if (i===0||i===n-1){ curv.push(0); continue; }
    var a=s[i-1], b=s[i+1], q=s[i];
    var v1x=(q.x-a.x)*W/R, v1y=(q.y-a.y)*H/R, v2x=(b.x-q.x)*W/R, v2y=(b.y-q.y)*H/R;
    var l1=Math.sqrt(v1x*v1x+v1y*v1y), l2=Math.sqrt(v2x*v2x+v2y*v2y);
    if (l1<1e-9||l2<1e-9){ curv.push(0); continue; }
    var cr=(v1x*v2y-v1y*v2x)/(l1*l2), dt=(v1x*v2x+v1y*v2y)/(l1*l2);
    curv.push(Math.abs(Math.atan2(cr,dt))/((l1+l2)/2));
  }
  buf.globalCompositeOperation='source-over';
  buf.globalAlpha=1;
  buf.clearRect(0,0,W,H);
  buf.fillStyle=hsv(hue,effSat(w),BRI);
  for (i=0;i<n;i++){
    var g=i/(n-1);
    var load=1+w.load*(0.5-g)*1.6;
    var sw=1+w.swell*(noise2(w.id*11+g*7)-0.5)*2.4;
    var bite=1-w.bite*Math.min(1,curv[i]/24);
    var d=base*Math.max(0.04, load*sw*bite);
    buf.beginPath();
    buf.arc(s[i].x*W, s[i].y*H, d/2, 0, Math.PI*2);
    buf.fill();
  }
  sheet.drawImage(bufC,0,0,W,H);
}
function drawAnchors(){
  var a=activeW();
  if (!a) return;
  var w=a.w, v=viewPts(w), i;
  ctx.strokeStyle='rgba(30,28,20,.35)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for (i=0;i<v.length;i++){
    if (i) ctx.lineTo(v[i].x*W, v[i].y*H);
    else ctx.moveTo(v[i].x*W, v[i].y*H);
  }
  ctx.stroke();
  for (i=0;i<v.length;i++){
    var hot = drag && drag.i===i;
    ctx.fillStyle = hot ? '#1e1c14' : hsv(a.l.hue, w.sat, 100);
    ctx.strokeStyle='#1e1c14';
    ctx.beginPath();
    ctx.arc(v[i].x*W, v[i].y*H, (hot?DOT*1.35:DOT)/2, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
  }
}
function moving(){
  return layers.some(function(l){
    if (!vis(l)) return false;
    if (l.ground.show && l.ground.opDrift>0) return true;
    return l.wiggles.some(function(w){
      return w.show && (w.drift>0 || w.satDrift>0 || w.wDrift>0);
    });
  });
}
function tick(){ t+=0.012; render(); raf=requestAnimationFrame(tick); }
function refresh(){
  if (el.clearSolo) el.clearSolo.style.display = anySolo() ? 'block' : 'none';
  queueSave();
  var ds=document.querySelectorAll('#panels details');
  for (var i=0;i<ds.length;i++) if (ds[i]._paint) ds[i]._paint();
  if (moving()){ if(!raf) raf=requestAnimationFrame(tick); }
  else { if(raf){ cancelAnimationFrame(raf); raf=null; } render(); }
}

/* ---------- editing ---------- */
function pos(e){
  var r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) };
}
/* Fullscreen preview inside the editor: the panel steps aside and the
   work sits centred on black. Only offered when the switch is ticked, and
   only on a click that isn't a drag, so anchor editing still works. */
function setFull(v){
  isFull = v;
  document.body.className = v ? 'full' : '';
  try {
    var d = document.documentElement;
    if (v) {
      if (d.requestFullscreen) d.requestFullscreen();
      else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
    } else if (document.fullscreenElement || document.webkitFullscreenElement) {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch (err) {}
  fit(); render();
}

function onDown(e){
  downAt = { x:e.clientX, y:e.clientY };
  moved = false;
  if (!el.pts.checked) return;
  var a=activeW(); if(!a) return;
  var p=pos(e), v=viewPts(a.w), best=null, bd=HIT*HIT;
  for (var i=0;i<v.length;i++){
    var dx=v[i].x*W-p.x, dy=v[i].y*H-p.y, d2=dx*dx+dy*dy;
    if (d2<bd){ bd=d2; best={w:a.w,i:i}; }
  }
  if (!best) return;
  drag=best;
  if (cv.setPointerCapture) try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
  render();
}
function onMove(e){
  if (downAt && !moved) {
    if (Math.abs(e.clientX-downAt.x) > 6 || Math.abs(e.clientY-downAt.y) > 6) moved = true;
  }
  if (!drag) return;
  var p=pos(e), w=drag.w;
  /* the pointer is in view space; put it back through the transform so
     the anchor itself is stored untransformed */
  var q=unplace({x:p.x/W, y:p.y/H}, w, centre(w));
  w.pts[drag.i].x = clamp(q.x,-0.5,1.5);
  w.pts[drag.i].y = clamp(q.y,-0.5,1.5);
  e.preventDefault();
  render();
}
function onUp(){
  var wasDrag = !!drag;
  if (drag) {
    var w = drag.w;
    if (w.grow === 'resample'){
      w.base = w.pts.map(function(p){ return {x:p.x, y:p.y}; });
    } else {
      /* write the moved anchors back into their place in the stored path,
         leaving anchors outside the current slice untouched */
      var from = span(w);
      for (var i=0;i<w.pts.length;i++)
        w.base[from+i] = { x:w.pts[i].x, y:w.pts[i].y };
    }
    drag = null;
    render();
    queueSave();
  }
  /* a clean click — no anchor grabbed, no movement — toggles the preview */
  if (!wasDrag && !moved && el.fs && el.fs.checked) setFull(!isFull);
  downAt = null; moved = false;
}

/* ---------- control builders ---------- */
function slider(host,label,min,max,step,val,fmt,fn){
  var row=document.createElement('div'); row.className='row';
  var lab=document.createElement('label');
  lab.appendChild(document.createTextNode(label));
  var v=document.createElement('span'); v.className='v';
  lab.appendChild(v);
  var inp=document.createElement('input');
  inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
  function show(){ v.textContent=fmt(+inp.value); }
  inp.addEventListener('input', function(){ show(); fn(+inp.value); });
  row.appendChild(lab); row.appendChild(inp); host.appendChild(row);
  show();
  return inp;
}
function check(host,label,val,fn){
  var lab=document.createElement('label'); lab.className='chk';
  var box=document.createElement('input'); box.type='checkbox'; box.checked=val;
  box.addEventListener('change', function(){ fn(box.checked); });
  lab.appendChild(box); lab.appendChild(document.createTextNode(label));
  host.appendChild(lab);
  return box;
}
function picker(host,label,opts,val,fn){
  var row=document.createElement('div'); row.className='row';
  var lab=document.createElement('label');
  lab.appendChild(document.createTextNode(label));
  var sel=document.createElement('select');
  opts.forEach(function(o){
    var op=document.createElement('option'); op.value=o[0]; op.textContent=o[1];
    sel.appendChild(op);
  });
  sel.value=val;
  sel.addEventListener('change', function(){ fn(sel.value); });
  row.appendChild(lab); row.appendChild(sel); host.appendChild(row);
  return sel;
}
function num(host,label,val,min,max,fn){
  var row=document.createElement('div'); row.className='row';
  var lab=document.createElement('label');
  lab.appendChild(document.createTextNode(label));
  var inp=document.createElement('input');
  inp.type='number'; inp.min=min; inp.max=max; inp.step=1; inp.value=val;
  inp.addEventListener('change', function(){ fn(clamp(Math.round(+inp.value)||val,min,max), inp); });
  row.appendChild(lab); row.appendChild(inp); host.appendChild(row);
  return inp;
}
function palette(host, get, set){
  var row=document.createElement('div'); row.className='pal';
  var made=[];
  PALETTE.forEach(function(c){
    var b=document.createElement('button');
    b.type='button';
    b.title=c[0];
    b.setAttribute('aria-label',c[0]);
    b.style.background=hex(c[1],100,BRI);
    b.addEventListener('click', function(){ set(c[1]); mark(); });
    row.appendChild(b);
    made.push([b,c[1]]);
  });
  function mark(){
    var h=get();
    made.forEach(function(m){ m[0].className = (m[1]===h) ? 'sel' : ''; });
  }
  mark();
  host.appendChild(row);
  return mark;
}
function btn(host,label,fn,dis){
  var b=document.createElement('button');
  b.textContent=label;
  b.addEventListener('click',fn);
  if (dis) b.disabled=true;
  host.appendChild(b);
  return b;
}
function section(host,title,colFn,open,o){
  o=o||{};
  var d=document.createElement('details'); d.open=!!open;
  var s=document.createElement('summary');
  var sw=document.createElement('span');
  sw.className='sw'+(o.round?' line':'');
  s.appendChild(sw);
  s.appendChild(document.createTextNode(title));
  if (o.tag){
    var tg=document.createElement('span'); tg.className='tag'; tg.textContent='editing';
    s.appendChild(tg);
  }
  var toggles=[];
  if (o.toggles && o.toggles.length){
    var bar=document.createElement('span'); bar.className='tog';
    o.toggles.forEach(function(tt){
      var el2=document.createElement('span');
      el2.textContent=tt.label;
      el2.title=tt.title||tt.label;
      /* the summary would otherwise open the panel underneath the tap */
      el2.addEventListener('click', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        tt.onClick();
      });
      bar.appendChild(el2);
      toggles.push([el2, tt]);
    });
    s.appendChild(bar);
  }
  d.addEventListener('toggle', function(){ if (o.onToggle) o.onToggle(d.open); });
  if (o.onPick) s.addEventListener('click', function(){ o.onPick(); refresh(); });
  var body=document.createElement('div'); body.className='bd';
  d.appendChild(s); d.appendChild(body); host.appendChild(d);
  d._paint=function(){
    sw.style.background=colFn();
    /* rebuild the class list every time — appending to it meant a panel
       once dimmed stayed dimmed, and the string grew without bound */
    var cls = [];
    if (o.isOn && o.isOn()) cls.push('on');
    if (o.isOff && o.isOff()) cls.push('off');
    d.className = cls.join(' ');
    toggles.forEach(function(t){ t[0].className = t[1].active() ? 'on' : ''; });
  };
  return body;
}

/* ---------- panels ---------- */
function build(){
  var host=el.panels;
  host.innerHTML='';

  /* canvas + reference */
  var cb=section(host,'Canvas & reference',function(){return '#EFEDE4';},false);
  num(cb,'width cm',cmW,1,2000,function(v){ cmW=v; relayout(); });
  num(cb,'height cm',cmH,1,2000,function(v){ cmH=v; relayout(); });
  btn(cb,'Swap orientation',function(){ var a=cmW; cmW=cmH; cmH=a; build(); relayout(); });
  var ti=document.createElement('input');
  ti.type='text'; ti.id='title'; ti.value=el.titleValue||'Wiggle';
  ti.addEventListener('input',function(){ el.titleValue=ti.value; });
  var tl=document.createElement('label'); tl.appendChild(document.createTextNode('title'));
  var tr=document.createElement('div'); tr.className='row';
  tr.appendChild(tl); tr.appendChild(ti); cb.appendChild(tr);

  /* --- Layer 1: the reference --- */
  var rb=section(host,'Layer 1 \u00B7 Reference',
    function(){ return refImg ? '#7A736A' : '#EFEDE4'; }, !refImg, {
      isOff:function(){ return !!refImg && !refShow; }
    });

  var fl=document.createElement('input'); fl.type='file'; fl.accept='image/*';
  fl.addEventListener('change',function(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    var fr=new FileReader();
    fr.onload=function(){
      var im=new Image();
      im.onload=function(){ refImg=im; refShow=true; build(); render(); };
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
  var fh=document.createElement('p'); fh.className='hint';
  fh.textContent = refImg ? 'replace the image' : 'choose an image';
  rb.appendChild(fh); rb.appendChild(fl);
  if (refImg){
    slider(rb,'opacity',0,1,0.01,refOpacity,function(v){return v.toFixed(2);},
      function(v){ refOpacity=v; render(); });
    picker(rb,'blend',MODES,refBlend,function(v){ refBlend=v; render(); });
    check(rb,'visible',refShow,function(v){ refShow=v; render(); });
    check(rb,'float above all layers',refOnTop,function(v){ refOnTop=v; render(); });
    var rh=document.createElement('p'); rh.className='hint';
    rh.textContent='The base everything else is painted onto. Float it above '+
      'the work when you want to trace against your own marks.';
    rb.appendChild(rh);
    var m=document.createElement('div'); m.className='mini'; rb.appendChild(m);
    btn(m,'Use its shape',function(){
      var k=100/Math.max(refImg.width,refImg.height);
      cmW=Math.round(refImg.width*k*10)/10;
      cmH=Math.round(refImg.height*k*10)/10;
      build(); relayout();
    });
    btn(m,'Remove',function(){ refImg=null; build(); render(); });
  } else {
    var eh=document.createElement('p'); eh.className='hint';
    eh.textContent='No reference loaded. Without one the layers below sit on white.';
    rb.appendChild(eh);
  }

  /* defaults for new things */
  var nb=section(host,'New layers & wiggles',function(){return hex(hueStep%360,80,BRI);},false);
  slider(nb,'anchor spread',0,1,0.01,spread,function(v){return v.toFixed(2);},function(v){spread=v;});
  slider(nb,'hue step',0,180,1,hueStep,function(v){return v.toFixed(0)+'\u00B0';},
    function(v){ hueStep=v; refresh(); });
  picker(nb,'blend mode',MODES,newBlend,function(v){ newBlend=v; });

  var sb=section(host,'Stroke spacing',function(){return '#EFEDE4';},false);
  slider(sb,'gap between strokes, px',0,40,1,sepGap,
    function(v){return v.toFixed(0)+'px';}, function(v){ sepGap=v; refresh(); });
  check(sb,'let strokes thin to fit',sepThin,function(v){ sepThin=v; refresh(); });
  slider(sb,'thinnest allowed',0.05,1,0.01,sepThinnest,
    function(v){return Math.round(v*100)+'%';}, function(v){ sepThinnest=v; refresh(); });
  var sh=document.createElement('p'); sh.className='hint';

function moveL(l,d){
  var i=layers.indexOf(l), j=i+d;
  if (j<0||j>=layers.length) return;
  layers.splice(i,1); layers.splice(j,0,l); build(); refresh();
}
/* Send a wiggle to another layer. Hue belongs to the layer, so the mark
   takes on its new layer's colour automatically — only its saturation,
   weight and shape travel with it. */
function moveToLayer(from, w, to){
  if (from === to) return;
  var i = from.wiggles.indexOf(w);
  if (i < 0) return;
  from.wiggles.splice(i, 1);
  to.wiggles.push(w);
  to.open = true;
  activeId = w.id;
  build(); refresh();
}

function moveW(l,w,d){
  var i=l.wiggles.indexOf(w), j=i+d;
  if (j<0||j>=l.wiggles.length) return;
  l.wiggles.splice(i,1); l.wiggles.splice(j,0,w); build(); refresh();
}

/* ------------------------------------------------------------------
   PSD export — one Photoshop layer per wiggle-layer, blend modes kept.

   The format: a 26-byte header, two empty sections, then the layer
   block (per-layer rectangle, channel table, blend key, name), then
   every channel's pixels, then a flattened composite that Photoshop
   uses as its preview. Channels are planar and separate: A, R, G, B.
   Everything is big-endian. Rows are PackBits-compressed, which is
   what keeps a six-layer file in the tens of megabytes rather than
   hundreds.
   ------------------------------------------------------------------ */

/* canvas composite operation -> Photoshop's four-character blend key */
var PSD_BLEND = {
  'source-over':'norm', 'multiply':'mul ', 'screen':'scrn', 'overlay':'over',
  'darken':'dark', 'lighten':'lite', 'color-burn':'idiv', 'color-dodge':'div ',
  'hard-light':'hLit', 'soft-light':'sLit', 'difference':'diff', 'exclusion':'smud',
  'hue':'hue ', 'saturation':'sat ', 'color':'colr', 'luminosity':'lum '
};

function Bytes(){ this.b = new Uint8Array(1 << 18); this.n = 0; }
Bytes.prototype.need = function(k){
  if (this.n + k <= this.b.length) return;
  var cap = this.b.length;
  while (cap < this.n + k) cap *= 2;
  var next = new Uint8Array(cap);
  next.set(this.b.subarray(0, this.n));
  this.b = next;
};
Bytes.prototype.u8  = function(v){ this.need(1); this.b[this.n++] = v & 255; };
Bytes.prototype.u16 = function(v){ this.need(2); this.b[this.n++] = (v>>8)&255; this.b[this.n++] = v&255; };
Bytes.prototype.u32 = function(v){ this.need(4);
  this.b[this.n++] = (v>>>24)&255; this.b[this.n++] = (v>>>16)&255;
  this.b[this.n++] = (v>>>8)&255;  this.b[this.n++] = v&255; };
Bytes.prototype.str = function(s){ for (var i=0;i<s.length;i++) this.u8(s.charCodeAt(i)); };
Bytes.prototype.raw = function(arr){ this.need(arr.length); this.b.set(arr, this.n); this.n += arr.length; };
Bytes.prototype.at32 = function(pos, v){
  this.b[pos] = (v>>>24)&255; this.b[pos+1] = (v>>>16)&255;
  this.b[pos+2] = (v>>>8)&255; this.b[pos+3] = v&255; };
Bytes.prototype.done = function(){ return this.b.subarray(0, this.n); };

/* PackBits one scanline into the writer; returns the byte count written */
function packRow(out, src, off, len){
  var start = out.n, i = 0;
  while (i < len){
    if (i+1 < len && src[off+i] === src[off+i+1]){
      var run = 2;
      while (i+run < len && src[off+i+run] === src[off+i] && run < 128) run++;
      out.u8(257 - run);
      out.u8(src[off+i]);
      i += run;
    } else {
      var lit = 1, from = i;
      i++;
      while (i < len && lit < 128){
        if (i+1 < len && src[off+i] === src[off+i+1]) break;
        i++; lit++;
      }
      out.u8(lit - 1);
      for (var k=0;k<lit;k++) out.u8(src[off+from+k]);
    }
  }
  return out.n - start;
}

/* one channel of an RGBA buffer, PackBits-compressed with its row table */
function writeChannel(rgba, w, h, offset, out){
  var row = new Uint8Array(w);
  var counts = [], y, x;
  var body = new Bytes();
  for (y=0;y<h;y++){
    for (x=0;x<w;x++) row[x] = rgba[(y*w + x)*4 + offset];
    counts.push(packRow(body, row, 0, w));
  }
  out.u16(1);                              /* 1 = PackBits */
  for (y=0;y<h;y++) out.u16(counts[y]);
  out.raw(body.done());
}
function channelBytes(rgba, w, h, offset){
  var tmp = new Bytes();
  writeChannel(rgba, w, h, offset, tmp);
  return tmp.done();
}

function pascalPad4(out, name){
  var s = name.substring(0, 255);
  var total = 1 + s.length;
  out.u8(s.length);
  out.str(s);
  while (total % 4){ out.u8(0); total++; }
}

function buildPSD(w, h, sheets, merged){
  var out = new Bytes(), i;

  /* header */
  out.str('8BPS'); out.u16(1);
  for (i=0;i<6;i++) out.u8(0);
  out.u16(3);                              /* channels in the composite */
  out.u32(h); out.u32(w);
  out.u16(8); out.u16(3);                  /* 8-bit, RGB */
  out.u32(0);                              /* colour mode data */
  out.u32(0);                              /* image resources */

  /* pre-compress every layer channel so the channel table can state sizes */
  var packed = sheets.map(function(s){
    return { a: channelBytes(s.rgba, w, h, 3), r: channelBytes(s.rgba, w, h, 0),
             g: channelBytes(s.rgba, w, h, 1), b: channelBytes(s.rgba, w, h, 2),
             name: s.name, blend: s.blend, show: s.show };
  });

  var maskLenPos = out.n; out.u32(0);      /* layer + mask section length */
  var infoLenPos = out.n; out.u32(0);      /* layer info length */
  out.u16(sheets.length);

  packed.forEach(function(p){
    out.u32(0); out.u32(0); out.u32(h); out.u32(w);   /* top left bottom right */
    out.u16(4);
    out.u16(0xFFFF); out.u32(p.a.length);             /* -1 = alpha */
    out.u16(0);      out.u32(p.r.length);
    out.u16(1);      out.u32(p.g.length);
    out.u16(2);      out.u32(p.b.length);
    out.str('8BIM');
    out.str(PSD_BLEND[p.blend] || 'norm');
    out.u8(255);                                      /* opacity */
    out.u8(0);                                        /* not clipped */
    out.u8(p.show ? 0 : 2);                           /* bit 1 = hidden */
    out.u8(0);
    var extraPos = out.n; out.u32(0);
    out.u32(0);                                       /* no layer mask */
    out.u32(0);                                       /* no blending ranges */
    pascalPad4(out, p.name);
    out.at32(extraPos, out.n - extraPos - 4);
  });

  packed.forEach(function(p){
    out.raw(p.a); out.raw(p.r); out.raw(p.g); out.raw(p.b);
  });

  if ((out.n - infoLenPos - 4) % 2) out.u8(0);        /* layer info stays even */
  out.at32(infoLenPos, out.n - infoLenPos - 4);
  out.u32(0);                                         /* global layer mask */
  out.at32(maskLenPos, out.n - maskLenPos - 4);

  /* Flattened composite. Unlike a layer, this section carries a single
     compression flag, then every channel's row table back to back, then
     all the pixel data. */
  var row = new Uint8Array(w);
  var bodies = [], tables = [], ch, y, x;
  for (ch=0; ch<3; ch++){
    var body = new Bytes(), counts = [];
    for (y=0;y<h;y++){
      for (x=0;x<w;x++) row[x] = merged[(y*w + x)*4 + ch];
      counts.push(packRow(body, row, 0, w));
    }
    bodies.push(body.done());
    tables.push(counts);
  }
  out.u16(1);
  for (ch=0; ch<3; ch++)
    for (y=0;y<h;y++) out.u16(tables[ch][y]);
  for (ch=0; ch<3; ch++) out.raw(bodies[ch]);

  return out.done();
}

/* ---------- export ---------- */
/* The closing tag is written with an escaped slash — the conventional way
   to embed one script inside another without ending the outer block. */
var OPEN = '<script>', CLOSE = '<\/script>';

/* The exported piece has to carry its own reference: re-encode the loaded
   image through a canvas so it travels as a data URL inside the file. */
function refDataURL(){
  if (!refImg) return '';
  try {
    var c=document.createElement('canvas');
    var k=Math.min(1400/refImg.width, 1400/refImg.height, 1);
    c.width=Math.round(refImg.width*k); c.height=Math.round(refImg.height*k);
    c.getContext('2d').drawImage(refImg,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg', 0.82);
  } catch (err) { return ''; }
}

    '      var e = document.documentElement;',
    '      if (e.requestFullscreen) e.requestFullscreen();',
    '      else if (e.webkitRequestFullscreen) e.webkitRequestFullscreen();',
    '    } else {',
    '      if (document.exitFullscreen && isFull()) document.exitFullscreen();',
    '      else if (document.webkitExitFullscreen && isFull()) document.webkitExitFullscreen();',
    '    }',
    '  } catch (err) {}',
    '  apply();',
    '}',
    '/* Bind exactly one of these. Listening to several means a single tap',
    '   fires twice and cancels itself out. Pointer events cover iOS 13+,',
    '   touch and mouse alike; older browsers fall back to click. */',
    'if (window.PointerEvent) addEventListener("pointerup", toggle);',
    'else addEventListener("click", toggle);',
    'addEventListener("keydown", function(e){',
    '  if (e.key === "Escape" && full) { full=false; apply(); }',
    '  if (e.key === "f" || e.key === "Enter") toggle();',
    '});',
    '/* leaving fullscreen by Escape or a system gesture must match up */',
    'document.addEventListener("fullscreenchange", function(){',
    '  if (!isFull() && full) { full=false; apply(); }',
    '});',
    'document.addEventListener("webkitfullscreenchange", function(){',
    '  if (!isFull() && full) { full=false; apply(); }',
    '});',
    'function drawRef(){',
    '  if (!REF || !REF.width) return;',
    '  var k=Math.min(W/REF.width, H/REF.height);',
    '  var dw=REF.width*k, dh=REF.height*k;',
    '  ctx.globalAlpha=REF_OP; ctx.globalCompositeOperation=REF_BLEND;',
    '  ctx.drawImage(REF,(W-dw)/2,(H-dh)/2,dw,dh);',
    '  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;',
    '}',
    'function render(){',
    '  ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;',
    '  ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,W,H);',
    '  if (!REF_TOP) drawRef();',
    '  for (var i=0;i<layers.length;i++){ var l=layers[i]; if(!l.show) continue;',
    '    sheet.globalCompositeOperation="source-over"; sheet.globalAlpha=1;',
    '    sheet.clearRect(0,0,W,H);',
    '    if (l.ground.show){ sheet.globalAlpha=effOp(l.ground);',
    '      sheet.fillStyle=hsv(l.hue,100,BRI); sheet.fillRect(0,0,W,H); sheet.globalAlpha=1; }',
    '    var items=[];',
    '    for (var j=0;j<l.wiggles.length;j++){ if(!l.wiggles[j].show) continue;',
    '      items.push({ w:l.wiggles[j], pts:viewPts(l.wiggles[j]) }); }',
    '    if (items.length>1) keepApart(items, SEP.gap, SEP.thin, SEP.thinnest);',
    '    for (j=0;j<items.length;j++){',
    '      if (items[j].w.brush) brushStroke(items[j].pts, items[j].w, l.hue, items[j].squeeze);',
    '      else lineStroke(items[j].pts, items[j].w, l.hue, items[j].squeeze); }',
    '    ctx.globalCompositeOperation=l.blend; ctx.drawImage(sheetC,0,0,W,H); }',
    '  ctx.globalCompositeOperation="source-over";',
    '  if (REF_TOP) drawRef();',
    '}',
    'if (REF) REF.onload = function(){ fit(); render(); };',
    'var moves=layers.some(function(l){ if(!l.show) return false;',
    '  if (l.ground.show && l.ground.opDrift>0) return true;',
    '  return l.wiggles.some(function(w){',
    '    return w.show && (w.drift>0||w.satDrift>0||w.wDrift>0); }); }) &&',
    '  !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);',
    'function tick(){ t+=0.012; render(); raf=requestAnimationFrame(tick); }',
    'addEventListener("resize", function(){ fit(); render(); });',
    'addEventListener("orientationchange", function(){',
    '  setTimeout(function(){ fit(); render(); }, 150); });',
    'if (window.visualViewport)',
    '  visualViewport.addEventListener("resize", function(){ fit(); render(); });',
    'document.body.className="";',
    'fit(); render();',
    'if (moves) raf=requestAnimationFrame(tick);',
    CLOSE+'</body></html>'
  ].join('\n');
}

/* Draw every layer separately at export resolution and hand the lot to
   the PSD encoder. Geometry is stored 0-1, so re-rendering large is just
   a matter of pointing the globals at bigger buffers. */
function exportPSD(){
  var px = clamp(Math.round(el.psdPx && +el.psdPx.value) || 2000, 200, 8000);
  var k = px / Math.max(cmW, cmH);
  var pw = Math.max(1, Math.round(cmW * k)), ph = Math.max(1, Math.round(cmH * k));

  var oldW=W, oldH=H, oldR=R, oldSheet=sheet, oldSheetC=sheetC, oldBuf=buf, oldBufC=bufC;
  var sheets=[], i, j;
  var haveRef = !!(refImg && refShow);
  try {
    W=pw; H=ph; R=Math.min(pw,ph);
    sheetC=document.createElement('canvas'); sheetC.width=pw; sheetC.height=ph;
    sheet=sheetC.getContext('2d');
    bufC=document.createElement('canvas'); bufC.width=pw; bufC.height=ph;
    buf=bufC.getContext('2d');

    var mergedC=document.createElement('canvas'); mergedC.width=pw; mergedC.height=ph;
    var merged=mergedC.getContext('2d');
    merged.fillStyle='#ffffff'; merged.fillRect(0,0,pw,ph);

    /* layer 1 in the file is the reference, matching the panel numbering */
    if (haveRef){
      sheet.globalCompositeOperation='source-over';
      sheet.globalAlpha=refOpacity;
      sheet.clearRect(0,0,pw,ph);
      var rk=Math.min(pw/refImg.width, ph/refImg.height);
      var rw=refImg.width*rk, rh2=refImg.height*rk;
      sheet.drawImage(refImg,(pw-rw)/2,(ph-rh2)/2,rw,rh2);
      sheet.globalAlpha=1;
      sheets.push({ name:'Layer 1 Reference', blend:refBlend, show:true,
                    rgba:sheet.getImageData(0,0,pw,ph).data });
      merged.globalCompositeOperation=refBlend;
      merged.drawImage(sheetC,0,0);
      merged.globalCompositeOperation='source-over';
    }

    for (i=0;i<layers.length;i++){
      var l=layers[i];
      sheet.globalCompositeOperation='source-over';
      sheet.globalAlpha=1;
      sheet.clearRect(0,0,pw,ph);
      if (l.ground.show){
        sheet.globalAlpha=effOp(l.ground);
        sheet.fillStyle=hsv(l.hue,100,BRI);
        sheet.fillRect(0,0,pw,ph);
        sheet.globalAlpha=1;
      }
      var items=[];
      for (j=0;j<l.wiggles.length;j++){
        if (!l.wiggles[j].show) continue;
        items.push({ w:l.wiggles[j], pts:viewPts(l.wiggles[j]) });
      }
      if (items.length>1)
        keepApart(items, sepGap * (R/Math.min(oldW,oldH)), sepThin, sepThinnest);
      for (j=0;j<items.length;j++){
        if (items[j].w.brush) brushStroke(items[j].pts, items[j].w, l.hue, items[j].squeeze);
        else lineStroke(items[j].pts, items[j].w, l.hue, items[j].squeeze);
      }
      sheets.push({ name:'Layer '+(i+(haveRef?2:1)), blend:l.blend, show:vis(l),
                    rgba:sheet.getImageData(0,0,pw,ph).data });
      if (vis(l)){
        merged.globalCompositeOperation=l.blend;
        merged.drawImage(sheetC,0,0);
        merged.globalCompositeOperation='source-over';
      }
    }
    var mergedData = merged.getImageData(0,0,pw,ph).data;
    var bytes = buildPSD(pw, ph, sheets, mergedData);
    download(new Blob([bytes],{type:'image/vnd.adobe.photoshop'}),
             slug(el.titleValue||'Wiggle')+'.psd');
    flash(el.psdBtn, 'Saved '+pw+'x'+ph);
  } catch (err) {
    flash(el.psdBtn, 'PSD failed: '+(err && err.message));
  } finally {
    W=oldW; H=oldH; R=oldR;
    sheet=oldSheet; sheetC=oldSheetC; buf=oldBuf; bufC=oldBufC;
    render();
  }
}

/* A project file: everything the editor holds, in plain JSON. Small,
   readable, and versioned so an old file still opens after the format
   grows — anything missing falls back to the current default. */
var PROJECT_VERSION = 1;

function projectData(){
  return {
    format:'wiggle-layers', version:PROJECT_VERSION,
    title: el.titleValue || 'Wiggle',
    cmW:cmW, cmH:cmH, hueStep:hueStep, spread:spread, newBlend:newBlend,
    sepGap:sepGap, sepThin:sepThin, sepThinnest:sepThinnest,
    layers: layers.map(function(l){
      return { hue:l.hue, blend:l.blend, mute:!!l.mute, solo:!!l.solo, open:l.open,
        ground:{ opacity:l.ground.opacity, opDrift:l.ground.opDrift||0,
                 opSpeed:l.ground.opSpeed||1, seed:l.ground.seed||13,
                 show:l.ground.show, open:l.ground.open },
        wiggles: l.wiggles.map(function(w){
          return { sat:w.sat, w:w.w, wBase:w.wBase, tight:w.tight,
            tx:w.tx, ty:w.ty, rot:w.rot, scale:w.scale,
            satDrift:w.satDrift||0, satSpeed:w.satSpeed||1,
            wDrift:w.wDrift||0, wSpeed:w.wSpeed||1,
            drift:w.drift||0, speed:w.speed||1,
            brush:!!w.brush, load:w.load, swell:w.swell, bite:w.bite,
            n:w.n, maxN:w.maxN, grow:w.grow||'both', reach:w.reach||0.08,
            seedLen:w.seedLen||3, show:w.show, open:w.open,
            base: w.base.map(function(p){ return [ +p.x.toFixed(5), +p.y.toFixed(5) ]; }),
            pts:  w.pts.map(function(p){  return [ +p.x.toFixed(5), +p.y.toFixed(5) ]; }) };
        }) };
    })
  };
}

function saveProject(){
  var data = projectData();
  download(new Blob([JSON.stringify(data, null, 1)],{type:'application/json'}),
           slug(data.title)+'.wiggle.json');
  flash(el.saveBtn, 'Saved project');
}

/* ---------- autosave ----------
   The working state is written to this browser's local storage a moment
   after every change, and read back when the page opens. It survives a
   refresh, a closed tab and a crash. It is per-browser, not a file — so
   it complements Save project rather than replacing it. Every call is
   guarded: private windows and blocked storage simply mean no autosave
   rather than a broken editor. */
var AUTOKEY = 'wiggle-layers:autosave';
var autoTimer = null;

function store(){
  try { return window.localStorage; } catch (err) { return null; }
}
function autosaveNow(){
  var ls = store();
  if (!ls) return;
  try { ls.setItem(AUTOKEY, JSON.stringify(projectData())); }
  catch (err) {}                                  /* quota or private mode */
}
function queueSave(){
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = setTimeout(autosaveNow, 700);       /* after the slider settles */
}
function clearAutosave(){
  var ls = store();
  if (!ls) return;
  try { ls.removeItem(AUTOKEY); } catch (err) {}
}
function restoreAutosave(){
  var ls = store();
  if (!ls) return false;
  var text;
  try { text = ls.getItem(AUTOKEY); } catch (err) { return false; }
  if (!text) return false;
  try { loadProject(text, true); return true; }
  catch (err) { clearAutosave(); return false; }
}

function loadProject(text, quiet){
  var d;
  try { d = JSON.parse(text); }
  catch (err) { if (!quiet) flash(el.loadBtn, 'Not valid JSON'); return; }
  if (!d || d.format !== 'wiggle-layers' || !d.layers){
    if (!quiet) flash(el.loadBtn, 'Not a wiggle project'); return;
  }
  var pick = function(v, fallback){ return (v === undefined || v === null) ? fallback : v; };
  uid = 0;
  cmW = pick(d.cmW, 60); cmH = pick(d.cmH, 60);
  hueStep = pick(d.hueStep, 24);
  spread = pick(d.spread, 0.35);
  newBlend = pick(d.newBlend, 'multiply');
  sepGap = pick(d.sepGap, 6);
  sepThin = pick(d.sepThin, true);
  sepThinnest = pick(d.sepThinnest, 0.3);
  el.titleValue = pick(d.title, 'Wiggle');

  layers = d.layers.map(function(L){
    var l = newLayer(pick(L.hue,60), pick(L.blend,'source-over'));
    l.mute = !!L.mute; l.solo = !!L.solo; l.open = pick(L.open, true);
    var G = L.ground || {};
    l.ground.opacity = pick(G.opacity, 0.5);
    l.ground.opDrift = pick(G.opDrift, 0);
    l.ground.opSpeed = pick(G.opSpeed, 1);
    l.ground.seed    = pick(G.seed, l.ground.seed);
    l.ground.show    = pick(G.show, true);
    l.ground.open    = pick(G.open, false);
    l.wiggles = (L.wiggles || []).map(function(Wg){
      var w = newWiggle(0);
      var keys = ['sat','w','wBase','tight','tx','ty','rot','scale',
                  'satDrift','satSpeed','wDrift','wSpeed','drift','speed',
                  'load','swell','bite','n','maxN','grow','reach','seedLen'];
      keys.forEach(function(k){ if (Wg[k] !== undefined) w[k] = Wg[k]; });
      w.brush = !!Wg.brush;
      w.show  = pick(Wg.show, true);
      w.open  = pick(Wg.open, false);
      var toPt = function(a){ return { x:a[0], y:a[1] }; };
      if (Wg.base && Wg.base.length) w.base = Wg.base.map(toPt);
      w.pts = (Wg.pts && Wg.pts.length) ? Wg.pts.map(toPt)
                                        : w.base.map(function(p){ return {x:p.x,y:p.y}; });
      w.n = w.pts.length;
      return w;
    });
    return l;
  });
  if (!layers.length) layers = [newLayer(60,'source-over')];
  fixActive();
  build();
  relayout();
  refresh();
  if (!quiet) flash(el.loadBtn, 'Loaded');
}

function slug(s){
  return (String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'wiggle');
}
function doExport(){
  lastDoc = buildViewer();
  lastName = slug(el.titleValue||'Wiggle')+'.html';
  el.dump.value = lastDoc;
  el.dump.style.display='block';
  el.note.innerHTML = 'Paste this into GitHub (Add file, Create new file, name it '+
    '<code>index.html</code>), or save it as a file. '+
    'It is the whole artwork: settings, drift and all, with no controls.';
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(lastDoc).then(function(){ flash(el.exportBtn,'Copied'); },
      function(){ el.dump.focus(); el.dump.select(); flash(el.exportBtn,'Select text below'); });
  } else {
    el.dump.focus(); el.dump.select();
    flash(el.exportBtn,'Select text below');
  }
  download(new Blob([lastDoc],{type:'text/html'}), lastName);
}
function download(blob,name){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=name; a.target='_blank'; a.rel='noopener';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
  }catch(err){}
}
function flash(b,msg){
  var was=b.textContent;
  b.textContent=msg;
  setTimeout(function(){ b.textContent=was; }, 2200);
}
function savePNG(){
  var was=refShow;
  refShow=false; render();
  var name=slug(el.titleValue||'Wiggle')+'.png';
  if (cv.toBlob) cv.toBlob(function(b){
    if (b) download(b,name);
    refShow=was; render();
  },'image/png');
  else { refShow=was; render(); }
}

/* ---------- boot ---------- */
function fault(msg){
  var f=document.getElementById('fault');
  if (!f) return;
  f.style.display='block';
  f.textContent=msg;
}
function boot(){
  el.stage=document.getElementById('stage');
  el.panels=document.getElementById('panels');
  el.pts=document.getElementById('pts');
  el.dump=document.getElementById('dump');
  el.note=document.getElementById('note');
  el.exportBtn=document.getElementById('export');
  el.titleValue='Wiggle';

  cv=document.getElementById('cv');
  ctx=cv.getContext('2d');
  sheetC=document.createElement('canvas'); sheet=sheetC.getContext('2d');
  bufC=document.createElement('canvas'); buf=bufC.getContext('2d');

  COARSE = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  HIT = COARSE?26:14; DOT = COARSE?15:8;

  el.pts.addEventListener('change', function(){
    cv.className = el.pts.checked ? 'editing' : '';
    render();
  });
  el.fs = document.getElementById('fs');
  el.fs.addEventListener('change', function(){
    if (!el.fs.checked && isFull) setFull(false);
  });
  ['fullscreenchange','webkitfullscreenchange'].forEach(function(n){
    document.addEventListener(n, function(){
      var on = !!(document.fullscreenElement || document.webkitFullscreenElement);
      if (!on && isFull) setFull(false);
    });
  });
  document.getElementById('addLayer').addEventListener('click', function(){
    layers.push(newLayer((layers[0].hue+hueStep*layers.length)%360, newBlend));
    build(); refresh();
  });
  el.clearSolo = document.getElementById('clearSolo');
  el.clearSolo.addEventListener('click', function(){
    for (var i=0;i<layers.length;i++) layers[i].solo=false;
    build(); refresh();
  });
  el.saveBtn = document.getElementById('saveProject');
  el.loadBtn = document.getElementById('loadProject-l');
  el.saveBtn.addEventListener('click', saveProject);
  document.getElementById('loadProject').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){ loadProject(String(fr.result)); };
    fr.readAsText(f);
    e.target.value = '';                 /* so the same file can be reloaded */
  });
  el.exportBtn.addEventListener('click', doExport);
  document.getElementById('save').addEventListener('click', savePNG);
  el.psdPx = document.getElementById('psdPx');
  el.psdBtn = document.getElementById('psd');
  el.psdBtn.addEventListener('click', exportPSD);
  document.getElementById('reset').addEventListener('click', function(){
    clearAutosave();
    resetAll(); build(); refresh();
  });

  cv.addEventListener('pointerdown', onDown);
  cv.addEventListener('pointermove', onMove);
  cv.addEventListener('pointerup', onUp);
  cv.addEventListener('pointercancel', onUp);
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  document.addEventListener('keydown', function(e){
    if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if (e.key==='a'){ el.pts.checked=!el.pts.checked; cv.className=el.pts.checked?'editing':''; render(); }
    if (e.key==='Escape' && isFull) setFull(false);
    if (e.key==='f' && el.fs && el.fs.checked) setFull(!isFull);
    if (e.key==='s') savePNG();
    if (e.key==='r'){ clearAutosave(); resetAll(); build(); refresh(); }
  });

  el.note.textContent='Open a wiggle to make it active, tick anchors, then drag its dots.';
  resetAll();
  var restored = restoreAutosave();      /* picks up where the last session stopped */
  if (!restored){ build(); relayout(); refresh(); }
  if (restored) el.note.textContent =
    'Picked up where you left off. Reset clears this and starts fresh.';

  /* one last write when the tab goes away, in case a change was still pending */
  window.addEventListener('beforeunload', autosaveNow);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') autosaveNow();
  });
  if (window.requestAnimationFrame)
    requestAnimationFrame(function(){ fit(); render(); });
}
try { boot(); }
catch (err) { fault('Startup error: '+(err && (err.message||err))); }

</script>
